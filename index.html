<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>macOS Golden Gate</title>
<link rel="icon" href="./apple.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ════════════════════════════════════════════════════════════════
   TOKENS
════════════════════════════════════════════════════════════════ */
:root{
  --glass:rgba(255,255,255,.16);
  --glass-strong:rgba(255,255,255,.26);
  --glass-border:rgba(255,255,255,.20);
  --panel:rgba(28,30,42,.78);
  --panel-solid:rgba(24,26,38,.94);
  --menubar:rgba(20,22,32,.55);
  --text:#f5f7ff;
  --muted:rgba(245,247,255,.62);
  --muted2:rgba(245,247,255,.4);
  --accent:#0a84ff;
  --accent2:#409cff;
  --purple:#8b5cf6;
  --pink:#ff5ea8;
  --green:#30d158;
  --red:#ff5f57;
  --yellow:#febc2e;
  --shadow-win:0 30px 90px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.06);
  --shadow-panel:0 24px 70px rgba(0,0,0,.45);
  --blur-heavy:blur(46px) saturate(200%);
  --blur-med:blur(32px) saturate(180%);
  --radius-win:16px;
  --radius-panel:22px;
  --font:'Inter',-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;

  /* z-index scale */
  --z-desktop-icon:10;
  --z-widget:50;
  --z-win-base:100;
  --z-win-max:5000;
  --z-dock:6000;
  --z-mission:6500;
  --z-menubar:7000;
  --z-panel:7100;
  --z-spotlight:7200;
  --z-launchpad:7300;
  --z-context:7400;
  --z-lock:8500;
  --z-toast:9000;
  --z-dim:9500;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
body{
  font-family:var(--font);
  color:var(--text);
  user-select:none;-webkit-user-select:none;
  background:#0e1420;
  background-image:
    radial-gradient(circle at 16% 14%, rgba(255,199,93,.9) 0 10%, transparent 30%),
    radial-gradient(circle at 74% 20%, rgba(255,94,168,.78) 0 12%, transparent 34%),
    radial-gradient(circle at 46% 76%, rgba(10,132,255,.85) 0 16%, transparent 40%),
    linear-gradient(135deg,#1b0f34 0%,#0f2947 45%,#063c53 100%);
  background-size:cover;
  transition:background 0.6s ease;
}
.scrim{position:fixed;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(0,0,0,.14));pointer-events:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:4px}
::-webkit-scrollbar-track{background:transparent}
button,input{font-family:inherit}

/* ════════════════════════════════════════════════════════════════
   MENU BAR
════════════════════════════════════════════════════════════════ */
#menubar{
  position:fixed;top:0;left:0;right:0;height:28px;z-index:var(--z-menubar);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 10px;background:var(--menubar);
  backdrop-filter:var(--blur-heavy);-webkit-backdrop-filter:var(--blur-heavy);
  border-bottom:1px solid rgba(255,255,255,.1);
  font-size:13px;font-weight:500;
}
.mb-side{display:flex;align-items:center;height:100%;gap:1px}
.mb-btn{height:20px;display:flex;align-items:center;border-radius:5px;padding:0 8px;color:var(--text);cursor:default;letter-spacing:.1px}
.mb-btn:hover{background:rgba(255,255,255,.14)}
.mb-btn.active{background:rgba(255,255,255,.2)}
.mb-apple{width:26px;justify-content:center;padding:0}
.mb-apple img{width:12px;height:14px;filter:brightness(0) invert(1)}
.mb-appname{font-weight:700}
.mb-icon{width:26px;height:20px;display:flex;align-items:center;justify-content:center;border-radius:5px;cursor:default}
.mb-icon:hover{background:rgba(255,255,255,.14)}
.mb-icon svg{width:14px;height:14px;fill:currentColor}
.mb-clock{font-variant-numeric:tabular-nums;white-space:nowrap;padding:0 8px;border-radius:5px}
.mb-clock:hover{background:rgba(255,255,255,.14)}
.mb-battery{display:flex;align-items:center;gap:5px;padding:0 6px;border-radius:5px}
.mb-battery:hover{background:rgba(255,255,255,.14)}
.batt-shell{width:22px;height:11px;border:1.3px solid rgba(255,255,255,.7);border-radius:3px;position:relative;padding:1.5px}
.batt-shell::after{content:'';position:absolute;right:-3px;top:3px;width:2px;height:5px;background:rgba(255,255,255,.7);border-radius:0 1px 1px 0}
.batt-fill{height:100%;border-radius:1px;background:#fff}
.batt-fill.low{background:var(--red)}
.batt-pct{font-size:12px;font-variant-numeric:tabular-nums}

.menu-dropdown{
  position:fixed;top:28px;min-width:230px;padding:6px;z-index:var(--z-panel);
  background:var(--panel);border:1px solid var(--glass-border);border-radius:12px;
  box-shadow:var(--shadow-panel);backdrop-filter:var(--blur-heavy);-webkit-backdrop-filter:var(--blur-heavy);
  display:none;
}
.menu-dropdown.show{display:block;animation:menuIn .12s ease}
@keyframes menuIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.menu-item{padding:7px 11px;border-radius:8px;font-size:13px;display:flex;justify-content:space-between;gap:20px;cursor:default}
.menu-item:hover{background:var(--accent)}
.menu-item.disabled{opacity:.35;pointer-events:none}
.menu-item .kbd{color:var(--muted)}
.menu-sep{height:1px;background:rgba(255,255,255,.12);margin:5px 6px}

/* ════════════════════════════════════════════════════════════════
   DESKTOP
════════════════════════════════════════════════════════════════ */
#desktop{position:fixed;inset:28px 0 84px 0;z-index:1}
.desktop-icon{
  position:absolute;width:92px;padding:8px 6px;border-radius:12px;text-align:center;cursor:default;
  z-index:var(--z-desktop-icon);
}
.desktop-icon:hover,.desktop-icon.selected{background:rgba(255,255,255,.16);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.desktop-icon img{width:56px;height:56px;object-fit:contain;filter:drop-shadow(0 6px 14px rgba(0,0,0,.4));pointer-events:none}
.desktop-icon span{display:block;margin-top:5px;font-size:11px;font-weight:600;text-shadow:0 1px 6px rgba(0,0,0,.85);pointer-events:none}

/* ════════════════════════════════════════════════════════════════
   WIDGETS
════════════════════════════════════════════════════════════════ */
#widgets{
  position:fixed;right:16px;top:40px;width:300px;z-index:var(--z-widget);
  display:flex;flex-direction:column;gap:12px;transition:opacity .2s,transform .2s;
}
#widgets.hidden{opacity:0;transform:translateX(20px);pointer-events:none}
.widget{
  padding:16px;border-radius:22px;background:var(--glass);border:1px solid var(--glass-border);
  box-shadow:0 16px 44px rgba(0,0,0,.22);backdrop-filter:var(--blur-med);-webkit-backdrop-filter:var(--blur-med);
}
.widget-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.widget-hdr h3{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.w-weather .big{font-size:40px;font-weight:800;line-height:1}
.w-weather .wrow{display:flex;align-items:center;justify-content:space-between}
.w-weather .desc{font-size:13px;color:var(--muted);margin-top:2px}
.w-weather .icon{font-size:38px}
.w-weather .lohi{font-size:12px;color:var(--muted);margin-top:8px}

.w-calendar .cal-top{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.w-calendar .cal-day{font-size:34px;font-weight:800;line-height:1}
.w-calendar .cal-month{font-size:13px;color:var(--muted)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;font-size:10px;text-align:center}
.cal-grid .dow{color:var(--muted2);font-weight:700;padding-bottom:3px}
.cal-grid .d{padding:4px 0;border-radius:6px;color:var(--muted)}
.cal-grid .d.today{background:var(--accent);color:#fff;font-weight:700}
.cal-grid .d.blank{visibility:hidden}

.w-notes textarea{
  width:100%;min-height:82px;background:transparent;border:none;outline:none;resize:none;
  color:var(--text);font-family:inherit;font-size:12.5px;line-height:1.5;
}
.w-notes textarea::placeholder{color:var(--muted2)}

.w-clocks{display:flex;flex-direction:column;gap:8px}
.w-clocks .crow{display:flex;justify-content:space-between;align-items:baseline;font-size:13px}
.w-clocks .crow .place{color:var(--muted)}
.w-clocks .crow .time{font-variant-numeric:tabular-nums;font-weight:600}

/* ════════════════════════════════════════════════════════════════
   DOCK
════════════════════════════════════════════════════════════════ */
#dock-wrap{position:fixed;left:0;right:0;bottom:0;height:96px;z-index:var(--z-dock);display:flex;align-items:flex-end;justify-content:center;pointer-events:none}
#dock{
  display:flex;align-items:flex-end;gap:6px;padding:8px 10px;margin-bottom:9px;
  border-radius:24px;background:rgba(245,247,255,.16);border:1px solid var(--glass-border);
  box-shadow:0 26px 70px rgba(0,0,0,.42);backdrop-filter:var(--blur-heavy);-webkit-backdrop-filter:var(--blur-heavy);
  pointer-events:auto;
}
.dock-item{
  width:52px;height:52px;border-radius:14px;position:relative;display:grid;place-items:center;
  transition:transform .14s cubic-bezier(.2,.8,.3,1.2),margin .14s ease;cursor:default;
}
.dock-item img{width:50px;height:50px;object-fit:contain;pointer-events:none}
.dock-item.bounce{animation:dockBounce .5s ease}
@keyframes dockBounce{0%,100%{transform:translateY(0)}30%{transform:translateY(-18px)}50%{transform:translateY(0)}65%{transform:translateY(-8px)}80%{transform:translateY(0)}}
.dock-tip{
  position:absolute;bottom:66px;left:50%;transform:translateX(-50%);padding:4px 10px;border-radius:8px;
  background:rgba(20,22,32,.88);border:1px solid var(--glass-border);font-size:12px;white-space:nowrap;
  opacity:0;pointer-events:none;transition:opacity .1s;
}
.dock-item:hover .dock-tip{opacity:1}
.dock-dot{position:absolute;bottom:-6px;width:5px;height:5px;border-radius:50%;background:#fff}
.dock-sep{width:1px;height:40px;background:rgba(255,255,255,.22);margin:0 3px;align-self:center}

/* ════════════════════════════════════════════════════════════════
   WINDOWS
════════════════════════════════════════════════════════════════ */
#window-layer{position:fixed;inset:0;pointer-events:none;z-index:var(--z-win-base)}
.win{
  position:absolute;min-width:340px;min-height:220px;display:flex;flex-direction:column;overflow:hidden;
  border-radius:var(--radius-win);background:rgba(244,247,255,.14);border:1px solid var(--glass-border);
  box-shadow:var(--shadow-win);backdrop-filter:var(--blur-heavy);-webkit-backdrop-filter:var(--blur-heavy);
  pointer-events:auto;transition:box-shadow .15s;
}
.win.active{border-color:rgba(255,255,255,.34)}
.win.dragging,.win.resizing{transition:none}
.win.full{inset:28px 0 0 0!important;width:100%!important;height:calc(100% - 28px)!important;border-radius:0}
.win.min{transform:scale(.06) translateY(700px);opacity:0;pointer-events:none}
.win.mission{transition:transform .32s cubic-bezier(.2,.7,.3,1), opacity .2s}
.win.opening{animation:winOpen .18s cubic-bezier(.2,.8,.3,1.1)}
@keyframes winOpen{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}

.winbar{
  height:38px;display:flex;align-items:center;padding:0 12px;flex-shrink:0;
  background:rgba(18,20,30,.32);border-bottom:1px solid rgba(255,255,255,.1);cursor:default;
}
.lights{display:flex;gap:8px;width:70px}
.lt{width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.18);position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer}
.lt.r{background:var(--red)}.lt.y{background:var(--yellow)}.lt.g{background:var(--green)}
.lt svg{width:7px;height:7px;opacity:0;fill:rgba(0,0,0,.55)}
.winbar:hover .lt svg{opacity:1}
.win-title{flex:1;text-align:center;font-weight:600;font-size:13px;color:rgba(255,255,255,.92);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px}
.win-title-spacer{width:70px}
.win-body{flex:1;overflow:hidden;background:rgba(8,10,18,.18);position:relative}
.win-body iframe{width:100%;height:100%;border:0;background:#fff}
.win-loading-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,12,20,.5);color:var(--muted);font-size:13px}
.win-fallback{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#fff;text-align:center;padding:30px;background:linear-gradient(135deg,rgba(10,132,255,.25),rgba(139,92,246,.25))}
.win-fallback .ic{font-size:40px}
.win-fallback h2{font-size:18px}
.win-fallback p{font-size:13px;color:rgba(255,255,255,.7);max-width:280px}
.resize-handle{position:absolute}
.rz-e{right:-3px;top:6px;bottom:6px;width:7px;cursor:ew-resize}
.rz-w{left:-3px;top:6px;bottom:6px;width:7px;cursor:ew-resize}
.rz-s{bottom:-3px;left:6px;right:6px;height:7px;cursor:ns-resize}
.rz-se{right:-3px;bottom:-3px;width:14px;height:14px;cursor:nwse-resize}
.rz-sw{left:-3px;bottom:-3px;width:14px;height:14px;cursor:nesw-resize}

/* window snap preview */
#snap-preview{position:fixed;z-index:var(--z-win-max);background:rgba(10,132,255,.28);border:2px solid rgba(10,132,255,.7);border-radius:12px;display:none;pointer-events:none;transition:all .08s ease}

/* ════════════════════════════════════════════════════════════════
   MISSION CONTROL
════════════════════════════════════════════════════════════════ */
#mission-control{position:fixed;inset:0;z-index:var(--z-mission);display:none;background:rgba(6,8,16,.42);backdrop-filter:blur(38px) saturate(160%)}
#mission-control.show{display:block}
.mc-hint{position:fixed;top:40px;left:50%;transform:translateX(-50%);font-size:14px;color:rgba(255,255,255,.75);letter-spacing:.3px}
.mc-empty{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:rgba(255,255,255,.6)}
.mc-empty .ic{font-size:48px;margin-bottom:10px}

/* ════════════════════════════════════════════════════════════════
   CONTROL CENTER
════════════════════════════════════════════════════════════════ */
#control-center{
  position:fixed;right:10px;top:34px;width:340px;z-index:var(--z-panel);padding:14px;border-radius:var(--radius-panel);
  background:var(--panel);border:1px solid var(--glass-border);box-shadow:var(--shadow-panel);
  backdrop-filter:var(--blur-heavy);-webkit-backdrop-filter:var(--blur-heavy);display:none;
}
#control-center.show{display:block;animation:menuIn .14s ease}
.cc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cc-tile{padding:12px;border-radius:16px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.08);cursor:pointer;transition:background .12s}
.cc-tile:hover{background:rgba(255,255,255,.12)}
.cc-tile.on{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent}
.cc-tile .cc-ic{font-size:16px;margin-bottom:6px}
.cc-tile b{display:block;font-size:12.5px;font-weight:700}
.cc-tile small{color:var(--muted);font-size:11px}
.cc-tile.on small{color:rgba(255,255,255,.85)}
.cc-slider-card{margin-top:10px;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.08)}
.cc-slider-card .cc-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:12.5px;font-weight:600}
.cc-slider-card input[type=range]{width:100%;accent-color:#fff}

/* screen dim overlay */
#dim-overlay{position:fixed;inset:0;z-index:var(--z-dim);background:#000;opacity:0;pointer-events:none;transition:opacity .1s}

/* ════════════════════════════════════════════════════════════════
   SPOTLIGHT
════════════════════════════════════════════════════════════════ */
#spotlight{position:fixed;inset:0;z-index:var(--z-spotlight);display:none;align-items:flex-start;justify-content:center;padding-top:15vh;background:rgba(0,0,0,.26);backdrop-filter:blur(10px)}
#spotlight.show{display:flex}
.sp-box{width:640px;max-width:92vw;border-radius:20px;overflow:hidden;background:var(--panel);border:1px solid var(--glass-border);box-shadow:var(--shadow-panel)}
.sp-input-row{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid rgba(255,255,255,.1)}
.sp-input-row svg{width:20px;height:20px;fill:var(--muted);flex-shrink:0}
#spotlight-input{flex:1;background:transparent;border:0;outline:0;color:#fff;font-size:21px}
.sp-tabs{display:flex;gap:4px;padding:8px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.sp-tab{padding:5px 11px;border-radius:8px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
.sp-tab.active{background:var(--accent);color:#fff}
.sp-results{max-height:340px;overflow-y:auto;padding:6px}
.sp-result{display:flex;align-items:center;gap:12px;padding:9px 14px;margin:2px;border-radius:11px;cursor:pointer}
.sp-result.on,.sp-result:hover{background:var(--accent)}
.sp-result img{width:30px;height:30px;object-fit:contain}
.sp-result .rname{font-size:14px;font-weight:600}
.sp-result .rsub{font-size:11px;color:var(--muted)}
.sp-empty{padding:30px;text-align:center;color:var(--muted);font-size:13px}

/* ════════════════════════════════════════════════════════════════
   LAUNCHPAD
════════════════════════════════════════════════════════════════ */
#launchpad{position:fixed;inset:0;z-index:var(--z-launchpad);display:none;background:rgba(4,6,12,.5);backdrop-filter:blur(40px) saturate(160%);padding:9vh 8vw}
#launchpad.show{display:block;animation:lpIn .16s ease}
@keyframes lpIn{from{opacity:0}to{opacity:1}}
.lp-search{width:280px;margin:0 auto 40px;display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:10px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.12)}
.lp-search input{flex:1;background:transparent;border:0;outline:0;color:#fff;font-size:13px}
.lp-search svg{width:14px;height:14px;fill:var(--muted)}
.lp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:26px;max-width:900px;margin:0 auto}
.lp-app{text-align:center;font-weight:700;cursor:default}
.lp-app img{width:72px;height:72px;object-fit:contain;filter:drop-shadow(0 8px 16px rgba(0,0,0,.4));transition:transform .1s}
.lp-app:hover img{transform:scale(1.08)}
.lp-app span{display:block;margin-top:8px;font-size:11.5px;text-shadow:0 1px 4px rgba(0,0,0,.6)}

/* ════════════════════════════════════════════════════════════════
   CONTEXT MENU / TOAST / LOCK
════════════════════════════════════════════════════════════════ */
.context-menu{position:fixed;min-width:190px;padding:6px;z-index:var(--z-context);background:var(--panel);border:1px solid var(--glass-border);border-radius:12px;box-shadow:var(--shadow-panel);backdrop-filter:var(--blur-heavy);display:none}
.context-menu.show{display:block;animation:menuIn .1s ease}

#toasts{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);z-index:var(--z-toast);display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{padding:10px 20px;border-radius:999px;background:rgba(20,22,32,.9);border:1px solid var(--glass-border);opacity:0;transform:translateY(14px);transition:.22s;font-size:13px}
.toast.show{opacity:1;transform:translateY(0)}

#lock-screen{position:fixed;inset:0;z-index:var(--z-lock);display:none;align-items:center;justify-content:center;flex-direction:column;gap:18px;background:linear-gradient(135deg,#1b0f34,#0f2947 55%,#063c53);backdrop-filter:blur(4px)}
#lock-screen.show{display:flex}
.lock-clock{font-size:78px;font-weight:300;font-variant-numeric:tabular-nums}
.lock-date{font-size:17px;color:var(--muted);margin-top:-8px}
.lock-hint{margin-top:26px;font-size:13px;color:var(--muted2);padding:10px 20px;border-radius:999px;background:rgba(255,255,255,.08);cursor:pointer}
.lock-hint:hover{background:rgba(255,255,255,.14)}

/* ════════════════════════════════════════════════════════════════
   RESPONSIVE
════════════════════════════════════════════════════════════════ */
@media(max-width:820px){
  .mb-btn:not(.mb-appname):not(.mb-apple){display:none}
  #widgets{display:none}
  .win{left:6px!important;top:34px!important;width:calc(100vw - 12px)!important;height:calc(100vh - 118px)!important}
  #control-center{width:92vw;right:4vw}
}
</style>
</head>
<body>
<div class="scrim"></div>
<div id="dim-overlay"></div>

<!-- MENU BAR -->
<div id="menubar">
  <div class="mb-side" id="mb-left">
    <div class="mb-btn mb-apple" id="mb-apple"><img src="./apple.png" alt="Apple"></div>

<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};

function safe(fn,fb){ try{ return fn(); } catch(e){ console.error(e); toast('Recovered from an error'); return fb; } }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function load(k,d){ return safe(function(){ var v=localStorage.getItem(k); return v!=null?JSON.parse(v):d; },d); }
function save(k,v){ safe(function(){ localStorage.setItem(k,JSON.stringify(v)); }); }
window.addEventListener('error',function(e){ console.error('Recovered global error:',e.message); },true);
window.addEventListener('unhandledrejection',function(e){ console.error('Recovered promise error:',e.reason); });

/* ════════════════════════════════════════════════════════════════
   STORAGE MIGRATION
════════════════════════════════════════════════════════════════ */
var STORAGE_VERSION='golden-gate-2';
if(load('gg-version')!==STORAGE_VERSION){
  ['gg-windows'].forEach(function(k){ localStorage.removeItem(k); });
  save('gg-version',STORAGE_VERSION);
}

/* ════════════════════════════════════════════════════════════════
   APP REGISTRY
════════════════════════════════════════════════════════════════ */
var APPS=[
  {name:'Finder',   icon:'./images/Finder.png',    internal:'finder', w:900, h:610},
  {name:'Safari',   icon:'./images/Safari.png',    internal:'browser',w:1040,h:680},
  {name:'YouTube',  icon:'./images/Youtube.png',   url:'./apps/YouTube/yt.html',      w:1000,h:650},
  {name:'ChatGPT',  icon:'./images/ChatGPT.png',   url:'./apps/AI/GPT.html',          w:820, h:590},
  {name:'Settings', icon:'./images/Settings.png',  url:'./apps/System/Settings.html', w:900, h:620},
  {name:'Terminal', icon:'./images/Terminal.png',  url:'./apps/System/terminal.html', w:760, h:460},
  {name:'Steam',    icon:'./images/Steam.png',     url:'./apps/Steam/steam.html',     w:990, h:650},
  {name:'Music',    icon:'./images/Music.png',     internal:'music',  w:900, h:610},
  {name:'Ampler',   icon:'./images/Ampler.png',    url:'./apps/Ampler/index.html',    w:990, h:650},
  {name:'App Tester',icon:'./images/AppTester.png',internal:'tester', w:760, h:520}
];

var MAX_WINDOWS=18;
var wins=[]; var zTop=var_zBase();
function var_zBase(){ return 100; }
var z=100;
var pins=load('gg-pins',null)||APPS.reduce(function(o,a){o[a.name]=true;return o;},{});
var iconPos=load('gg-icons',{});
var drag=null,resize=null,spotIndex=0,spotCat='all';
var missionActive=false, missionState=[];

/* ════════════════════════════════════════════════════════════════
   Z-INDEX RENORMALIZATION
════════════════════════════════════════════════════════════════ */
function front(w){
  z++;
  if(z>4900){ renormalizeZ(); z=wins.length+101; }
  wins.forEach(function(x){ x.el.classList.remove('active'); });
  w.el.classList.add('active');
  w.el.style.zIndex=z;
  $('#mb-appname').textContent=w.app.name;
  persist();
}
function renormalizeZ(){
  var ordered=wins.slice().sort(function(a,b){ return (+a.el.style.zIndex||0)-(+b.el.style.zIndex||0); });
  ordered.forEach(function(w,i){ w.el.style.zIndex=100+i; });
}

/* ════════════════════════════════════════════════════════════════
   CLOCK / BATTERY
════════════════════════════════════════════════════════════════ */
function tick(){
  var d=new Date();
  var t=d.toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'})+'  '+d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
  $('#clock').textContent=t;
  var lc=$('#lock-clock'); if(lc) lc.textContent=d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
  var ld=$('#lock-date'); if(ld) ld.textContent=d.toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'});
}
setInterval(tick,1000); tick();

function initBattery(){
  if(!navigator.getBattery){ return; }
  navigator.getBattery().then(function(b){
    $('#battery-wrap').style.display='flex';
    function render(){
      var pct=Math.round(b.level*100);
      $('#batt-pct').textContent=pct+'%'+(b.charging?' ':'');
      $('#batt-fill').style.width=pct+'%';
      $('#batt-fill').classList.toggle('low',pct<=20 && !b.charging);
    }
    render();
    b.addEventListener('levelchange',render);
    b.addEventListener('chargingchange',render);
  }).catch(function(){});
}
initBattery();

/* ════════════════════════════════════════════════════════════════
   TOASTS
════════════════════════════════════════════════════════════════ */
function toast(msg){
  var t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  $('#toasts').appendChild(t);
  requestAnimationFrame(function(){ t.classList.add('show'); });
  setTimeout(function(){ t.classList.remove('show'); setTimeout(function(){ t.remove(); },250); },2200);
}

/* ════════════════════════════════════════════════════════════════
   DESKTOP ICONS
════════════════════════════════════════════════════════════════ */
function buildDesktop(){
  var d=$('#desktop'); d.innerHTML='';
  APPS.forEach(function(a,i){
    var p=iconPos[a.name]||{x:24+(i%3)*106,y:20+Math.floor(i/3)*104};
    var el=document.createElement('div');
    el.className='desktop-icon'; el.style.left=p.x+'px'; el.style.top=p.y+'px'; el.dataset.i=i;
    el.innerHTML='<img src="'+esc(a.icon)+'" onerror="this.style.opacity=.2"><span>'+esc(a.name)+'</span>';
    el.ondblclick=function(){ openApp(i); };
    el.onclick=function(e){ e.stopPropagation(); $$('.desktop-icon').forEach(function(x){ x.classList.remove('selected'); }); el.classList.add('selected'); };
    el.oncontextmenu=function(e){
      e.preventDefault(); e.stopPropagation();
      showContextMenu(e.clientX,e.clientY,[
        ['Open',function(){ openApp(i); }],
        ['Add to Dock',function(){ pins[a.name]=true; save('gg-pins',pins); buildDock(); toast(a.name+' added to Dock'); }],
        ['Get Info',function(){ toast(a.name+' — WebOS Application'); }]
      ]);
    };
    d.appendChild(el);
  });
}
$('#desktop').addEventListener('mousedown',function(e){
  var ic=e.target.closest('.desktop-icon'); if(!ic) return;
  var ox=e.clientX-ic.offsetLeft, oy=e.clientY-ic.offsetTop;
  function move(ev){
    ic.style.left=Math.max(0,Math.min(ev.clientX-ox,innerWidth-92))+'px';
    ic.style.top=Math.max(0,Math.min(ev.clientY-oy,innerHeight-190))+'px';
  }
  function up(){
    var a=APPS[+ic.dataset.i];
    iconPos[a.name]={x:parseInt(ic.style.left),y:parseInt(ic.style.top)};
    save('gg-icons',iconPos);
    document.removeEventListener('mousemove',move);
    document.removeEventListener('mouseup',up);
  }
  document.addEventListener('mousemove',move);
  document.addEventListener('mouseup',up);
});
document.addEventListener('click',function(e){
  if(!e.target.closest('.desktop-icon')) $$('.desktop-icon').forEach(function(x){ x.classList.remove('selected'); });
});

/* ════════════════════════════════════════════════════════════════
   DOCK
════════════════════════════════════════════════════════════════ */
function buildDock(){
  var d=$('#dock'); var open={};
  wins.forEach(function(w){ open[w.app.name]=true; });
  d.innerHTML='';
  APPS.filter(function(a){ return pins[a.name]||open[a.name]; }).forEach(function(a){
    var item=document.createElement('div'); item.className='dock-item';
    item.innerHTML='<img src="'+esc(a.icon)+'" onerror="this.style.opacity=.2"><div class="dock-tip">'+esc(a.name)+'</div>'+(open[a.name]?'<div class="dock-dot"></div>':'');
    item.onclick=function(){ openApp(APPS.indexOf(a)); };
    item.oncontextmenu=function(e){
      e.preventDefault();
      var items=[];
      if(open[a.name]) items.push(['Quit',function(){ wins.filter(function(w){return w.app.name===a.name;}).forEach(closeWin); }]);
      items.push([pins[a.name]?'Remove from Dock':'Keep in Dock',function(){ pins[a.name]=!pins[a.name]; save('gg-pins',pins); buildDock(); }]);
      showContextMenu(e.clientX,e.clientY,items);
    };
    d.appendChild(item);
  });
  d.addEventListener('mousemove',function(e){
    $$('.dock-item',d).forEach(function(it){
      var r=it.getBoundingClientRect(); var dist=Math.abs(e.clientX-(r.left+r.width/2));
      var scale=Math.max(1,1.5-dist/140); it.style.transform='scale('+scale+') translateY(-'+((scale-1)*20)+'px)';
    });
  });
  d.addEventListener('mouseleave',function(){ $$('.dock-item',d).forEach(function(it){ it.style.transform=''; }); });
}

/* ════════════════════════════════════════════════════════════════
   FALLBACK / INTERNAL APP CONTENT
════════════════════════════════════════════════════════════════ */
function internalSrcdoc(app){
  var title=esc(app.name);
  var cards={
    finder:['AirDrop','Applications','Desktop','Documents','Downloads','Golden Gate'],
    browser:['Favorites','Privacy Report','Reader','Profiles','Passkeys','Tab Groups'],
    music:['Library','Radio','Spatial Audio','Recently Added','Golden Gate Mix','Now Playing'],
    tester:['Crash Guard','Storage Check','Iframe Fallback','Responsive Layout','Keyboard Shortcuts','Window Restore']
  }[app.internal]||[];
  return '<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>'+
    'body{margin:0;min-height:100vh;font-family:-apple-system,Inter,sans-serif;color:#fff;background:linear-gradient(135deg,#172033,#18294c 50%,#40306d);overflow:auto}'+
    '.wrap{padding:28px}.hero{padding:24px;border-radius:22px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(24px)}'+
    'h1{margin:0 0 8px;font-size:32px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:18px}'+
    '.card{padding:18px;border-radius:16px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.12);min-height:88px}'+
    '.pill{display:inline-block;margin-top:14px;padding:7px 12px;border-radius:999px;background:#0a84ff;font-weight:700;font-size:13px}'+
    '</style></head><body><div class="wrap"><div class="hero"><h1>'+title+'</h1>'+
    '<p style="color:rgba(255,255,255,.7)">Built-in Golden Gate experience with local content and crash-resistant rendering.</p>'+
    '<span class="pill">Ready</span></div><div class="grid">'+
    cards.map(function(c){ return '<div class="card"><b>'+esc(c)+'</b><p style="color:rgba(255,255,255,.55);margin-top:6px;font-size:12px">Available</p></div>'; }).join('')+
    '</div></div></body></html>';
}
function fallbackHTML(app){
  return '<div class="win-fallback"><div class="ic">🧩</div><h2>'+esc(app.name)+' is not available</h2>'+
    '<p>The file for this app could not be found. Check the path in your APPS list.</p></div>';
}

/* ════════════════════════════════════════════════════════════════
   WINDOW MANAGEMENT
════════════════════════════════════════════════════════════════ */
function openApp(i){
  var app=APPS[i]; if(!app) return;
  var ex=wins.find(function(w){ return w.app.name===app.name; });
  if(ex){ ex.el.classList.remove('min'); front(ex); bounceDock(app.name); return; }
  if(wins.length>=MAX_WINDOWS){ toast('Too many windows open — close one first'); return; }
  createWin(app);
}

function bounceDock(name){
  $$('.dock-item',$('#dock')).forEach(function(it){
    var tip=$('.dock-tip',it);
    if(tip && tip.textContent===name){ it.classList.remove('bounce'); void it.offsetWidth; it.classList.add('bounce'); }
  });
}

function createWin(app,saved){
  saved=saved||{};
  var el=document.createElement('div');
  el.className='win opening';
  var w0=saved.w||app.w||820, h0=saved.h||app.h||560;
  el.style.width=w0+'px'; el.style.height=h0+'px';
  el.style.left=(saved.x!=null?saved.x:Math.max(12,(innerWidth-w0)/2))+'px';
  el.style.top=(saved.y!=null?saved.y:Math.max(40,(innerHeight-h0)/2-20))+'px';
  if(saved.full) el.classList.add('full');
  if(saved.min) el.classList.add('min');

  el.innerHTML=
    '<div class="winbar">'+
      '<div class="lights">'+
        '<div class="lt r" data-act="close"><svg viewBox="0 0 8 8"><path d="M1 1l6 6M7 1L1 7" stroke="black" stroke-width="1.4"/></svg></div>'+
        '<div class="lt y" data-act="min"><svg viewBox="0 0 8 8"><path d="M1 4h6" stroke="black" stroke-width="1.4"/></svg></div>'+
        '<div class="lt g" data-act="full"><svg viewBox="0 0 8 8"><path d="M1 1h6v6H1z" stroke="black" stroke-width="1.2" fill="none"/></svg></div>'+
      '</div>'+
      '<div class="win-title">'+esc(app.name)+'</div>'+
      '<div class="win-title-spacer"></div>'+
    '</div>'+
    '<div class="win-body"><div class="win-loading-overlay">Loading…</div></div>'+
    '<div class="resize-handle rz-e"></div><div class="resize-handle rz-w"></div>'+
    '<div class="resize-handle rz-s"></div><div class="resize-handle rz-se"></div><div class="resize-handle rz-sw"></div>';

  $('#window-layer').appendChild(el);
  setTimeout(function(){ el.classList.remove('opening'); },200);

  var body=$('.win-body',el);
  var loadApp=function(){
    if(app.internal){
      var f=document.createElement('iframe'); f.setAttribute('sandbox','allow-scripts allow-forms allow-popups allow-same-origin allow-presentation'); f.srcdoc=internalSrcdoc(app);
      body.innerHTML=''; body.appendChild(f);
      return;
    }
    fetch(app.url,{method:'HEAD'}).then(function(r){
      body.innerHTML='';
      if(r.ok){
        var f=document.createElement('iframe');
        f.setAttribute('sandbox','allow-scripts allow-forms allow-popups allow-same-origin allow-presentation');
        f.allowFullscreen=true; f.src=app.url;
        f.onerror=function(){ body.innerHTML=fallbackHTML(app); };
        body.appendChild(f);
      } else {
        body.innerHTML=fallbackHTML(app);
      }
    }).catch(function(){
      // some static hosts don't support HEAD — fall back to trying a normal load
      body.innerHTML='';
      var f=document.createElement('iframe');
      f.setAttribute('sandbox','allow-scripts allow-forms allow-popups allow-same-origin allow-presentation');
      f.allowFullscreen=true; f.src=app.url;
      f.onerror=function(){ body.innerHTML=fallbackHTML(app); };
      body.appendChild(f);
    });
  };
  loadApp();

  var w={ el:el, app:app };
  wins.push(w);

  $$('.lt',el).forEach(function(lt){
    lt.onclick=function(e){
      e.stopPropagation();
      var act=lt.dataset.act;
      if(act==='close') closeWin(w);
      else if(act==='min'){ el.classList.toggle('min'); persist(); buildDock(); }
      else if(act==='full'){ el.classList.toggle('full'); persist(); }
    };
  });

  $('.winbar',el).onmousedown=function(e){
    if(e.target.closest('.lt')||el.classList.contains('full')) return;
    drag={ w:w, dx:e.clientX-el.offsetLeft, dy:e.clientY-el.offsetTop };
    front(w); e.preventDefault();
  };
  $('.winbar',el).ondblclick=function(e){ if(!e.target.closest('.lt')){ el.classList.toggle('full'); persist(); } };

  ['e','w','s','se','sw'].forEach(function(dir){
    $('.rz-'+dir,el).onmousedown=function(e){
      resize={ w:w, dir:dir, sx:e.clientX, sy:e.clientY, sw:el.offsetWidth, sh:el.offsetHeight, sl:el.offsetLeft, st:el.offsetTop };
      front(w); e.preventDefault(); e.stopPropagation();
    };
  });

  el.onmousedown=function(){ if(!missionActive) front(w); };
  el.oncontextmenu=function(e){
    if(e.target.closest('.win-body')) return;
    e.preventDefault();
    showContextMenu(e.clientX,e.clientY,[
      ['Close', function(){ closeWin(w); }],
      ['Minimize', function(){ el.classList.toggle('min'); persist(); buildDock(); }],
      ['Full Screen', function(){ el.classList.toggle('full'); persist(); }]
    ]);
  };

  front(w); persist(); buildDock();
}

function closeWin(w){
  w.el.remove();
  wins=wins.filter(function(x){ return x!==w; });
  var t=wins[wins.length-1];
  $('#mb-appname').textContent=t?t.app.name:'Finder';
  persist(); buildDock();
}

function topWin(){
  return wins.slice().sort(function(a,b){ return (+b.el.style.zIndex||0)-(+a.el.style.zIndex||0); })[0];
}

function persist(){
  save('gg-windows', wins.map(function(w){
    return {
      name:w.app.name,
      x:parseInt(w.el.style.left)||0, y:parseInt(w.el.style.top)||40,
      w:parseInt(w.el.style.width)||800, h:parseInt(w.el.style.height)||500,
      full:w.el.classList.contains('full'), min:w.el.classList.contains('min'),
      z:parseInt(w.el.style.zIndex)||100
    };
  }));
}

/* dragging / resizing (single delegated handler — no per-window listeners) */
document.addEventListener('mousemove',function(e){
  if(drag && drag.w && !missionActive){
    var el=drag.w.el;
    var nx=Math.max(-el.offsetWidth+140,Math.min(e.clientX-drag.dx,innerWidth-90));
    var ny=Math.max(28,Math.min(e.clientY-drag.dy,innerHeight-50));
    el.style.left=nx+'px'; el.style.top=ny+'px';
    showSnapPreview(e.clientX);
  }
  if(resize && resize.w){
    var w=resize.w, el=w.el, dx=e.clientX-resize.sx, dy=e.clientY-resize.sy;
    if(resize.dir.indexOf('e')>-1) el.style.width=Math.max(340,resize.sw+dx)+'px';
    if(resize.dir.indexOf('s')>-1) el.style.height=Math.max(220,resize.sh+dy)+'px';
    if(resize.dir.indexOf('w')>-1){ var nw=Math.max(340,resize.sw-dx); el.style.width=nw+'px'; el.style.left=(resize.sl+resize.sw-nw)+'px'; }
  }
});
document.addEventListener('mouseup',function(e){
  if(drag){
    applySnap(e.clientX,drag.w);
    persist();
  }
  if(resize) persist();
  drag=null; resize=null;
  $('#snap-preview').style.display='none';
});
function showSnapPreview(x){
  var edge=24, sp=$('#snap-preview');
  if(x<edge){ sp.style.cssText='display:block;left:0;top:28px;width:50%;height:calc(100% - 28px)'; }
  else if(x>innerWidth-edge){ sp.style.cssText='display:block;left:50%;top:28px;width:50%;height:calc(100% - 28px)'; }
  else { sp.style.display='none'; }
}
function applySnap(x,w){
  var edge=24, el=w.el;
  if(x<edge){ el.style.left='0px'; el.style.top='28px'; el.style.width='50%'; el.style.height='calc(100% - 28px)'; }
  else if(x>innerWidth-edge){ el.style.left='50%'; el.style.top='28px'; el.style.width='50%'; el.style.height='calc(100% - 28px)'; }
}

window.addEventListener('resize',function(){
  wins.forEach(function(w){
    w.el.style.left=Math.min(parseInt(w.el.style.left)||0,innerWidth-120)+'px';
    w.el.style.top=Math.min(parseInt(w.el.style.top)||40,innerHeight-80)+'px';
  });
});

/* ════════════════════════════════════════════════════════════════
   MISSION CONTROL
════════════════════════════════════════════════════════════════ */
function enterMission(){
  var visible=wins.filter(function(w){ return !w.el.classList.contains('min'); });
  if(!visible.length){ toast('No open windows'); return; }
  missionActive=true; missionState=[];
  $('#mission-control').classList.add('show');
  var cols=Math.ceil(Math.sqrt(visible.length));
  var rows=Math.ceil(visible.length/cols);
  var pad=60, top=70, availW=innerWidth-pad*2, availH=innerHeight-top-pad;
  var cw=availW/cols, ch=availH/rows;
  visible.forEach(function(w,i){
    var col=i%cols, row=Math.floor(i/cols);
    var ow=w.el.offsetWidth, oh=w.el.offsetHeight;
    var scale=Math.min((cw-20)/ow,(ch-20)/oh,1);
    var tx=pad+col*cw+(cw-ow*scale)/2 - w.el.offsetLeft;
    var ty=top+row*ch+(ch-oh*scale)/2 - w.el.offsetTop;
    missionState.push({ w:w, prevTransform:w.el.style.transform, prevZ:w.el.style.zIndex });
    w.el.classList.add('mission');
    w.el.style.transform='translate('+tx+'px,'+ty+'px) scale('+scale+')';
    w.el.style.zIndex=200+i;
    var clickCatcher=function(){ exitMission(w); };
    w.el.__missionClick=clickCatcher;
    w.el.addEventListener('click',clickCatcher);
  });
}
function exitMission(selectWin){
  if(!missionActive) return;
  missionActive=false;
  missionState.forEach(function(s){
    s.w.el.style.transform=s.prevTransform||'';
    s.w.el.style.zIndex=s.prevZ||100;
    s.w.el.removeEventListener('click',s.w.el.__missionClick);
    setTimeout(function(){ s.w.el.classList.remove('mission'); },330);
  });
  $('#mission-control').classList.remove('show');
  if(selectWin) front(selectWin);
  missionState=[];
}
$('#mission-btn').onclick=function(){ missionActive?exitMission():enterMission(); };
$('#mission-control').addEventListener('click',function(e){ if(e.target===this) exitMission(); });

/* ════════════════════════════════════════════════════════════════
   WIDGETS
════════════════════════════════════════════════════════════════ */
function buildWidgets(){
  var host=$('#widgets');
  var now=new Date();
  var monthNames=['January','February','March','April','May','June','July','August','September','October','November','December'];
  var y=now.getFullYear(), m=now.getMonth(), today=now.getDate();
  var firstDow=new Date(y,m,1).getDay(), daysInMonth=new Date(y,m+1,0).getDate();
  var dowLabels=['S','M','T','W','T','F','S'];
  var calCells='';
  dowLabels.forEach(function(l){ calCells+='<div class="dow">'+l+'</div>'; });
  for(var i=0;i<firstDow;i++) calCells+='<div class="d blank"></div>';
  for(var day=1;day<=daysInMonth;day++) calCells+='<div class="d'+(day===today?' today':'')+'">'+day+'</div>';

  var weatherIcons=['☀️','🌤️','⛅','🌦️','🌥️'];
  var seed=(y*31+m*17+now.getDate())%weatherIcons.length;
  var temp=load('gg-widget-temp',null);
  if(temp===null){ temp=64+((y+m+now.getDate())%18); save('gg-widget-temp',temp); }

  host.innerHTML=
    '<div class="widget w-weather">'+
      '<div class="widget-hdr"><h3>Weather</h3><span style="font-size:11px;color:var(--muted)">Golden Gate</span></div>'+
      '<div class="wrow"><div><div class="big">'+temp+'°</div><div class="desc">Clear, gentle bay breeze</div></div><div class="icon">'+weatherIcons[seed]+'</div></div>'+
      '<div class="lohi">H:'+(temp+6)+'°  L:'+(temp-9)+'°</div>'+
    '</div>'+
    '<div class="widget w-calendar">'+
      '<div class="widget-hdr"><h3>Calendar</h3></div>'+
      '<div class="cal-top"><div class="cal-day">'+today+'</div><div class="cal-month">'+monthNames[m]+' '+y+'</div></div>'+
      '<div class="cal-grid">'+calCells+'</div>'+
    '</div>'+
    '<div class="widget w-clocks">'+
      '<div class="widget-hdr"><h3>World Clock</h3></div>'+
      '<div class="crow"><span class="place">San Francisco</span><span class="time" data-tz="America/Los_Angeles"></span></div>'+
      '<div class="crow"><span class="place">New York</span><span class="time" data-tz="America/New_York"></span></div>'+
      '<div class="crow"><span class="place">London</span><span class="time" data-tz="Europe/London"></span></div>'+
      '<div class="crow"><span class="place">Tokyo</span><span class="time" data-tz="Asia/Tokyo"></span></div>'+
    '</div>'+
    '<div class="widget w-notes">'+
      '<div class="widget-hdr"><h3>Notes</h3></div>'+
      '<textarea id="widget-notes" placeholder="Jot something down…">'+esc(load('gg-widget-notes',''))+'</textarea>'+
    '</div>';

  $('#widget-notes').addEventListener('input',function(){ save('gg-widget-notes',this.value); });
  updateWorldClocks();
  setInterval(updateWorldClocks,30000);
}
function updateWorldClocks(){
  $$('.w-clocks .time').forEach(function(el){
    try{
      el.textContent=new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:el.dataset.tz});
    }catch(e){ el.textContent='--:--'; }
  });
}

/* ════════════════════════════════════════════════════════════════
   MENU BAR DROPDOWNS
════════════════════════════════════════════════════════════════ */
var menuData={
  file:[ ['New Finder Window',function(){ openApp(0); }], ['Open Launchpad','F4',function(){ toggleLaunchpad(); }], 'sep', ['Close Window',function(){ var t=topWin(); if(t) closeWin(t); }] ],
  edit:[ ['Copy','⌘C'], ['Paste','⌘V'], 'sep', ['Select All','⌘A'] ],
  view:[ ['Toggle Widgets',function(){ $('#widgets').classList.toggle('hidden'); }], ['Toggle Dark Wallpaper',function(){ toast('Appearance is managed in Settings'); }], 'sep', ['Reset Desktop Layout',function(){ localStorage.removeItem('gg-icons'); localStorage.removeItem('gg-windows'); location.reload(); }] ],
  window:[ ['Minimize','⌘M',function(){ var t=topWin(); if(t) t.el.classList.toggle('min'); buildDock(); }], ['Zoom',function(){ var t=topWin(); if(t) t.el.classList.toggle('full'); }], ['Mission Control',function(){ enterMission(); }], 'sep', ['Close All',function(){ wins.slice().forEach(closeWin); }] ],
  help:[ ['About macOS Golden Gate',function(){ toast('macOS Golden Gate — crash-guarded web desktop'); }] ]
};
function buildMenu(name,x){
  var el=document.createElement('div'); el.className='menu-dropdown';
  var items=menuData[name]||[];
  el.innerHTML=items.map(function(it){
    if(it==='sep') return '<div class="menu-sep"></div>';
    var label=it[0], kbd=(typeof it[1]==='string')?it[1]:'';
    return '<div class="menu-item"><span>'+esc(label)+'</span><span class="kbd">'+esc(kbd)+'</span></div>';
  }).join('');
  document.body.appendChild(el);
  el.style.left=x+'px';
  requestAnimationFrame(function(){ el.classList.add('show'); });
  $$('.menu-item',el).forEach(function(mi,idx){
    mi.onclick=function(){
      var it=items[idx]; var fn=(typeof it[1]==='function')?it[1]:it[2];
      closeAllMenus();
      if(typeof fn==='function') fn();
    };
  });
  return el;
}
function closeAllMenus(){ $$('.menu-dropdown').forEach(function(m){ m.remove(); }); $$('.mb-btn').forEach(function(b){ b.classList.remove('active'); }); }
$$('[data-menu]').forEach(function(b){
  b.onclick=function(e){
    e.stopPropagation();
    var already=b.classList.contains('active');
    closeAllMenus();
    if(!already){ b.classList.add('active'); buildMenu(b.dataset.menu, b.getBoundingClientRect().left); }
  };
});
document.addEventListener('click',function(e){ if(!e.target.closest('.menu-dropdown')&&!e.target.closest('[data-menu]')) closeAllMenus(); });
$('#mb-apple').onclick=function(e){
  e.stopPropagation();
  closeAllMenus();
  var el=document.createElement('div'); el.className='menu-dropdown show'; el.style.left='6px';
  var items=[
    ['About This Mac',function(){ toast('macOS Golden Gate 26.0'); }],'sep',
    ['System Settings…',function(){ openApp(4); }],'sep',
    ['Lock Screen',function(){ showLock(); }],
    ['Sleep',function(){ toast('Zzz…'); document.body.style.filter='brightness(0)'; setTimeout(function(){document.body.style.filter='';},900); }],
    ['Restart…',function(){ if(confirm('Restart macOS Golden Gate?')) location.reload(); }],
    ['Shut Down…',function(){ if(confirm('Shut down?')) showLock(); }]
  ];
  el.innerHTML=items.map(function(it){
    if(it==='sep') return '<div class="menu-sep"></div>';
    return '<div class="menu-item"><span>'+esc(it[0])+'</span></div>';
  }).join('');
  document.body.appendChild(el);
  $$('.menu-item',el).forEach(function(mi,idx){
    var it=items.filter(function(x){return x!=='sep';})[idx];
  });
  // re-map click handlers accounting for separators
  var realIdx=0;
  $$('.menu-item',el).forEach(function(mi){
    (function(fnIdx){
      mi.onclick=function(){
        var flat=items.filter(function(x){return x!=='sep';});
        var fn=flat[fnIdx][1];
        closeAllMenus();
        if(typeof fn==='function') fn();
      };
    })(realIdx);
    realIdx++;
  });
};

/* ════════════════════════════════════════════════════════════════
   CONTROL CENTER
════════════════════════════════════════════════════════════════ */
var ccState=load('gg-cc',{wifi:true,bluetooth:true,dnd:false,airdrop:false,brightness:80,volume:60});
function buildControlCenter(){
  var el=$('#control-center');
  el.innerHTML=
    '<div class="cc-grid">'+
      ccTile('wifi','📶','Wi-Fi',ccState.wifi?'GoldenGateNet':'Off',ccState.wifi)+
      ccTile('bluetooth','🔵','Bluetooth',ccState.bluetooth?'On':'Off',ccState.bluetooth)+
      ccTile('dnd','🌙','Focus',ccState.dnd?'Do Not Disturb':'Off',ccState.dnd)+
      ccTile('airdrop','📡','AirDrop',ccState.airdrop?'Everyone':'Receiving Off',ccState.airdrop)+
    '</div>'+
    '<div class="cc-slider-card"><div class="cc-row"><span>☀️ Display</span><span id="cc-bright-val">'+ccState.brightness+'%</span></div><input type="range" id="cc-brightness" min="10" max="100" value="'+ccState.brightness+'"></div>'+
    '<div class="cc-slider-card"><div class="cc-row"><span>🔊 Sound</span><span id="cc-vol-val">'+ccState.volume+'%</span></div><input type="range" id="cc-volume" min="0" max="100" value="'+ccState.volume+'"></div>';

  $$('.cc-tile',el).forEach(function(t){
    t.onclick=function(){
      var k=t.dataset.k; ccState[k]=!ccState[k]; save('gg-cc',ccState); buildControlCenter();
    };
  });
  $('#cc-brightness').addEventListener('input',function(){
    ccState.brightness=+this.value; $('#cc-bright-val').textContent=this.value+'%';
    $('#dim-overlay').style.opacity=(100-this.value)/100*0.85;
    save('gg-cc',ccState);
  });
  $('#cc-volume').addEventListener('input',function(){
    ccState.volume=+this.value; $('#cc-vol-val').textContent=this.value+'%'; save('gg-cc',ccState);
  });
  applyBrightness();
}
function ccTile(key,icon,label,sub,on){
  return '<div class="cc-tile'+(on?' on':'')+'" data-k="'+key+'"><div class="cc-ic">'+icon+'</div><b>'+esc(label)+'</b><small>'+esc(sub)+'</small></div>';
}
function applyBrightness(){ $('#dim-overlay').style.opacity=(100-ccState.brightness)/100*0.85; }
$('#cc-btn').onclick=function(e){
  e.stopPropagation();
  var wasOpen=$('#control-center').classList.contains('show');
  $('#control-center').classList.remove('show');
  if(!wasOpen){ buildControlCenter(); $('#control-center').classList.add('show'); }
};
document.addEventListener('click',function(e){
  if(!e.target.closest('#control-center')&&!e.target.closest('#cc-btn')) $('#control-center').classList.remove('show');
});
applyBrightness();

/* ════════════════════════════════════════════════════════════════
   SPOTLIGHT
════════════════════════════════════════════════════════════════ */
function renderSpotlight(q){
  q=(q||'').toLowerCase();
  var results=APPS.filter(function(a){ return spotCat==='web' ? false : (!q||a.name.toLowerCase().indexOf(q)>-1); });
  var out=$('#sp-results');
  if(spotCat==='web' && q){
    out.innerHTML='<div class="sp-result on"><div style="width:30px;height:30px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center">🔎</div><div><div class="rname">Search the web for "'+esc(q)+'"</div><div class="rsub">Open in Safari</div></div></div>';
    $$('.sp-result',out)[0].onclick=function(){ openApp(1); closeSpotlight(); };
    return;
  }
  if(!results.length){ out.innerHTML='<div class="sp-empty">No results</div>'; return; }
  out.innerHTML=results.map(function(a,i){
    return '<div class="sp-result'+(i===spotIndex?' on':'')+'" data-name="'+esc(a.name)+'"><img src="'+esc(a.icon)+'" onerror="this.style.opacity=.2"><div><div class="rname">'+esc(a.name)+'</div><div class="rsub">Application</div></div></div>';
  }).join('');
  $$('.sp-result',out).forEach(function(r){
    r.onclick=function(){ openApp(APPS.findIndex(function(a){ return a.name===r.dataset.name; })); closeSpotlight(); };
  });
}
function openSpotlight(){
  $('#spotlight').classList.add('show'); $('#spotlight-input').value=''; spotIndex=0; spotCat='all';
  $$('.sp-tab').forEach(function(t){ t.classList.toggle('active',t.dataset.cat==='all'); });
  renderSpotlight('');
  setTimeout(function(){ $('#spotlight-input').focus(); },10);
}
function closeSpotlight(){ $('#spotlight').classList.remove('show'); }
$('#spotlight-btn').onclick=openSpotlight;
$('#spotlight').addEventListener('click',function(e){ if(e.target.id==='spotlight') closeSpotlight(); });
$('#spotlight-input').addEventListener('input',function(){ spotIndex=0; renderSpotlight(this.value); });
$('#spotlight-input').addEventListener('keydown',function(e){
  var r=$$('.sp-result');
  if(e.key==='ArrowDown'){ spotIndex=Math.min(spotIndex+1,r.length-1); renderSpotlight(this.value); e.preventDefault(); }
  if(e.key==='ArrowUp'){ spotIndex=Math.max(spotIndex-1,0); renderSpotlight(this.value); e.preventDefault(); }
  if(e.key==='Enter' && r[spotIndex]) r[spotIndex].click();
});
$$('.sp-tab').forEach(function(t){
  t.onclick=function(){ spotCat=t.dataset.cat; $$('.sp-tab').forEach(function(x){x.classList.remove('active');}); t.classList.add('active'); renderSpotlight($('#spotlight-input').value); };
});

/* ════════════════════════════════════════════════════════════════
   LAUNCHPAD
════════════════════════════════════════════════════════════════ */
function renderLaunchpad(q){
  q=(q||'').toLowerCase();
  var list=APPS.filter(function(a){ return !q||a.name.toLowerCase().indexOf(q)>-1; });
  $('#lp-grid').innerHTML=list.map(function(a){
    return '<div class="lp-app" data-name="'+esc(a.name)+'"><img src="'+esc(a.icon)+'" onerror="this.style.opacity=.2"><span>'+esc(a.name)+'</span></div>';
  }).join('');
  $$('.lp-app').forEach(function(el){
    el.onclick=function(){ openApp(APPS.findIndex(function(a){ return a.name===el.dataset.name; })); toggleLaunchpad(false); };
  });
}
function toggleLaunchpad(force){
  var lp=$('#launchpad'); var show=(force!==undefined)?force:!lp.classList.contains('show');
  lp.classList.toggle('show',show);
  if(show){ $('#lp-search-input').value=''; renderLaunchpad(''); setTimeout(function(){ $('#lp-search-input').focus(); },10); }
}
$('#lp-search-input').addEventListener('input',function(){ renderLaunchpad(this.value); });
$('#launchpad').addEventListener('click',function(e){ if(e.target.id==='launchpad') toggleLaunchpad(false); });

/* ════════════════════════════════════════════════════════════════
   CONTEXT MENU
════════════════════════════════════════════════════════════════ */
function showContextMenu(x,y,items){
  var el=$('#context-menu');
  el.innerHTML=items.map(function(it,i){ return '<div class="menu-item" data-i="'+i+'"><span>'+esc(it[0])+'</span></div>'; }).join('');
  el.style.left=Math.min(x,innerWidth-210)+'px'; el.style.top=Math.min(y,innerHeight-items.length*32-20)+'px';
  el.classList.add('show');
  $$('.menu-item',el).forEach(function(mi,idx){
    mi.onclick=function(){ el.classList.remove('show'); items[idx][1](); };
  });
}
document.addEventListener('click',function(e){ if(!e.target.closest('#context-menu')) $('#context-menu').classList.remove('show'); });
document.addEventListener('contextmenu',function(e){ if(!e.target.closest('.desktop-icon')&&!e.target.closest('.win')&&!e.target.closest('.dock-item')) e.preventDefault(); });

/* ════════════════════════════════════════════════════════════════
   LOCK SCREEN
════════════════════════════════════════════════════════════════ */
function showLock(){ $('#lock-screen').classList.add('show'); }
function hideLock(){ $('#lock-screen').classList.remove('show'); }
$('#lock-hint').onclick=hideLock;
$('#lock-screen').onclick=function(e){ if(e.target.id==='lock-screen') hideLock(); };

/* ════════════════════════════════════════════════════════════════
   KEYBOARD SHORTCUTS
════════════════════════════════════════════════════════════════ */
document.addEventListener('keydown',function(e){
  if((e.metaKey||e.ctrlKey) && e.key===' '){ e.preventDefault(); openSpotlight(); return; }
  if(e.key==='Escape'){
    closeSpotlight(); toggleLaunchpad(false); closeAllMenus(); $('#control-center').classList.remove('show');
    if(missionActive) exitMission();
    return;
  }
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='w'){ var t=topWin(); if(t) closeWin(t); e.preventDefault(); return; }
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='m'){ var t2=topWin(); if(t2){ t2.el.classList.toggle('min'); buildDock(); } e.preventDefault(); return; }
  if(e.key==='F3'){ e.preventDefault(); missionActive?exitMission():enterMission(); return; }
  if(e.key==='F4'){ e.preventDefault(); toggleLaunchpad(); return; }
});

/* ════════════════════════════════════════════════════════════════
   CROSS-WINDOW MESSAGING (wallpaper, openWindow requests from apps)
════════════════════════════════════════════════════════════════ */
window.addEventListener('message',function(e){
  var d=e.data||{};
  if(d.type==='setWallpaper' && d.wallpaper){
    document.body.style.background=d.wallpaper;
    document.body.style.backgroundSize='cover';
    save('gg-wallpaper',d.wallpaper);
    toast('Wallpaper updated');
  }
  if(d.type==='openWindow'){
    createWin({ name:d.title||'App', icon:d.icon||'./images/AppTester.png', url:d.url, w:d.w||860, h:d.h||560 });
  }
});

/* ════════════════════════════════════════════════════════════════
   INIT
════════════════════════════════════════════════════════════════ */
var wp=load('gg-wallpaper',null);
if(wp){ document.body.style.background=wp; document.body.style.backgroundSize='cover'; }
buildDesktop();
buildWidgets();
buildDock();
(load('gg-windows',[])||[]).forEach(function(s){
  var a=APPS.find(function(x){ return x.name===s.name; });
  if(a) createWin(a,s);
});
buildDock();

window.openApp=openApp;
window.toggleLaunchpad=toggleLaunchpad;
window.closeAllWins=function(){ wins.slice().forEach(closeWin); };
window.enterMission=enterMission;
window.exitMission=exitMission;
})();
</script>
