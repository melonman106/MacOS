<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --glass:rgba(255,255,255,.10);
  --glass-strong:rgba(255,255,255,.16);
  --bar-bg:rgba(32,34,46,.72);
  --sidebar-bg:rgba(24,26,36,.62);
  --content-bg:rgba(18,20,28,.55);
  --line:rgba(255,255,255,.12);
  --text:#f2f4fb;
  --muted:rgba(242,244,251,.55);
  --muted2:rgba(242,244,251,.38);
  --accent:#0a84ff;
  --accent-dim:rgba(10,132,255,.18);
  --yellow:#f6c343;
  --green:#30d158;
  --red:#ff5f57;
  --radius:10px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;
  background:linear-gradient(160deg,#1b1d2a,#14161f 60%);
  color:var(--text);
  font-size:13px;
  -webkit-font-smoothing:antialiased;
  display:flex;
  flex-direction:column;
  height:100vh;
  user-select:none;
}

/* ============ Toolbar ============ */
.toolbar{
  height:46px;flex-shrink:0;display:flex;align-items:center;gap:10px;
  padding:0 14px;background:var(--bar-bg);backdrop-filter:blur(30px) saturate(180%);
  border-bottom:1px solid var(--line);
}
.nav-btns{display:flex;gap:2px}
.nb{
  width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;
  background:transparent;border:none;color:var(--muted);cursor:pointer;transition:.12s;
}
.nb:hover:not(:disabled){background:var(--glass);color:var(--text)}
.nb:disabled{opacity:.28;cursor:default}
.nb svg{width:16px;height:16px}
.view-toggle{display:flex;background:var(--glass);border-radius:7px;padding:2px;gap:1px;margin-left:4px}
.vt-btn{width:28px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:6px;color:var(--muted);cursor:pointer;background:transparent;border:none}
.vt-btn.active{background:var(--glass-strong);color:var(--text)}
.vt-btn svg{width:14px;height:14px}
.tb-title{
  flex:1;text-align:center;font-weight:600;font-size:13px;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.tb-actions{display:flex;align-items:center;gap:6px}
.tb-btn{
  display:flex;align-items:center;gap:5px;height:28px;padding:0 10px;border-radius:7px;
  background:var(--glass);border:1px solid var(--line);color:var(--text);font-size:12px;font-weight:500;
  cursor:pointer;transition:.12s;white-space:nowrap;
}
.tb-btn:hover{background:var(--glass-strong)}
.tb-btn svg{width:13px;height:13px}
.search-box{
  display:flex;align-items:center;gap:6px;background:var(--glass);border:1px solid var(--line);
  border-radius:7px;padding:0 8px;height:28px;width:150px;transition:width .15s;
}
.search-box:focus-within{width:210px;border-color:var(--accent)}
.search-box svg{width:13px;height:13px;color:var(--muted);flex-shrink:0}
.search-box input{
  flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:12px;font-family:inherit;
}
.search-box input::placeholder{color:var(--muted2)}

/* ============ Body layout ============ */
.body-wrap{flex:1;display:flex;min-height:0}

/* ============ Sidebar ============ */
.sidebar{
  width:190px;flex-shrink:0;background:var(--sidebar-bg);border-right:1px solid var(--line);
  overflow-y:auto;padding:10px 0;
}
.sidebar::-webkit-scrollbar{width:0}
.sb-sec{
  padding:10px 14px 4px;font-size:11px;font-weight:700;color:var(--muted2);
  text-transform:uppercase;letter-spacing:.6px;
}
.sb-item{
  display:flex;align-items:center;gap:9px;padding:6px 12px;margin:0 6px;border-radius:7px;cursor:pointer;
  font-size:12.5px;color:var(--muted);transition:.1s;
}
.sb-item:hover{background:var(--glass);color:var(--text)}
.sb-item.active{background:var(--accent-dim);color:var(--accent)}
.sb-item svg{width:15px;height:15px;flex-shrink:0}
.sb-item .lbl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-item .cnt{font-size:10px;color:var(--muted2)}

/* ============ Content ============ */
.content{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--content-bg)}
.path-bar{
  height:30px;flex-shrink:0;display:flex;align-items:center;gap:4px;padding:0 14px;
  font-size:12px;color:var(--muted);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;
}
.path-bar::-webkit-scrollbar{height:0}
.crumb{display:flex;align-items:center;gap:4px;cursor:pointer;padding:2px 6px;border-radius:5px}
.crumb:hover{background:var(--glass);color:var(--text)}
.crumb svg{width:12px;height:12px}
.crumb.current{color:var(--text);font-weight:600}
.crumb-sep{color:var(--muted2);font-size:10px}

.view-port{flex:1;overflow-y:auto;padding:14px;position:relative}
.view-port.dragover::after{
  content:'Drop to upload';position:absolute;inset:8px;border:2px dashed var(--accent);
  border-radius:14px;background:rgba(10,132,255,.08);display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:600;color:var(--accent);pointer-events:none;z-index:50;
}

/* Icon grid view */
.icon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:4px}
.fs-item{
  display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 6px 8px;border-radius:10px;
  cursor:default;text-align:center;
}
.fs-item:hover{background:var(--glass)}
.fs-item.selected{background:var(--accent-dim);box-shadow:inset 0 0 0 1px rgba(10,132,255,.5)}
.fs-item .ic{
  width:46px;height:46px;display:flex;align-items:center;justify-content:center;position:relative;
}
.fs-item .ic svg{width:44px;height:44px}
.fs-item .ic img{width:44px;height:44px;object-fit:contain;border-radius:6px}
.fs-item .nm{
  font-size:11.5px;line-height:1.25;word-break:break-word;max-width:100%;color:var(--text);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}

/* List view */
.list-view{width:100%;border-collapse:collapse}
.list-view th{
  text-align:left;font-size:10.5px;font-weight:700;color:var(--muted2);text-transform:uppercase;
  letter-spacing:.5px;padding:5px 10px;border-bottom:1px solid var(--line);position:sticky;top:-14px;background:var(--content-bg);
}
.list-view td{padding:6px 10px;font-size:12.5px;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:middle}
.list-view tr{cursor:default}
.list-view tr:hover td{background:var(--glass)}
.list-view tr.selected td{background:var(--accent-dim)}
.lv-name{display:flex;align-items:center;gap:8px}
.lv-name .ic{width:20px;height:20px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.lv-name .ic svg{width:18px;height:18px}
.lv-name .ic img{width:18px;height:18px;object-fit:contain;border-radius:4px}
.lv-meta{color:var(--muted);font-family:'SF Mono','JetBrains Mono',monospace;font-size:11.5px}

.empty-state{
  height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  color:var(--muted2);padding:40px;
}
.empty-state svg{width:52px;height:52px;opacity:.35}
.empty-state p{font-size:13px}

/* Status bar */
.status-bar{
  height:26px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;
  padding:0 14px;font-size:11px;color:var(--muted2);border-top:1px solid var(--line);
}

/* Context menu */
.ctx-menu{
  position:fixed;z-index:9000;min-width:190px;padding:6px;border-radius:11px;
  background:rgba(30,32,44,.88);border:1px solid var(--line);backdrop-filter:blur(40px) saturate(180%);
  box-shadow:0 20px 50px rgba(0,0,0,.5);display:none;
}
.ctx-menu.show{display:block}
.ctx-item{padding:7px 11px;border-radius:7px;font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:8px}
.ctx-item:hover{background:var(--accent)}
.ctx-item svg{width:13px;height:13px;opacity:.8}
.ctx-item.danger:hover{background:#c0392b}
.ctx-sep{height:1px;background:var(--line);margin:5px 3px}

/* Modals */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(6px);z-index:9500;
  display:none;align-items:center;justify-content:center;
}
.modal-overlay.show{display:flex}
.modal{
  width:380px;border-radius:16px;background:rgba(30,32,44,.92);border:1px solid var(--line);
  box-shadow:0 30px 70px rgba(0,0,0,.5);backdrop-filter:blur(40px) saturate(180%);overflow:hidden;
}
.modal-hdr{padding:14px 18px;font-size:13.5px;font-weight:700;border-bottom:1px solid var(--line)}
.modal-body{padding:16px 18px}
.modal-body input{
  width:100%;padding:8px 10px;background:rgba(255,255,255,.06);border:1px solid var(--line);
  border-radius:8px;color:var(--text);font-size:13px;font-family:inherit;outline:none;
}
.modal-body input:focus{border-color:var(--accent)}
.modal-body p{font-size:12.5px;color:var(--muted);line-height:1.5;margin-bottom:10px}
.modal-ftr{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
.m-btn{flex:1;padding:8px;border-radius:8px;border:none;font-size:12.5px;font-weight:600;cursor:pointer}
.m-btn.primary{background:var(--accent);color:#fff}
.m-btn.primary:hover{background:#2a94ff}
.m-btn.secondary{background:var(--glass);color:var(--text)}
.m-btn.secondary:hover{background:var(--glass-strong)}

/* Text/Image preview modal */
.preview-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(10px);z-index:9600;
  display:none;align-items:center;justify-content:center;padding:40px;
}
.preview-overlay.show{display:flex}
.preview-box{
  width:100%;max-width:760px;height:100%;max-height:600px;border-radius:16px;
  background:rgba(24,26,36,.92);border:1px solid var(--line);box-shadow:0 30px 70px rgba(0,0,0,.5);
  display:flex;flex-direction:column;overflow:hidden;
}
.preview-hdr{
  height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;border-bottom:1px solid var(--line);font-weight:600;font-size:13px;
}
.preview-hdr .actions{display:flex;gap:6px}
.preview-close{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;background:transparent;border:none}
.preview-close:hover{background:var(--glass);color:var(--text)}
.preview-content{flex:1;overflow:auto;padding:16px}
.preview-content textarea{
  width:100%;height:100%;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:8px;
  color:var(--text);font-family:'SF Mono','JetBrains Mono',monospace;font-size:12.5px;padding:12px;
  outline:none;resize:none;line-height:1.6;
}
.preview-content img{max-width:100%;display:block;margin:0 auto;border-radius:8px}
.preview-content.center{display:flex;align-items:center;justify-content:center}

/* Toast */
.toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(70px);
  background:rgba(28,30,42,.92);border:1px solid var(--line);color:var(--text);padding:9px 18px;
  border-radius:10px;font-size:12.5px;font-weight:500;z-index:9999;box-shadow:0 10px 34px rgba(0,0,0,.4);
  transition:transform .28s cubic-bezier(.34,1.56,.64,1);pointer-events:none;
}
.toast.show{transform:translateX(-50%) translateY(0)}

#file-input, #upload-input{display:none}
</style>
</head>
<body>

<!-- Toolbar -->
<div class="toolbar">
  <div class="nav-btns">
    <button class="nb" id="back-btn" title="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <button class="nb" id="fwd-btn" title="Forward">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>
    <button class="nb" id="up-btn" title="Up one level">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 15l-6-6-6 6"/></svg>
    </button>
  </div>
  <div class="view-toggle">
    <button class="vt-btn active" id="grid-view-btn" title="Icon view">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    </button>
    <button class="vt-btn" id="list-view-btn" title="List view">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="4" width="18" height="2.4" rx="1"/><rect x="3" y="11" width="18" height="2.4" rx="1"/><rect x="3" y="18" width="18" height="2.4" rx="1"/></svg>
    </button>
  </div>
  <div class="tb-title" id="tb-title">Finder</div>
  <div class="tb-actions">
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="text" id="search-input" placeholder="Search">
    </div>
    <button class="tb-btn" id="new-folder-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/><line x1="12" y1="11" x2="12" y2="15"/><line x1="10" y1="13" x2="14" y2="13"/></svg>
      Folder
    </button>
    <button class="tb-btn" id="upload-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      Upload
    </button>
  </div>
</div>

<div class="body-wrap">
  <!-- Sidebar -->
  <div class="sidebar" id="sidebar"></div>

  <!-- Content -->
  <div class="content">
    <div class="path-bar" id="path-bar"></div>
    <div class="view-port" id="view-port"></div>
    <div class="status-bar" id="status-bar"></div>
  </div>
</div>

<!-- Context menu -->
<div class="ctx-menu" id="ctx-menu"></div>

<!-- New Folder Modal -->
<div class="modal-overlay" id="modal-newfolder">
  <div class="modal">
    <div class="modal-hdr">New Folder</div>
    <div class="modal-body">
      <input type="text" id="newfolder-name" placeholder="Untitled Folder" autocomplete="off">
    </div>
    <div class="modal-ftr">
      <button class="m-btn secondary" onclick="closeModals()">Cancel</button>
      <button class="m-btn primary" onclick="confirmNewFolder()">Create</button>
    </div>
  </div>
</div>

<!-- New File Modal -->
<div class="modal-overlay" id="modal-newfile">
  <div class="modal">
    <div class="modal-hdr">New File</div>
    <div class="modal-body">
      <input type="text" id="newfile-name" placeholder="untitled.txt" autocomplete="off">
    </div>
    <div class="modal-ftr">
      <button class="m-btn secondary" onclick="closeModals()">Cancel</button>
      <button class="m-btn primary" onclick="confirmNewFile()">Create</button>
    </div>
  </div>
</div>

<!-- Rename Modal -->
<div class="modal-overlay" id="modal-rename">
  <div class="modal">
    <div class="modal-hdr">Rename</div>
    <div class="modal-body">
      <input type="text" id="rename-name" autocomplete="off">
    </div>
    <div class="modal-ftr">
      <button class="m-btn secondary" onclick="closeModals()">Cancel</button>
      <button class="m-btn primary" onclick="confirmRename()">Rename</button>
    </div>
  </div>
</div>

<!-- Preview / Edit overlay -->
<div class="preview-overlay" id="preview-overlay">
  <div class="preview-box">
    <div class="preview-hdr">
      <span id="preview-title">File</span>
      <div class="actions">
        <button class="tb-btn" id="preview-save-btn" style="display:none">Save</button>
        <button class="tb-btn" id="preview-open-tester-btn" style="display:none">Open in App Tester</button>
        <button class="preview-close" id="preview-close-btn">&times;</button>
      </div>
    </div>
    <div class="preview-content" id="preview-content"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="upload-input" multiple>

<script>
'use strict';
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function safe(fn,fb){try{return fn()}catch(e){console.error(e);return fb}}

/* ══════════════════════════════════════════════════════════
   STORAGE / VIRTUAL FILESYSTEM
   Two roots:
     - "user" : a real read/write filesystem stored in localStorage
                (Documents, Desktop, Downloads, etc.) — supports
                upload, create, rename, delete, edit, save.
     - "repo" : a READ-ONLY virtual view of this repository's
                folder structure (apps/, images/, games/, etc.)
   ══════════════════════════════════════════════════════════ */
var LS_KEY = 'finder_fs_v1';
var LS_DESKTOP_ICONS = 'gg-icons'; // shared with shell desktop icon positions (read-only reference)

function nowTs(){ return Date.now(); }

function defaultUserFS(){
  return {
    name:'/', type:'dir', mtime:nowTs(),
    children:{
      'Desktop':{name:'Desktop',type:'dir',mtime:nowTs(),children:{
        'readme.md':{name:'readme.md',type:'file',mtime:nowTs(),content:'# My Desktop\n\nWelcome to macOS Golden Gate Finder.\nDrag files here, or use Upload above.',mime:'text/markdown'}
      }},
      'Documents':{name:'Documents',type:'dir',mtime:nowTs(),children:{}},
      'Downloads':{name:'Downloads',type:'dir',mtime:nowTs(),children:{}},
      'Pictures':{name:'Pictures',type:'dir',mtime:nowTs(),children:{}}
    }
  };
}

var userRoot = safe(function(){
  var raw = localStorage.getItem(LS_KEY);
  if(!raw) return defaultUserFS();
  var parsed = JSON.parse(raw);
  restoreParents(parsed,null);
  return parsed;
}, defaultUserFS());

function restoreParents(n,p){ n.parent=p; if(n.children) for(var k in n.children) restoreParents(n.children[k],n); }

function persistUserFS(){
  safe(function(){
    localStorage.setItem(LS_KEY, JSON.stringify(userRoot, function(k,v){ return k==='parent'?undefined:v; }));
  });
}

/* ══════════════════════════════════════════════════════════
   REPO TREE (read-only) — mirrors this project's folder layout.
   This is a static manifest describing the repo so Finder can
   browse it like a real location. Update this list if new
   top-level app folders are added to the project.
   ══════════════════════════════════════════════════════════ */
var REPO_TREE = {
  name:'MacOS', type:'dir', repo:true, children:{
    'apps':{name:'apps',type:'dir',repo:true,children:{
      'AI':{name:'AI',type:'dir',repo:true,children:{
        'GPT.html':{name:'GPT.html',type:'file',repo:true,path:'apps/AI/GPT.html',mime:'text/html'},
        'readme.txt':{name:'readme.txt',type:'file',repo:true,path:'apps/AI/readme.txt',mime:'text/plain'}
      }},
      'Ampler':{name:'Ampler',type:'dir',repo:true,children:{
        'readme.txt':{name:'readme.txt',type:'file',repo:true,path:'apps/Ampler/readme.txt',mime:'text/plain'}
      }},
      'Browser':{name:'Browser',type:'dir',repo:true,children:{
        'readme.md':{name:'readme.md',type:'file',repo:true,path:'apps/Browser/readme.md',mime:'text/markdown'}
      }},
      'Finder':{name:'Finder',type:'dir',repo:true,children:{
        'index.html':{name:'index.html',type:'file',repo:true,path:'apps/Finder/index.html',mime:'text/html'}
      }},
      'Music':{name:'Music',type:'dir',repo:true,children:{
        'readme.txt':{name:'readme.txt',type:'file',repo:true,path:'apps/Music/readme.txt',mime:'text/plain'}
      }},
      'Steam':{name:'Steam',type:'dir',repo:true,children:{
        'steam.html':{name:'steam.html',type:'file',repo:true,path:'apps/Steam/steam.html',mime:'text/html'},
        'readme.txt':{name:'readme.txt',type:'file',repo:true,path:'apps/Steam/readme.txt',mime:'text/plain'}
      }},
      'System':{name:'System',type:'dir',repo:true,children:{
        'Settings.html':{name:'Settings.html',type:'file',repo:true,path:'apps/System/Settings.html',mime:'text/html'},
        'terminal.html':{name:'terminal.html',type:'file',repo:true,path:'apps/System/terminal.html',mime:'text/html'},
        'readme.txt':{name:'readme.txt',type:'file',repo:true,path:'apps/System/readme.txt',mime:'text/plain'}
      }},

function rootNode(root){ return root==='repo' ? REPO_TREE : userRoot; }

function nodeAt(root,pathArr){
  var n = rootNode(root);
  for(var i=0;i<pathArr.length;i++){
    if(!n.children || !n.children[pathArr[i]]) return null;
    n = n.children[pathArr[i]];
  }
  return n;
}

function iconFor(node){
  if(node.type==='dir') return node.repo ? ICONS.folderRepo : ICONS.folder;

  if(/\.(html?|jsx?)$/.test(n)) return ICONS.html;
  if(/\.md$/.test(n)) return ICONS.md;
  if(/\.json(c)?$/.test(n)) return ICONS.json;

}

/* ══════════════════════════════════════════════════════════
   HELPERS: size / date formatting
   ══════════════════════════════════════════════════════════ */
function fmtSize(node){
  if(node.type==='dir'){
    var c=0; for(var k in (node.children||{})) c++;
    return c + (c===1?' item':' items');
  }
  var bytes = node.content ? (node.content.length) : (node._size||0);
  if(node.dataUrl) bytes = Math.round(node.dataUrl.length*0.75);
  if(bytes<1024) return bytes+' B';
  if(bytes<1048576) return (bytes/1024).toFixed(1)+' KB';
  return (bytes/1048576).toFixed(1)+' MB';
}
function fmtDate(ts){
  if(!ts) return '—';
  var d=new Date(ts);
  return d.toLocaleDateString([], {month:'short',day:'numeric',year:'numeric'})+', '+d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
}
function kindOf(node){
  if(node.type==='dir') return node.repo ? 'Project Folder' : 'Folder';
  var n=node.name.toLowerCase();
  if(/\.html?$/.test(n)) return 'HTML Document';
  if(/\.md$/.test(n)) return 'Markdown Document';
  if(/\.json c?$/.test(n)||/\.json$/.test(n)) return 'JSON Document';
  if(/\.(png|jpg|jpeg|gif|webp|svg)$/.test(n)) return 'Image';
  if(/\.txt$/.test(n)) return 'Plain Text';
  if(node.repo) return 'Project File';
  return 'Document';
}

/* ══════════════════════════════════════════════════════════
   NAVIGATION
   ══════════════════════════════════════════════════════════ */
function navigateTo(root,pathArr,skipHistory){
  if(!skipHistory){
    histBack.push({root:curRoot,path:curPath.slice()});
    histFwd=[];
  }
  curRoot=root; curPath=pathArr; selected=null; searchQuery='';
  $('#search-input').value='';
  render();
}
function goUp(){
  if(curPath.length===0) return;
  var np = curPath.slice(0,-1);
  navigateTo(curRoot,np);
}
function goBack(){
  if(!histBack.length) return;
  var cur={root:curRoot,path:curPath.slice()};
  var prev=histBack.pop(); histFwd.push(cur);
  curRoot=prev.root; curPath=prev.path; selected=null; render();
}
function goForward(){
  if(!histFwd.length) return;
  var cur={root:curRoot,path:curPath.slice()};
  var next=histFwd.pop(); histBack.push(cur);
  curRoot=next.root; curPath=next.path; selected=null; render();
}

/* ══════════════════════════════════════════════════════════
   RENDER: file listing
   ══════════════════════════════════════════════════════════ */
function sortedEntries(dir){
  var kids = dir.children || {};
  var arr = Object.keys(kids).map(function(k){return kids[k]});
  if(searchQuery){
    var q=searchQuery.toLowerCase();
    arr = arr.filter(function(n){return n.name.toLowerCase().indexOf(q)>-1});
  }
  arr.sort(function(a,b){
    if(a.type!==b.type) return a.type==='dir'?-1:1;
    return a.name.localeCompare(b.name,undefined,{numeric:true});
  });
  return arr;
}

function render(){
  buildSidebar();
  renderPathBar();
  var dir = curDir();
  var vp = $('#view-port');
  var entries = sortedEntries(dir);

  if(!entries.length){
    vp.innerHTML = '<div class="empty-state">'+
      (searchQuery
        ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><p>No results for "'+esc(searchQuery)+'"</p>'
        : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg><p>This folder is empty</p>')
      +'</div>';
  } else if(viewMode==='grid'){
    var g=document.createElement('div'); g.className='icon-grid';
    entries.forEach(function(node){ g.appendChild(gridItem(node)); });
    vp.innerHTML=''; vp.appendChild(g);
  } else {
    var t=document.createElement('table'); t.className='list-view';
    t.innerHTML='<thead><tr><th>Name</th><th>Kind</th><th>Size</th><th>Modified</th></tr></thead>';
    var tbody=document.createElement('tbody');
    entries.forEach(function(node){ tbody.appendChild(listItem(node)); });
    t.appendChild(tbody);
    vp.innerHTML=''; vp.appendChild(t);
  }

  $('#status-bar').textContent = entries.length + (entries.length===1?' item':' items') +
    (curRoot==='repo' ? '  ·  Project files (read-only)' : '  ·  ' + rootLabel());

  $$('.vt-btn').forEach(function(b){b.classList.remove('active')});
  $(viewMode==='grid'?'#grid-view-btn':'#list-view-btn').classList.add('active');
}

function gridItem(node){
  var el=document.createElement('div');
  el.className='fs-item'; el.dataset.name=node.name;
  el.innerHTML='<div class="ic">'+iconFor(node)+'</div><div class="nm">'+esc(node.name)+'</div>';
  attachItemEvents(el,node);

}
function listItem(node){
  var tr=document.createElement('tr'); tr.dataset.name=node.name;
  tr.innerHTML='<td><div class="lv-name"><div class="ic">'+iconFor(node)+'</div>'+esc(node.name)+'</div></td>'+
    '<td class="lv-meta">'+esc(kindOf(node))+'</td>'+

    '<td class="lv-meta">'+esc(fmtDate(node.mtime))+'</td>';

function attachItemEvents(el,node){
  el.addEventListener('click',function(e){
    e.stopPropagation();
    $$('.fs-item,.list-view tr').forEach(function(x){x.classList.remove('selected')});
    el.classList.add('selected');

  });

    e.stopPropagation();
    openNode(node);
  });

    e.preventDefault(); e.stopPropagation();
    selected=node;
    $$('.fs-item,.list-view tr').forEach(function(x){x.classList.remove('selected')});
    el.classList.add('selected');
    showCtxMenu(e.clientX,e.clientY,node);
  });
}

/* ══════════════════════════════════════════════════════════
   OPEN NODE (folder navigate / file preview / html -> AppTester)
   ══════════════════════════════════════════════════════════ */
function openNode(node){
  if(node.type==='dir'){
    navigateTo(curRoot, curPath.concat([node.name]));
    return;
  }
  var name=node.name.toLowerCase();
  if(/\.html?$/.test(name)){
    launchHtml(node);
    return;
  }
  if(/\.(png|jpg|jpeg|gif|webp|svg)$/.test(name)){
    previewImage(node);
    return;
  }
  // text-like: open editable preview
  previewText(node);
}

function launchHtml(node){
  if(node.repo){
    // Repo files: reference by their real relative path so the iframe loads the actual file from the site
    var rel = node.path.split('/').map(function(seg){return seg;}).join('/');
    var url = './' + rel; // relative from index.html at project root; Finder itself lives at apps/Finder/
    // Finder is served from apps/Finder/index.html, so we must resolve relative to project root instead
    var resolved = resolveRepoUrl(node.path);
    openInAppTester(resolved, node.name);
    toast('Opening '+node.name+' in App Tester…');
    return;
  }
  // User-created HTML file: serve via blob URL so it can run standalone in App Tester
  var blob = new Blob([node.content||''],{type:'text/html'});
  var url = URL.createObjectURL(blob);
  openInAppTester(url, node.name);
  toast('Opening '+node.name+' in App Tester…');
}

function resolveRepoUrl(path){
  // Finder is hosted at apps/Finder/index.html — go up two levels to reach project root
  return '../../' + path;
}

function previewText(node){
  var isRepo = !!node.repo;
  $('#preview-title').textContent = node.name + (isRepo?'  (read-only, project file)':'');
  var pc = $('#preview-content');
  pc.className='preview-content';
  if(isRepo){
    // fetch actual file content from repo for accurate display
    pc.innerHTML='<div class="empty-state" style="height:100%"><p>Loading…</p></div>';
    $('#preview-open-tester-btn').style.display='none';
    $('#preview-save-btn').style.display='none';
    $('#preview-overlay').classList.add('show');
    fetch(resolveRepoUrl(node.path)).then(function(r){return r.text()}).then(function(txt){
      pc.innerHTML='<textarea readonly></textarea>';
      $('textarea',pc).value=txt;
    }).catch(function(){
      pc.innerHTML='<div class="empty-state" style="height:100%"><p>Could not load file contents.</p></div>';
    });
    return;
  }
  pc.innerHTML='<textarea id="edit-area" spellcheck="false"></textarea>';
  $('#edit-area',pc).value = node.content||'';
  $('#preview-save-btn').style.display='inline-flex';
  $('#preview-save-btn').onclick=function(){
    node.content=$('#edit-area').value;
    node.mtime=nowTs();
    persistUserFS(); render(); toast('Saved '+node.name);
  };
  $('#preview-open-tester-btn').style.display='none';
  $('#preview-overlay').classList.add('show');
}

function previewImage(node){
  $('#preview-title').textContent = node.name;
  var pc=$('#preview-content');
  pc.className='preview-content center';
  var src = node.repo ? resolveRepoUrl(node.path) : (node.dataUrl||'');
  pc.innerHTML='<img src="'+esc(src)+'" alt="'+esc(node.name)+'">';
  $('#preview-save-btn').style.display='none';
  $('#preview-open-tester-btn').style.display='none';
  $('#preview-overlay').classList.add('show');
}

$('#preview-close-btn').onclick=function(){ $('#preview-overlay').classList.remove('show'); };
$('#preview-overlay').addEventListener('click',function(e){ if(e.target===this) this.classList.remove('show'); });

/* ══════════════════════════════════════════════════════════
   CONTEXT MENU
   ══════════════════════════════════════════════════════════ */
function showCtxMenu(x,y,node){
  var isRepo = node && node.repo;
  var items=[];
  if(node){
    items.push({label:'Open', icon:'open', fn:function(){openNode(node)}});
    if(!isRepo){
      items.push('sep');
      items.push({label:'Rename', icon:'rename', fn:function(){openRenameModal(node)}});
      items.push({label:'Duplicate', icon:'dup', fn:function(){duplicateNode(node)}});
      items.push({label:'Download', icon:'dl', fn:function(){downloadNode(node)}});
      items.push('sep');
      items.push({label:'Delete', icon:'del', danger:true, fn:function(){deleteNode(node)}});
    } else {
      items.push({label:'Download a copy', icon:'dl', fn:function(){downloadRepoCopy(node)}});
    }
  }
  if(!items.length) return;
  var menu=$('#ctx-menu');
  menu.innerHTML=items.map(function(it,i){
    if(it==='sep') return '<div class="ctx-sep"></div>';
    return '<div class="ctx-item'+(it.danger?' danger':'')+'" data-i="'+i+'">'+ctxIcon(it.icon)+'<span>'+esc(it.label)+'</span></div>';
  }).join('');
  menu.style.left=Math.min(x,window.innerWidth-210)+'px';
  menu.style.top=Math.min(y,window.innerHeight-260)+'px';
  menu.classList.add('show');
  $$('.ctx-item',menu).forEach(function(el){
    el.onclick=function(){
      var idx=parseInt(el.dataset.i,10);
      menu.classList.remove('show');
      var it=items[idx];
      if(it && it.fn) it.fn();
    };
  });
}

    dl:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>',
    del:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>'
  };

document.addEventListener('click',function(){ $('#ctx-menu').classList.remove('show'); });
$('#view-port').addEventListener('contextmenu',function(e){
  if(e.target.id==='view-port' || e.target.classList.contains('icon-grid')){
    e.preventDefault();
    if(curRoot==='repo') return;
    showBlankCtxMenu(e.clientX,e.clientY);

});
function showBlankCtxMenu(x,y){
  var items=[
    {label:'New Folder', icon:'rename', fn:openNewFolderModal},
    {label:'New File', icon:'dup', fn:openNewFileModal},
    'sep',
    {label:'Upload Files…', icon:'dl', fn:function(){$('#upload-input').click()}}
  ];
  var menu=$('#ctx-menu');
  menu.innerHTML=items.map(function(it,i){
    if(it==='sep') return '<div class="ctx-sep"></div>';
    return '<div class="ctx-item" data-i="'+i+'">'+ctxIcon(it.icon)+'<span>'+esc(it.label)+'</span></div>';
  }).join('');
  menu.style.left=Math.min(x,window.innerWidth-210)+'px';
  menu.style.top=Math.min(y,window.innerHeight-200)+'px';

/* ══════════════════════════════════════════════════════════
   CRUD: folders / files
   ══════════════════════════════════════════════════════════ */
function closeModals(){ $$('.modal-overlay').forEach(function(m){m.classList.remove('show')}); }

function openNewFolderModal(){
  $('#newfolder-name').value='';
  $('#modal-newfolder').classList.add('show');
  setTimeout(function(){$('#newfolder-name').focus()},30);
}
function confirmNewFolder(){
  var name=$('#newfolder-name').value.trim()||'Untitled Folder';
  var dir=curDir();
  if(!dir.children) dir.children={};
  var finalName=uniqueName(dir,name);
  dir.children[finalName]={name:finalName,type:'dir',mtime:nowTs(),children:{},parent:dir};
  persistUserFS(); closeModals(); render(); notifyDesktopChange();
  toast('Created "'+finalName+'"');
}

function openNewFileModal(){
  $('#newfile-name').value='';
  $('#modal-newfile').classList.add('show');
  setTimeout(function(){$('#newfile-name').focus()},30);
}
function confirmNewFile(){
  var name=$('#newfile-name').value.trim()||'untitled.txt';
  var dir=curDir();
  if(!dir.children) dir.children={};
  var finalName=uniqueName(dir,name);
  dir.children[finalName]={name:finalName,type:'file',mtime:nowTs(),content:'',mime:guessMime(finalName),parent:dir};
  persistUserFS(); closeModals(); render(); notifyDesktopChange();
  toast('Created "'+finalName+'"');
}

function openRenameModal(node){
  $('#rename-name').value=node.name;
  $('#modal-rename').classList.add('show');
  $('#modal-rename')._node=node;
  setTimeout(function(){var i=$('#rename-name');i.focus();i.select();},30);
}
function confirmRename(){
  var node=$('#modal-rename')._node;
  var name=$('#rename-name').value.trim();
  if(!name || !node || !node.parent) { closeModals(); return; }
  var parent=node.parent;
  var finalName=uniqueName(parent,name,node.name);
  delete parent.children[node.name];
  node.name=finalName; node.mtime=nowTs();
  parent.children[finalName]=node;
  persistUserFS(); closeModals(); render(); notifyDesktopChange();
  toast('Renamed to "'+finalName+'"');
}

function duplicateNode(node){
  if(!node.parent) return;
  var copy=JSON.parse(JSON.stringify(node,function(k,v){return k==='parent'?undefined:v}));
  copy.parent=node.parent;
  copy.name=uniqueName(node.parent, node.name.replace(/(\.[^.]+)?$/, ' copy$1'));
  copy.mtime=nowTs();
  restoreParents(copy,node.parent);
  node.parent.children[copy.name]=copy;
  persistUserFS(); render(); notifyDesktopChange();
  toast('Duplicated "'+node.name+'"');
}

function deleteNode(node){
  if(!node.parent) return;
  if(!confirm('Move "'+node.name+'" to Trash? This cannot be undone in this demo.')) return;
  delete node.parent.children[node.name];
  persistUserFS(); selected=null; render(); notifyDesktopChange();
  toast('Deleted "'+node.name+'"');
}

function downloadNode(node){
  var blob;
  if(node.dataUrl){
    var arr=node.dataUrl.split(','); var mime=arr[0].match(/:(.*?);/)[1]; var bstr=atob(arr[1]);
    var u8=new Uint8Array(bstr.length);
    for(var i=0;i<bstr.length;i++) u8[i]=bstr.charCodeAt(i);
    blob=new Blob([u8],{type:mime});
  } else {
    blob=new Blob([node.content||''],{type:node.mime||'text/plain'});
  }
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a'); a.href=url; a.download=node.name; a.click();
  URL.revokeObjectURL(url);
}
function downloadRepoCopy(node){
  fetch(resolveRepoUrl(node.path)).then(function(r){return r.blob()}).then(function(blob){
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a'); a.href=url; a.download=node.name; a.click();
    URL.revokeObjectURL(url);
  }).catch(function(){ toast('Could not download '+node.name); });
}

function uniqueName(dir,name,ignoreName){
  if(!dir.children) return name;
  if(!dir.children[name] || name===ignoreName) return name;
  var m=name.match(/^(.*?)(\.[^.]+)?$/);
  var base=m[1], ext=m[2]||'';
  var i=2;
  while(dir.children[base+' '+i+ext] && (base+' '+i+ext)!==ignoreName) i++;
  return base+' '+i+ext;
}
function guessMime(name){
  var n=name.toLowerCase();
  if(/\.html?$/.test(n)) return 'text/html';
  if(/\.md$/.test(n)) return 'text/markdown';
  if(/\.json$/.test(n)) return 'application/json';
  return 'text/plain';
}

$('#new-folder-btn').onclick=function(){ if(curRoot==='repo'){toast('Project files are read-only');return;} openNewFolderModal(); };
$('#upload-btn').onclick=function(){ if(curRoot==='repo'){toast('Project files are read-only');return;} $('#upload-input').click(); };

/* ══════════════════════════════════════════════════════════
   UPLOAD (file picker + drag & drop)
   ══════════════════════════════════════════════════════════ */
function handleUploadFiles(fileList){
  if(curRoot==='repo'){ toast('Cannot upload into read-only Project folder'); return; }
  var dir=curDir();
  if(!dir.children) dir.children={};
  var files=Array.prototype.slice.call(fileList);
  var remaining=files.length;
  if(!remaining) return;
  files.forEach(function(file){
    var reader=new FileReader();
    var isText = /^(text\/|application\/(json|javascript|xml))/.test(file.type) || /\.(txt|md|json|js|css|html?|csv|xml|yaml|yml)$/i.test(file.name);
    reader.onload=function(e){
      var finalName=uniqueName(dir,file.name);
      var node={name:finalName,type:'file',mtime:nowTs(),parent:dir,mime:file.type||guessMime(file.name)};
      if(isText){ node.content=e.target.result; }
      else { node.dataUrl=e.target.result; node._size=file.size; }
      dir.children[finalName]=node;
      remaining--;
      if(remaining===0){ persistUserFS(); render(); notifyDesktopChange(); toast('Uploaded '+files.length+' file'+(files.length>1?'s':'')); }
    };
    if(isText) reader.readAsText(file); else reader.readAsDataURL(file);
  });
}
$('#upload-input').addEventListener('change',function(e){ handleUploadFiles(e.target.files); e.target.value=''; });

var vp=$('#view-port');
vp.addEventListener('dragover',function(e){ e.preventDefault(); if(curRoot!=='repo') vp.classList.add('dragover'); });
vp.addEventListener('dragleave',function(e){ vp.classList.remove('dragover'); });
vp.addEventListener('drop',function(e){
  e.preventDefault(); vp.classList.remove('dragover');
  if(curRoot==='repo'){ toast('Cannot upload into read-only Project folder'); return; }
  if(e.dataTransfer.files.length) handleUploadFiles(e.dataTransfer.files);
});

/* Deselect on background click */
$('#view-port').addEventListener('click',function(e){
  if(e.target===this || e.target.classList.contains('icon-grid')){
    $$('.fs-item,.list-view tr').forEach(function(x){x.classList.remove('selected')});
    selected=null;
  }
});

/* Keyboard shortcuts */
document.addEventListener('keydown',function(e){
  if(e.key==='Delete' || e.key==='Backspace'){
    if(selected && selected.parent && document.activeElement.tagName!=='INPUT' && document.activeElement.tagName!=='TEXTAREA'){
      deleteNode(selected);
    }
  }
  if(e.key==='Enter' && selected && document.activeElement.tagName!=='INPUT'){
    openNode(selected);
  }
  if(e.key==='Escape'){ closeModals(); $('#preview-overlay').classList.remove('show'); $('#ctx-menu').classList.remove('show'); }
  if((e.metaKey||e.ctrlKey) && e.key==='f'){ e.preventDefault(); $('#search-input').focus(); }
});
$$('.modal-body input').forEach(function(inp){
  inp.addEventListener('keydown',function(e){
    if(e.key==='Enter'){
      if(inp.id==='newfolder-name') confirmNewFolder();
      else if(inp.id==='newfile-name') confirmNewFile();
      else if(inp.id==='rename-name') confirmRename();
    }
  });
});
$$('.modal-overlay').forEach(function(ov){
  ov.addEventListener('click',function(e){ if(e.target===ov) closeModals(); });
});

/* ══════════════════════════════════════════════════════════
   TOAST
   ══════════════════════════════════════════════════════════ */
function toast(msg){
  var t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(function(){t.classList.remove('show')},2400);
}

/* ══════════════════════════════════════════════════════════
   SYNC WITH DESKTOP (Desktop folder <-> shell desktop icons)
   Listen for messages from the shell requesting the desktop file list,
   and react to storage changes made in other windows/tabs.
   ══════════════════════════════════════════════════════════ */
window.addEventListener('storage',function(e){
  if(e.key===LS_KEY){
    safe(function(){
      var parsed=JSON.parse(e.newValue);
      restoreParents(parsed,null);
      userRoot=parsed;
      render();
    });
  }
});
window.addEventListener('message',function(e){
  var d=e.data||{};
  if(d.type==='requestDesktopFiles'){
    var desk=nodeAt('user',['Desktop']);
    var list=desk&&desk.children ? Object.keys(desk.children).map(function(k){return {name:k,type:desk.children[k].type}}) : [];
    safe(function(){ e.source.postMessage({type:'desktopFilesResponse',files:list},'*'); });
  }
});

/* ══════════════════════════════════════════════════════════
   INIT
   ══════════════════════════════════════════════════════════ */
render();
