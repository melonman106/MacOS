<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1c1c1e;--bg2:#232325;--bg3:#2a2a2c;--elevated:#323234;
  --border:rgba(255,255,255,.08);--text:#f0f0f2;--text2:rgba(255,255,255,.5);--text3:rgba(255,255,255,.28);
  --accent:#0a84ff;--accent-dim:rgba(10,132,255,.18);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);display:flex}

/* Sidebar */
.sidebar{width:190px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--border);padding:10px 0;overflow-y:auto}
.sb-sec{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;padding:10px 14px 4px}
.sb-item{display:flex;align-items:center;gap:9px;padding:6px 12px;margin:1px 8px;border-radius:7px;font-size:13px;color:rgba(255,255,255,.85);cursor:pointer}
.sb-item:hover{background:rgba(255,255,255,.06)}
.sb-item.active{background:var(--accent-dim);color:var(--accent)}
.sb-icon{width:16px;text-align:center;font-size:13px;flex-shrink:0}

/* Main */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.toolbar{height:44px;flex-shrink:0;display:flex;align-items:center;gap:8px;padding:0 14px;border-bottom:1px solid var(--border);background:var(--bg2)}
.tb-nav{display:flex;gap:2px}
.tb-btn{width:28px;height:28px;border-radius:6px;border:none;background:transparent;color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px}
.tb-btn:hover{background:var(--elevated);color:var(--text)}
.tb-btn:disabled{opacity:.3;cursor:default}
.tb-btn:disabled:hover{background:transparent}
.breadcrumb{flex:1;display:flex;align-items:center;gap:4px;font-size:13px;color:var(--text2);overflow-x:auto;white-space:nowrap}
.crumb{cursor:pointer;padding:2px 6px;border-radius:5px}
.crumb:hover{background:var(--elevated);color:var(--text)}
.crumb.current{color:var(--text);font-weight:600}
.crumb-sep{color:var(--text3)}
.search-box{width:180px;padding:5px 10px;background:var(--bg3);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:12px;outline:none}
.view-toggle{display:flex;background:var(--bg3);border-radius:7px;padding:2px}
.view-toggle button{border:none;background:transparent;color:var(--text2);padding:4px 8px;border-radius:5px;font-size:12px;cursor:pointer}
.view-toggle button.active{background:var(--elevated);color:var(--text)}

.content{flex:1;overflow-y:auto;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:14px}
.item{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px;border-radius:10px;cursor:pointer;text-align:center;user-select:none}
.item:hover{background:rgba(255,255,255,.05)}
.item.selected{background:var(--accent-dim);box-shadow:inset 0 0 0 1px rgba(10,132,255,.4)}
.item-icon{width:52px;height:52px;display:flex;align-items:center;justify-content:center;font-size:34px}
.item-icon.folder{color:#5ac8fa}
.item-icon.file{color:var(--text2)}
.item-icon img{width:100%;height:100%;object-fit:cover;border-radius:8px}
.item-name{font-size:11.5px;line-height:1.3;word-break:break-word;max-width:90px}

.list{display:flex;flex-direction:column}
.list-row{display:grid;grid-template-columns:28px 1fr 90px 140px;align-items:center;gap:10px;padding:6px 10px;border-radius:8px;cursor:pointer;font-size:12.5px}
.list-row:hover{background:rgba(255,255,255,.05)}
.list-row.selected{background:var(--accent-dim)}
.list-row .lname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-row .lsize,.list-row .ldate{color:var(--text2)}
.list-head{display:grid;grid-template-columns:28px 1fr 90px 140px;gap:10px;padding:4px 10px;font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--border);margin-bottom:4px}

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:10px;color:var(--text3)}
.empty .ei{font-size:48px}

.statusbar{height:26px;flex-shrink:0;border-top:1px solid var(--border);display:flex;align-items:center;padding:0 14px;font-size:11px;color:var(--text2);background:var(--bg2)}

/* Context menu */
.ctx-menu{position:fixed;min-width:170px;background:rgba(40,40,44,.92);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:10px;padding:5px;box-shadow:0 14px 40px rgba(0,0,0,.5);z-index:500;display:none}
.ctx-menu.show{display:block}
.ctx-item{padding:7px 11px;border-radius:6px;font-size:12.5px;cursor:pointer}
.ctx-item:hover{background:var(--accent)}
.ctx-item.danger:hover{background:#ff453a}
.ctx-sep{height:1px;background:var(--border);margin:4px 2px}

#uploadInput{display:none}
</style>
</head>
<body>

<aside class="sidebar">
  <div class="sb-sec">Favorites</div>
  <div class="sb-item active" data-path="/"> <span>Home</span></div>
  <div class="sb-item" data-path="/Desktop"> <span>Desktop</span></div>
  <div class="sb-item" data-path="/Documents"> <span>Documents</span></div>
  <div class="sb-item" data-path="/Downloads"> <span>Downloads</span></div>
  <div class="sb-item" data-path="/Pictures"> <span>Pictures</span></div>
  <div class="sb-item" data-path="/Music"> <span>Music</span></div>
  <div class="sb-sec">Locations</div>
  <div class="sb-item" data-path="/Golden Gate"> <span>Golden Gate</span></div>
</aside>

<div class="main">
  <div class="toolbar">
    <div class="tb-nav">
      <button class="tb-btn" id="btnBack" title="Back">←</button>
      <button class="tb-btn" id="btnFwd" title="Forward">→</button>
      <button class="tb-btn" id="btnUp" title="Up a level">↑</button>
    </div>
    <div class="breadcrumb" id="breadcrumb"></div>
    <input class="search-box" id="searchBox" placeholder="Search">
    <div class="view-toggle">
      <button id="viewGridBtn" class="active">Grid</button>
      <button id="viewListBtn">List</button>
    </div>
    <button class="tb-btn" id="btnNewFolder" title="New Folder">＋</button>
    <button class="tb-btn" id="btnUpload" title="Upload files">⬆</button>
  </div>

  <div class="content" id="content"></div>

  <div class="statusbar" id="statusbar">0 items</div>
</div>

<div class="ctx-menu" id="ctxMenu">
  <div class="ctx-item" id="ctxOpen">Open</div>
  <div class="ctx-item" id="ctxRename">Rename</div>
  <div class="ctx-sep"></div>
  <div class="ctx-item danger" id="ctxDelete">Move to Trash</div>
</div>

<input type="file" id="uploadInput" multiple>

<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var STORE_KEY='files_app_fs_v1';

/* ============================================================
   NOTIFICATOR BRIDGE (shared pattern with Text/Gallery)
============================================================ */
var notifCounter=0, notifResolvers={};
function inIframe(){ try { return window.self !== window.top; } catch(e){ return true; } }
window.addEventListener('message', function(e){
  var d=e.data||{};
  if(d.type==='notificatorResult' && notifResolvers[d.id]){
    var resolve=notifResolvers[d.id]; delete notifResolvers[d.id]; resolve({confirmed:d.confirmed, value:d.value});
  }
});
function notificatorTextBox(message, placeholder, value){
  return new Promise(function(resolve){
    if(!inIframe()){ var v=window.prompt(message,value||''); resolve(v===null?{confirmed:false}:{confirmed:true,value:v}); return; }
    var id='notif-'+(++notifCounter)+'-'+Date.now(); var settled=false;
    notifResolvers[id]=function(res){ settled=true; resolve(res); };
    window.parent.postMessage({type:'notificatorTextBox', id:id, message:message, placeholder:placeholder||'', value:value||''}, '*');
    setTimeout(function(){ if(!settled){ delete notifResolvers[id]; var v=window.prompt(message,value||''); resolve(v===null?{confirmed:false}:{confirmed:true,value:v}); } }, 4000);
  });
}
function notificatorNormal(message){
  return new Promise(function(resolve){
    if(!inIframe()){ resolve({confirmed:window.confirm(message)}); return; }
    var id='notif-'+(++notifCounter)+'-'+Date.now(); var settled=false;
    notifResolvers[id]=function(res){ settled=true; resolve(res); };
    window.parent.postMessage({type:'notificatorNormal', id:id, message:message}, '*');
    setTimeout(function(){ if(!settled){ delete notifResolvers[id]; resolve({confirmed:window.confirm(message)}); } }, 4000);
  });
}

/* ============================================================
   VIRTUAL FILESYSTEM
   Stored flat as { "/path/to/item": {type:'folder'|'file', mtime, size, dataUrl?, mime?} }
============================================================ */
function defaultFS(){
  var now=Date.now();
  var fs={};
  ['/Desktop','/Documents','/Downloads','/Pictures','/Music','/Golden Gate'].forEach(function(p){
    fs[p]={type:'folder',mtime:now};
  });
  fs['/Desktop/Welcome.txt']={type:'file',mtime:now,size:120,mime:'text/plain',content:'Welcome to Files.\n\nDrag files in with Upload, organize with folders, and open images/videos/audio with Gallery.'};
  return fs;
}
function loadFS(){ try{ var v=localStorage.getItem(STORE_KEY); return v?JSON.parse(v):defaultFS(); }catch(e){ return defaultFS(); } }
function saveFS(fs){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(fs)); }catch(e){} }

var fs=loadFS();
var cwd='/';
var history=['/'], histIdx=0;
var view = localStorage.getItem('files_view')||'grid';
var selected=null;
var ctxTargetPath=null;

function joinPath(base, name){ return (base==='/'?'':base) + '/' + name; }
function parentOf(p){ if(p==='/') return '/'; var parts=p.split('/').filter(Boolean); parts.pop(); return '/'+parts.join('/'); }
function baseName(p){ var parts=p.split('/').filter(Boolean); return parts[parts.length-1]||'/'; }

function childrenOf(path){
  var prefix = path==='/' ? '/' : path+'/';
  var out=[];
  Object.keys(fs).forEach(function(p){
    if(p===path) return;
    if(!p.startsWith(prefix)) return;
    var rest=p.slice(prefix.length);
    if(rest.indexOf('/')===-1) out.push(p);
  });
  return out.sort(function(a,b){
    var fa=fs[a], fb=fs[b];
    if(fa.type!==fb.type) return fa.type==='folder'?-1:1;
    return baseName(a).localeCompare(baseName(b));
  });
}

function fmtSize(n){ if(!n) return '--'; if(n<1024) return n+' B'; if(n<1048576) return (n/1024).toFixed(1)+' KB'; return (n/1048576).toFixed(1)+' MB'; }
function fmtDate(ts){ if(!ts) return ''; return new Date(ts).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}); }
function esc(s){ var d=document.createElement('div'); d.textContent=String(s||''); return d.innerHTML; }

function iconFor(path, entry){
  if(entry.type==='folder') return {kind:'emoji', val:'📁'};
  var ext=(path.split('.').pop()||'').toLowerCase();
  var imgExts=['png','jpg','jpeg','webp','gif','bmp','svg'];
  if(imgExts.includes(ext) && entry.dataUrl) return {kind:'img', val:entry.dataUrl};
  var map={pdf:'📕',mp4:'🎬',mov:'🎬',webm:'🎬',mp3:'🎵',wav:'🎵',m4a:'🎵',txt:'📄',md:'📄',html:'🌐',json:'🧾',csv:'📊'};
  return {kind:'emoji', val: map[ext] || '📄'};
}

/* ============================================================
   NAVIGATION
============================================================ */
function navigate(path, pushHistory){
  if(!fs[path] && path!=='/') return;
  cwd=path;
  if(pushHistory!==false){
    history = history.slice(0, histIdx+1);
    history.push(path);
    histIdx=history.length-1;
  }
  selected=null;
  render();
}
$('#btnBack').addEventListener('click', function(){ if(histIdx>0){ histIdx--; navigate(history[histIdx], false); } });
$('#btnFwd').addEventListener('click', function(){ if(histIdx<history.length-1){ histIdx++; navigate(history[histIdx], false); } });
$('#btnUp').addEventListener('click', function(){ if(cwd!=='/') navigate(parentOf(cwd)); });

$$('.sb-item').forEach(function(el){
  el.addEventListener('click', function(){
    $$('.sb-item').forEach(function(x){ x.classList.remove('active'); });
    el.classList.add('active');
    var p=el.dataset.path;
    if(!fs[p] && p!=='/'){ fs[p]={type:'folder',mtime:Date.now()}; saveFS(fs); }
    navigate(p);
  });
});

/* ============================================================
   RENDER
============================================================ */
function renderBreadcrumb(){
  var parts = cwd==='/' ? [] : cwd.split('/').filter(Boolean);
  var html = '<span class="crumb'+(cwd==='/'?' current':'')+'" data-p="/">Home</span>';
  var acc='';
  parts.forEach(function(p, i){
    acc += '/'+p;
    var isLast = i===parts.length-1;
    html += '<span class="crumb-sep">›</span><span class="crumb'+(isLast?' current':'')+'" data-p="'+esc(acc)+'">'+esc(p)+'</span>';
  });
  $('#breadcrumb').innerHTML = html;
  $$('.crumb', $('#breadcrumb')).forEach(function(c){
    c.addEventListener('click', function(){ navigate(c.dataset.p); });
  });
}

function render(){
  renderBreadcrumb();
  var kids = childrenOf(cwd);
  var q = $('#searchBox').value.trim().toLowerCase();
  if(q) kids = kids.filter(function(p){ return baseName(p).toLowerCase().includes(q); });

  var content = $('#content');
  if(!kids.length){
    content.innerHTML = '<div class="empty"><div class="ei">📭</div><div>'+(q?'No matching items':'This folder is empty')+'</div></div>';
    $('#statusbar').textContent = '0 items';
    return;
  }

  if(view==='grid'){
    content.innerHTML = '<div class="grid">' + kids.map(function(p){
      var e=fs[p]; var ic=iconFor(p,e);
      var iconHtml = ic.kind==='img' ? '<img src="'+ic.val+'" alt="">' : ic.val;
      return '<div class="item'+(selected===p?' selected':'')+'" data-path="'+esc(p)+'">'+
             '<div class="item-icon '+(e.type==='folder'?'folder':'file')+'">'+iconHtml+'</div>'+
             '<div class="item-name">'+esc(baseName(p))+'</div></div>';
    }).join('') + '</div>';
  } else {
    content.innerHTML = '<div class="list-head"><span></span><span>Name</span><span>Size</span><span>Date</span></div><div class="list">' + kids.map(function(p){
      var e=fs[p]; var ic=iconFor(p,e);
      var iconHtml = ic.kind==='img' ? '<img src="'+ic.val+'" style="width:20px;height:20px;object-fit:cover;border-radius:4px" alt="">' : '<span style="font-size:16px">'+ic.val+'</span>';
      return '<div class="list-row'+(selected===p?' selected':'')+'" data-path="'+esc(p)+'">'+
             '<span>'+iconHtml+'</span><span class="lname">'+esc(baseName(p))+'</span>'+
             '<span class="lsize">'+(e.type==='folder'?'--':fmtSize(e.size))+'</span>'+
             '<span class="ldate">'+fmtDate(e.mtime)+'</span></div>';
    }).join('') + '</div>';
  }

  $$('[data-path]', content).forEach(function(el){
    el.addEventListener('click', function(ev){
      selected = el.dataset.path;
      $$('[data-path]', content).forEach(function(x){ x.classList.remove('selected'); });
      el.classList.add('selected');
    });
    el.addEventListener('dblclick', function(){ openEntry(el.dataset.path); });
    el.addEventListener('contextmenu', function(ev){
      ev.preventDefault();
      selected = el.dataset.path;
      ctxTargetPath = el.dataset.path;
      openCtxMenu(ev.clientX, ev.clientY);
    });
  });

  $('#statusbar').textContent = kids.length + (kids.length===1?' item':' items');
}

function openEntry(path){
  var e=fs[path]; if(!e) return;
  if(e.type==='folder'){ navigate(path); return; }
  var ext=(path.split('.').pop()||'').toLowerCase();
  var mediaExts=['png','jpg','jpeg','webp','gif','bmp','mp4','mov','webm','mp3','wav','m4a','pdf'];
  if(mediaExts.includes(ext)){
    try{
      window.parent.postMessage({type:'openWindow', title:'Gallery', icon:'./images/Gallery.png', url:'./apps/Gallery/index.html?open='+encodeURIComponent(path), w:1020, h:660}, '*');
    }catch(err){}
    return;
  }
  var textExts=['txt','md','json','csv','html','js','css'];
  if(textExts.includes(ext)){
    try{
      window.parent.postMessage({type:'openWindow', title:'Text', icon:'./images/Text.png', url:'./apps/Text/index.html', w:820, h:600}, '*');
    }catch(err){}
    return;
  }
}

$('#searchBox').addEventListener('input', render);
$('#viewGridBtn').addEventListener('click', function(){ view='grid'; localStorage.setItem('files_view',view); this.classList.add('active'); $('#viewListBtn').classList.remove('active'); render(); });
$('#viewListBtn').addEventListener('click', function(){ view='list'; localStorage.setItem('files_view',view); this.classList.add('active'); $('#viewGridBtn').classList.remove('active'); render(); });
if(view==='list'){ $('#viewListBtn').classList.add('active'); $('#viewGridBtn').classList.remove('active'); }

/* ============================================================
   NEW FOLDER / UPLOAD / RENAME / DELETE
============================================================ */
$('#btnNewFolder').addEventListener('click', function(){
  notificatorTextBox('Name the new folder', 'Folder name', 'New Folder').then(function(res){
    if(!res.confirmed || !res.value || !res.value.trim()) return;
    var name=res.value.trim();
    var p=joinPath(cwd, name);
    if(fs[p]){ notificatorNormal('An item named "'+name+'" already exists here.'); return; }
    fs[p]={type:'folder', mtime:Date.now()};
    saveFS(fs);
    render();
  });
});

$('#btnUpload').addEventListener('click', function(){ $('#uploadInput').click(); });
$('#uploadInput').addEventListener('change', function(e){
  var files=Array.from(e.target.files||[]);
  var remaining=files.length;
  if(!remaining) return;
  files.forEach(function(file){
    var reader=new FileReader();
    reader.onload=function(ev){
      var p=joinPath(cwd, file.name);
      fs[p]={type:'file', mtime:Date.now(), size:file.size, mime:file.type, dataUrl:ev.target.result};
      remaining--;
      if(remaining===0){ saveFS(fs); render(); }
    };
    reader.readAsDataURL(file);
  });
  e.target.value='';
});

function openCtxMenu(x,y){
  var m=$('#ctxMenu');
  m.style.left=x+'px'; m.style.top=y+'px';
  m.classList.add('show');
}
document.addEventListener('click', function(e){ if(!e.target.closest('#ctxMenu')) $('#ctxMenu').classList.remove('show'); });
$('#ctxOpen').addEventListener('click', function(){ if(ctxTargetPath) openEntry(ctxTargetPath); $('#ctxMenu').classList.remove('show'); });
$('#ctxRename').addEventListener('click', function(){
  $('#ctxMenu').classList.remove('show');
  if(!ctxTargetPath) return;
  var e=fs[ctxTargetPath]; var oldName=baseName(ctxTargetPath);
  notificatorTextBox('Rename "'+oldName+'"', 'New name', oldName).then(function(res){
    if(!res.confirmed || !res.value || !res.value.trim()) return;
    var newName=res.value.trim();
    var newPath=joinPath(parentOf(ctxTargetPath), newName);
    if(fs[newPath]){ notificatorNormal('An item named "'+newName+'" already exists here.'); return; }
    if(e.type==='folder'){
      var prefix=ctxTargetPath+'/';
      Object.keys(fs).slice().forEach(function(p){
        if(p===ctxTargetPath || p.startsWith(prefix)){
          var suffix=p.slice(ctxTargetPath.length);
          fs[newPath+suffix]=fs[p];
          delete fs[p];
        }
      });
    } else {
      fs[newPath]=fs[ctxTargetPath];
      delete fs[ctxTargetPath];
    }
    saveFS(fs); render();
  });
});
$('#ctxDelete').addEventListener('click', function(){
  $('#ctxMenu').classList.remove('show');
  if(!ctxTargetPath) return;
  var name=baseName(ctxTargetPath);
  notificatorNormal('Move "'+name+'" to Trash? This cannot be undone.').then(function(res){
    if(!res.confirmed) return;
    var e=fs[ctxTargetPath];
    if(e && e.type==='folder'){
      var prefix=ctxTargetPath+'/';
      Object.keys(fs).slice().forEach(function(p){ if(p===ctxTargetPath || p.startsWith(prefix)) delete fs[p]; });
    } else {
      delete fs[ctxTargetPath];
    }
    saveFS(fs); selected=null; render();
  });
});

document.addEventListener('keydown', function(e){
  if(e.key==='Delete' || e.key==='Backspace'){
    if(selected && document.activeElement.tagName!=='INPUT'){
      ctxTargetPath=selected;
      $('#ctxDelete').click();
    }
  }
  if(e.key==='F2' && selected && document.activeElement.tagName!=='INPUT'){
    ctxTargetPath=selected;
    $('#ctxRename').click();
  }
});

/* ============================================================
   INIT
============================================================ */
render();
})();
</script>
</body>
</html>
