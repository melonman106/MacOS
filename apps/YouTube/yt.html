    '<div class="crop-zoom">'+MINUS+'<input type="range" id="crop-zoom" min="100" max="400" value="100" aria-label="Zoom">'+ic('add')+'</div>'+
    '<div class="crop-prev"><span class="muted">Preview</span><canvas id="crop-p1" width="64" height="64"></canvas><canvas id="crop-p2" width="32" height="32"></canvas></div>'+
    '<div class="crop-note">Drag the photo to choose the area. Scroll or use the slider to zoom.</div>'+
    '<div class="crop-actions"><button class="pill" data-act="crop-pick">Different photo</button><button class="pill-blue" data-act="crop-save" id="crop-save">Save</button></div></div>'+
    '<div class="err" id="crop-err" role="alert"></div></div>',mountCropper,cropFree);
}
function cropFree(){if(crop.url){try{URL.revokeObjectURL(crop.url);}catch(e){}}crop.url=null;crop.img=null;crop.drag=null;crop.saving=false;}
function mountCropper(root){
  const file=root.querySelector('#crop-file'),drop=root.querySelector('#crop-drop'),cv=root.querySelector('#crop-cv'),zoom=root.querySelector('#crop-zoom');
  file.addEventListener('change',()=>{if(file.files&&file.files[0])cropLoad(file.files[0]);file.value='';});
  ['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over');}));
  ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over');}));
  drop.addEventListener('drop',e=>{const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];if(f)cropLoad(f);});
  drop.addEventListener('keydown',e=>{if(e.target===drop&&(e.key==='Enter'||e.key===' ')){e.preventDefault();file.click();}});
  cv.addEventListener('pointerdown',e=>{crop.drag={x:e.clientX,y:e.clientY,ox:crop.ox,oy:crop.oy};try{cv.setPointerCapture(e.pointerId);}catch(_){}cv.classList.add('grab');});
  cv.addEventListener('pointermove',e=>{
    if(!crop.drag)return;
    const k=crop.S/(cv.getBoundingClientRect().width||crop.S);
    crop.ox=crop.drag.ox+(e.clientX-crop.drag.x)*k;crop.oy=crop.drag.oy+(e.clientY-crop.drag.y)*k;
    cropClamp();cropDraw();
  });
  const end=()=>{crop.drag=null;cv.classList.remove('grab');};
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  cv.addEventListener('wheel',e=>{e.preventDefault();cropZoom(crop.z*Math.exp(-e.deltaY*0.0015));},{passive:false});
  cv.addEventListener('keydown',e=>{
    let h=true;
    if(e.key==='ArrowLeft')crop.ox-=8;else if(e.key==='ArrowRight')crop.ox+=8;else if(e.key==='ArrowUp')crop.oy-=8;else if(e.key==='ArrowDown')crop.oy+=8;
    else if(e.key==='+'||e.key==='=')crop.z=Math.min(4,crop.z*1.1);else if(e.key==='-')crop.z=Math.max(1,crop.z/1.1);else h=false;
    if(h){e.preventDefault();zoom.value=Math.round(crop.z*100);cropClamp();cropDraw();}
  });
  zoom.addEventListener('input',()=>cropZoom(zoom.value/100));
}
function cropLoad(f){
  const err=$('crop-err');if(!err)return;err.textContent='';
  if(!/^image\/(png|jpe?g|webp|gif)$/i.test(f.type)){err.textContent='Please choose a PNG, JPG, WEBP or GIF image.';return;}
  if(f.size>25*1024*1024){err.textContent='That image is too large (25 MB max).';return;}
  cropFree();
  const url=URL.createObjectURL(f),img=new Image();
  img.onload=()=>{
    if(!$('crop-work')){URL.revokeObjectURL(url);return;}                     // dialog was closed
    if(img.naturalWidth<64||img.naturalHeight<64){URL.revokeObjectURL(url);$('crop-err').textContent='That image is too small. Use one that is at least 64 × 64 pixels.';return;}
    crop.img=img;crop.url=url;crop.w=img.naturalWidth;crop.h=img.naturalHeight;
    $('crop-drop').hidden=true;$('crop-work').hidden=false;
    cropLayout();$('crop-cv').focus({preventScroll:true});
  };
  img.onerror=()=>{URL.revokeObjectURL(url);const e=$('crop-err');if(e)e.textContent="That file couldn't be read as an image.";};
  img.src=url;
}
function cropLayout(){
  const st=$('crop-stage'),cv=$('crop-cv');
  const side=Math.min(320,Math.round(st.getBoundingClientRect().width)||320);
  crop.S=side;crop.C=Math.max(160,side-40);crop.dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=cv.height=Math.round(side*crop.dpr);
  crop.min=Math.max(crop.C/crop.w,crop.C/crop.h);crop.z=1;crop.ox=0;crop.oy=0;
  $('crop-zoom').value=100;cropDraw();
}
function cropPaint(ctx,out,k){
  const sc=crop.min*crop.z,dw=crop.w*sc*k,dh=crop.h*sc*k;
  ctx.drawImage(crop.img,out/2+crop.ox*k-dw/2,out/2+crop.oy*k-dh/2,dw,dh);
}
function cropClamp(){
  const sc=crop.min*crop.z,mx=Math.max(0,(crop.w*sc-crop.C)/2),my=Math.max(0,(crop.h*sc-crop.C)/2);
  crop.ox=Math.min(mx,Math.max(-mx,crop.ox));crop.oy=Math.min(my,Math.max(-my,crop.oy));
}
function cropZoom(z){crop.z=Math.min(4,Math.max(1,z));const r=$('crop-zoom');if(r)r.value=Math.round(crop.z*100);cropClamp();cropDraw();}
function cropDraw(){
  const cv=$('crop-cv');if(!cv||!crop.img)return;
  const S=crop.S,C=crop.C,ctx=cv.getContext('2d');
  ctx.setTransform(crop.dpr,0,0,crop.dpr,0,0);ctx.imageSmoothingQuality='high';
  ctx.fillStyle='#222';ctx.fillRect(0,0,S,S);cropPaint(ctx,S,1);
  ctx.fillStyle='rgba(0,0,0,.55)';ctx.beginPath();ctx.rect(0,0,S,S);ctx.arc(S/2,S/2,C/2,0,Math.PI*2,true);ctx.fill('evenodd');
  ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(S/2,S/2,C/2,0,Math.PI*2);ctx.stroke();
  [['crop-p1',64],['crop-p2',32]].forEach(a=>{
    const p=$(a[0]);if(!p)return;const n=a[1],c=p.getContext('2d');
    c.clearRect(0,0,n,n);c.save();c.beginPath();c.arc(n/2,n/2,n/2,0,Math.PI*2);c.clip();c.imageSmoothingQuality='high';cropPaint(c,n,n/C);c.restore();
  });
}
const clerkMsg=e=>(e&&e.errors&&e.errors[0]&&(e.errors[0].longMessage||e.errors[0].message))||(e&&e.message)||'Something went wrong.';
async function cropFinish(promiseFn,okMsg){
  const btn=$('crop-save'),err=$('crop-err');
  crop.saving=true;if(btn){btn.disabled=true;btn.textContent='Saving…';}
  try{
    await promiseFn();
    try{await AUTH.cu.reload();}catch(e){}
    user=mapUser(AUTH.cu);updateUserUI();closeDialog();toast(okMsg,'🖼️');
  }catch(e){
    console.warn('profile picture update failed',e);
    crop.saving=false;if(btn){btn.disabled=false;btn.textContent='Save';}
    if(err)err.textContent=clerkMsg(e);
  }
}
async function cropSave(){
  if(crop.saving||!crop.img||!AUTH.cu)return;
  const out=document.createElement('canvas');out.width=out.height=512;
  const c=out.getContext('2d');c.imageSmoothingQuality='high';c.fillStyle='#fff';c.fillRect(0,0,512,512);cropPaint(c,512,512/crop.C);
  const blob=await new Promise(r=>out.toBlob(r,'image/jpeg',0.92));
  if(!blob){$('crop-err').textContent="Couldn't prepare that image. Try a different photo.";return;}
  const file=new File([blob],'profile.jpg',{type:'image/jpeg'});
  cropFinish(()=>AUTH.cu.setProfileImage({file}),'Profile picture updated');
}
function cropRemove(){if(AUTH.cu&&!crop.saving)cropFinish(()=>AUTH.cu.setProfileImage({file:null}),'Profile picture removed');}

/* ================= SETTINGS ================= */
const SETTINGS=[['Home feed',[['home','Show home feed','Load videos on the home page'],['personalise','Personalised feed','Mix in channels you watch and subscribe to']]],['Playback',[['autonext','Autoplay next video','Play the next video when one ends'],['autoplay','Hover previews','Play a muted preview when hovering a thumbnail']]],['Appearance',[['dark','Dark theme','Use the dark colour theme'],['compact','Compact guide','Collapse the left menu by default']]],['Privacy',[['saveHist','Save watch history','Remember videos you watch']]]];
const REGIONS=[['US','United States'],['GB','United Kingdom'],['AU','Australia'],['CA','Canada'],['NZ','New Zealand'],['IN','India'],['DE','Germany'],['FR','France'],['JP','Japan'],['BR','Brazil']];
function buildSettings(){
  $('set-body').innerHTML=SETTINGS.map(s=>'<div class="set-sec">'+s[0]+'</div>'+s[1].map(r=>'<div class="set-row"><div class="set-lbl"><h4>'+r[1]+'</h4><p>'+r[2]+'</p></div><div class="toggle'+(isOn(r[0])?' on':'')+'" data-cfg="'+r[0]+'" role="switch" tabindex="0"></div></div>').join('')).join('')+
    '<div class="set-sec">Region</div><div class="set-row"><div class="set-lbl"><h4>Trending region</h4><p>Which country the Home and Trending charts use</p></div><select id="region-sel">'+REGIONS.map(r=>'<option value="'+r[0]+'"'+(cfg.region===r[0]?' selected':'')+'>'+r[1]+'</option>').join('')+'</select></div>'+
    '<div class="set-sec">Data</div><div class="set-row"><div class="set-lbl"><h4>Clear all data</h4><p>Erase history, subscriptions, playlists and settings</p></div><button class="danger" data-act="clear-all">Clear</button></div>';
  $('region-sel').addEventListener('change',e=>{cfg.region=e.target.value;saveCfg();toast('Region set','🌍');if(curRoute==='home'||curRoute==='feed')render();});
}
const isOn=k=>k==='dark'?document.body.classList.contains('dark'):!!cfg[k];
function openSettings(){buildSettings();$('set-panel').classList.add('open');$('set-ov').classList.add('open');}
function closeSettings(){$('set-panel').classList.remove('open');$('set-ov').classList.remove('open');}
$('settings-btn').addEventListener('click',openSettings);$('set-x').addEventListener('click',closeSettings);$('set-ov').addEventListener('click',closeSettings);
function toggleCfg(el){
  const k=el.dataset.cfg;
  if(k==='dark')applyDark(!document.body.classList.contains('dark'));
  else{cfg[k]=!cfg[k];saveCfg();if(k==='compact'){navCollapsed=cfg.compact;applyNav();}if(k==='home'&&curRoute==='home')render();if(k==='saveHist'&&curRoute==='feed')render();}
  el.classList.toggle('on',isOn(k));
}
function applyDark(d){
  document.body.classList.toggle('dark',d);LS.set('yt_dark',d);
  $('theme-btn').innerHTML=ic(d?'sun':'moon');
  document.querySelectorAll('[data-cfg="dark"]').forEach(e=>e.classList.toggle('on',d));
}
$('theme-btn').addEventListener('click',()=>applyDark(!document.body.classList.contains('dark')));
$('paste-btn').addEventListener('click',pasteDialog);

/* ================= HOVER PREVIEW ================= */
let hoverT=null,hoverEl=null;
function stopPreview(){clearTimeout(hoverT);hoverT=null;if(hoverEl){const f=hoverEl.querySelector('iframe');if(f)f.remove();hoverEl=null;}}
document.addEventListener('mouseover',e=>{
  const t=e.target.closest&&e.target.closest('.vthumb[data-vid]');
  if(!t||t===hoverEl)return;
  stopPreview();if(!cfg.autoplay||innerWidth<=680)return;
  hoverEl=t;
  hoverT=setTimeout(()=>{const f=document.createElement('iframe');f.src='https://www.youtube-nocookie.com/embed/'+t.dataset.vid+'?autoplay=1&mute=1&controls=0&disablekb=1&modestbranding=1&playsinline=1&rel=0';f.allow='autoplay';f.tabIndex=-1;t.appendChild(f);},900);
});
document.addEventListener('mouseout',e=>{if(!hoverEl)return;const to=e.relatedTarget;if(to&&hoverEl.contains(to))return;stopPreview();});

/* ================= ACTIONS (delegated) ================= */
function videoMenu(btn){
  const id=btn.dataset.vid,m=metaMap[id];if(!m)return;
  const wl=inList('WL',id);
  openMenu(btn,[
    {icon:'watchlater',label:wl?'Remove from Watch later':'Save to Watch later',fn:()=>{if(wl)removeFromList('WL',id);else addToList('WL',m);toast(wl?'Removed from Watch later':'Saved to Watch later','🕐');if(curRoute==='playlist')render();}},
    {icon:'playlist_add',label:'Save to playlist',fn:()=>saveDialog(m)},
    {icon:'share',label:'Share',fn:()=>shareDialog(m)},
    {sep:1},
    {icon:'block',label:'Not interested',fn:()=>{hidden.push(id);LS.set('yt_hidden',hidden.slice(-500));document.querySelectorAll('.vcard[data-vid="'+id+'"],.rrow[data-vid="'+id+'"],.rcard[data-vid="'+id+'"]').forEach(x=>x.remove());toast("Okay, we'll show fewer videos like this",'👍');}}
  ]);
}
const actions={
  menu:videoMenu,
  sub(t){
    const cid=t.dataset.cid,name=t.dataset.name;
    if(isSub(cid))openMenu(t,[{icon:'close',label:'Unsubscribe',fn:()=>unsubscribe(cid)}]);else subscribe(cid,name);
  },
  like(t){rate(t.dataset.vid,'like');},
  dislike(t){rate(t.dataset.vid,'dislike');},
  share(t){shareDialog(metaMap[t.dataset.vid]);},
  save(t){saveDialog(metaMap[t.dataset.vid]);},
  more(t){
    const id=t.dataset.vid,m=metaMap[id];
    openMenu(t,[{icon:'link',label:'Copy video link',fn:()=>copyText('https://youtu.be/'+id)},{icon:'watchlater',label:inList('WL',id)?'Remove from Watch later':'Save to Watch later',fn:()=>{if(inList('WL',id))removeFromList('WL',id);else if(m)addToList('WL',m);toast('Watch later updated','🕐');}},{icon:'play',label:'Open on YouTube',fn:()=>window.open('https://www.youtube.com/watch?v='+id,'_blank','noopener')}]);
  },
  seek(t){postCmd('seekTo',[+t.dataset.t,true]);window.scrollTo({top:0,behavior:'smooth'});},
  'desc-open'(t,e){if(e.target.closest('a[href]')&&!e.target.closest('[data-act="seek"]'))return;const d=$('w-desc');if(d)d.classList.add('open');},
  'desc-close'(t,e){e.stopPropagation();const d=$('w-desc');if(d)d.classList.remove('open');},
  'cmt-sort'(t){openMenu(t,[{icon:'sort',label:'Top comments',fn:()=>{cm.order='relevance';cm.token=null;$('cmt-list').innerHTML=SPIN;loadComments(false);}},{icon:'history',label:'Newest first',fn:()=>{cm.order='time';cm.token=null;$('cmt-list').innerHTML=SPIN;loadComments(false);}}]);},
  'cmt-add'(){toast('Posting comments needs a Google account, which this app cannot use','ℹ️',4000);},
  'cmt-more'(){loadComments(true);},
  async 'cmt-rep'(t){
    const box=t.nextElementSibling;if(!box)return;
    if(box.dataset.loaded){box.style.display=box.style.display==='none'?'':'none';return;}
    box.innerHTML=SPIN;
    try{const d=await api('comments',{part:'snippet',parentId:t.dataset.id,maxResults:50,textFormat:'plainText'});box.innerHTML=(d.items||[]).map(x=>cmtHTML(x,true)).join('');box.dataset.loaded='1';}
    catch(e){box.innerHTML='<p class="muted">'+esc(e.message)+'</p>';}
  },
  autonext(t){cfg.autonext=!cfg.autonext;saveCfg();t.classList.toggle('on',cfg.autonext);},
  'rel-tab'(t){drawRel(t.dataset.tab);},
  filters(){filterDialog(window._f||{q:''});},
  retry(){},
  reload(){render();},
  'subs-more'(){subsExpanded=!subsExpanded;renderSidebar();},
  'clear-hist'(){if(!watchHist.length)return;watchHist=[];LS.set('yt_hist',watchHist);viewHistory();toast('Watch history cleared','🗑️');},
  'pause-hist'(){cfg.saveHist=!cfg.saveHist;saveCfg();viewHistory();toast(cfg.saveHist?'Watch history is on':'Watch history is paused','⏸️');},
  'rm-hist'(t){watchHist=watchHist.filter(x=>x.id!==t.dataset.vid);LS.set('yt_hist',watchHist);const q=$('hist-q');viewHistory();if(q&&q.value){$('hist-q').value=q.value;}},
  'rm-local'(t){removeFromList(t.dataset.list,t.dataset.vid);render();},
  'del-list'(t){const id=t.dataset.list;if(!lists[id])return;if(confirm('Delete playlist "'+lists[id].name+'"?')){delete lists[id];saveLists();toast('Playlist deleted','🗑️');go('#/feed/playlists');}},
  'new-list'(){dialog('New playlist','<input class="field" id="np-name" placeholder="Playlist name" maxlength="60" aria-label="Playlist name"><button class="pill-blue" data-act="np-make" style="width:100%">Create</button>',b=>b.querySelector('#np-name').focus());},
  'np-make'(){const n=($('np-name').value||'').trim();if(!n)return;createList(n);closeDialog();toast('Playlist created','📚');if(curRoute==='feed')render();renderSidebar();},
  'np-create'(){const n=($('np-name').value||'').trim();if(!n||!saveVid)return;const id=createList(n);addToList(id,saveVid);toast('Saved to '+n,'📚');saveDialog(saveVid);},
  shuffle(t){const l=lists[t.dataset.list];if(!l||!l.items.length)return;const x=l.items[Math.floor(Math.random()*l.items.length)];go(vhref(x.id,t.dataset.list));},
  copy(t){copyText(t.dataset.v);},
  'paste-go'(){pasteGo();},
  async 'paste-clip'(){try{const tx=await navigator.clipboard.readText();$('paste-inp').value=tx;pasteGo();}catch(e){toast('Press Ctrl+V to paste into the box','ℹ️');$('paste-inp').focus();}},
  'acct-avatar'(){closeDialog();avatarDialog();},
  'acct-manage'(){
    const C=AUTH.clerk;closeDialog();
    try{if(C&&typeof C.openUserProfile==='function')C.openUserProfile();else if(C&&typeof C.redirectToUserProfile==='function')C.redirectToUserProfile();else toast('Account settings are not available','⚠️');}
    catch(e){toast("Couldn't open account settings",'⚠️');}
  },
  async 'acct-out'(){
    closeDialog();clearTimeout(cloud.t);cloud.t=null;
    try{await pushNow();}catch(e){}
    try{await AUTH.clerk.signOut();}catch(e){toast("Couldn't sign out",'⚠️');}
  },
  'crop-pick'(){const f=$('crop-file');if(f)f.click();},
  'crop-save'(){cropSave();},
  'crop-remove'(){cropRemove();},
  async 'clear-all'(){
    const signed=!!AUTH.cu;
    if(!confirm(signed?'Clear all history, subscriptions, playlists and settings? This also erases the copy saved in your account.':'Clear all history, subscriptions, playlists and settings?'))return;
    if(signed){try{await writeMeta(AUTH.cu,JSON.stringify({v:1,c:'',s:'',h:'',w:'',l:'',r:'',p:[],q:'',x:''}));}catch(e){toast("Couldn't clear the copy in your account",'⚠️');return;}}
    try{Object.keys(localStorage).filter(k=>k.indexOf('yt_')===0).forEach(k=>localStorage.removeItem(k));}catch(e){}
    location.reload();
  },
  'sh-prev'(){shGo(-1);},'sh-next'(){shGo(1);},
  'sh-toggle'(){sh.paused=!sh.paused;shCmd(sh.paused?'pauseVideo':'playVideo');},
  'sh-mute'(t){sh.muted=!sh.muted;shCmd(sh.muted?'mute':'unMute');t.innerHTML=ic(sh.muted?'mute':'vol');},
  'sh-like'(){const m=sh.items[sh.idx];if(!m)return;rate(m.id,'like');shDraw();},
  'sh-dislike'(){const m=sh.items[sh.idx];if(!m)return;rate(m.id,'dislike');toast('Thanks for the feedback','👎',1500);}
};
document.addEventListener('click',e=>{
  if(e.target.closest('#dlg a[href^="#"]'))closeDialog();
  if(e.target===$('dlg'))closeDialog();
  const t=e.target.closest('[data-act]');
  if(t){
    const f=actions[t.dataset.act];
    if(f){if(t.tagName==='A')e.preventDefault();f(t,e);}
  }
  const c=e.target.closest('[data-cfg]');if(c)toggleCfg(c);
  if(window.innerWidth<=960&&navOpen&&e.target.closest('#sidebar a'))navOpen=false,applyNav();
});
document.addEventListener('change',e=>{
  const k=e.target.dataset&&e.target.dataset.list;
  if(k&&saveVid){
    if(e.target.checked){addToList(k,saveVid);toast('Saved to '+lists[k].name,'📚');}
    else{removeFromList(k,saveVid.id);toast('Removed from '+lists[k].name,'🗑️');}
  }
});
$('dlg-x').addEventListener('click',closeDialog);
document.addEventListener('keydown',e=>{
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName||''));
  if(e.key==='Escape'){closeMenu();closeDialog();closeSettings();hideSugg();if(navOpen){navOpen=false;applyNav();}}
  else if(e.key==='/'&&!typing){e.preventDefault();searchInp.focus();}
  else if(curRoute==='shorts'&&!typing&&!dlgOpen()){
    if(e.key==='ArrowDown'||e.key==='j'){e.preventDefault();shGo(1);}
    else if(e.key==='ArrowUp'||e.key==='k'){e.preventDefault();shGo(-1);}
  }
  else if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.toggle[role=switch]')){e.preventDefault();e.target.click();}
});

/* ================= INIT ================= */
(function init(){
  const saved=LS.get('yt_dark',null);
  applyDark(saved===null?!!(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches):!!saved);
  updateUserUI();renderSidebar();
  // make sure subscribed channels have avatars in the sidebar
  if(subs.length)getChannels(subs.map(s=>s.id)).then(()=>{
    let ch=false;subs.forEach(s=>{const u=cAvatar(s.id);if(u&&s.avatar!==u){s.avatar=u;ch=true;}});if(ch)saveSubs();renderSidebar();
  }).catch(()=>{});
  render();
  initAuth();
})();
})();
