<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>YouTube</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<!-- Clerk: sign-in + saving everything to the signed-in account -->
<script
  defer
  crossorigin="anonymous"
  src="https://equipped-insect-97.clerk.accounts.dev/npm/@clerk/ui@1/dist/ui.browser.js"
  type="text/javascript">
</script>
<script
  defer
  crossorigin="anonymous"
  data-clerk-publishable-key="pk_test_ZXF1aXBwZWQtaW5zZWN0LTk3LmNsZXJrLmFjY291bnRzLmRldiQ"
  src="https://equipped-insect-97.clerk.accounts.dev/npm/@clerk/clerk-js@6/dist/clerk.browser.js"
  type="text/javascript">
</script>
<style>
:root{--yt-red:#f00;--bg:#fff;--bg2:#f9f9f9;--bg3:#f2f2f2;--text:#0f0f0f;--text2:#606060;--text3:#909090;--border:#e5e5e5;--hdr:#fff;--pop:#fff;--hover:rgba(0,0,0,.05);--active:rgba(0,0,0,.1);--chip-on:#0f0f0f;--chip-on-text:#fff;--chip-off:rgba(0,0,0,.05);--chip-hov:rgba(0,0,0,.1);--shadow:0 4px 32px rgba(0,0,0,.15);--blue:#065fd4;--font:'Roboto',Arial,sans-serif;--hh:56px}
body.dark{--bg:#0f0f0f;--bg2:#181818;--bg3:#272727;--text:#f1f1f1;--text2:#aaa;--text3:#717171;--border:#303030;--hdr:#0f0f0f;--pop:#282828;--hover:rgba(255,255,255,.1);--active:rgba(255,255,255,.15);--chip-on:#f1f1f1;--chip-on-text:#0f0f0f;--chip-off:rgba(255,255,255,.1);--chip-hov:rgba(255,255,255,.2);--shadow:0 4px 32px rgba(0,0,0,.7);--blue:#3ea6ff}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;font-size:14px;transition:background .2s,color .2s}
body.noscroll{overflow:hidden}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input,select{font-family:inherit;font-size:inherit;color:inherit}
svg{fill:currentColor;flex-shrink:0}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-thumb{background:rgba(0,0,0,.25);border-radius:6px;border:3px solid transparent;background-clip:content-box}
body.dark ::-webkit-scrollbar-thumb{background-color:rgba(255,255,255,.25)}
*:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.muted{color:var(--text2);font-size:14px}

/* HEADER */
.hdr{position:fixed;top:0;left:0;right:0;z-index:1000;height:var(--hh);display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:var(--hdr)}
.hdr-l{display:flex;align-items:center;gap:16px;min-width:0}
.icon-btn{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:50%;flex-shrink:0}
.icon-btn:hover{background:var(--hover)}
.icon-btn svg{width:24px;height:24px}
.logo{display:flex;align-items:center;padding:0 4px;color:var(--text)}
.hdr-c{flex:0 1 732px;display:flex;align-items:center;gap:12px;margin:0 16px;min-width:0}
.search-form{flex:1;display:flex;position:relative;min-width:0}
.search-wrap{flex:1;display:flex;align-items:center;border:1px solid var(--border);border-right:none;border-radius:40px 0 0 40px;background:var(--bg);margin-left:32px;padding-left:4px;min-width:0}
body.dark .search-wrap{border-color:#303030}
.search-wrap:focus-within{border-color:#1c62b9}
.si{flex:1;min-width:0;padding:0 12px;height:38px;border:none;outline:none;background:transparent;font-size:16px}
.si::placeholder{color:var(--text3)}
.sc{width:40px;height:40px;display:none;align-items:center;justify-content:center;color:var(--text2);border-radius:50%}
.sc.vis{display:flex}
.sc svg{width:20px;height:20px}
.sb{width:64px;height:40px;background:var(--bg3);border:1px solid var(--border);border-radius:0 40px 40px 0;display:flex;align-items:center;justify-content:center;flex-shrink:0}
body.dark .sb{background:#222;border-color:#303030}
.sb:hover{background:var(--active)}
.sb svg{width:24px;height:24px}
.voice-btn{width:40px;height:40px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;justify-content:center;flex-shrink:0}
body.dark .voice-btn{background:#272727}
.voice-btn:hover{background:var(--active)}
.voice-btn svg{width:24px;height:24px}
.sugg{display:none;position:absolute;top:44px;left:32px;right:64px;background:var(--pop);border-radius:12px;box-shadow:var(--shadow);padding:8px 0;z-index:1200;overflow:hidden}
.sugg.open{display:block}
.sg{display:flex;align-items:center;gap:12px;padding:0 16px;height:36px;cursor:pointer;font-size:16px}
.sg svg{width:20px;height:20px;color:var(--text2)}
.sg span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sg:hover,.sg.sel{background:var(--hover)}
.sg .rm{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.sg .rm:hover{background:var(--active)}
.hdr-r{display:flex;align-items:center;gap:4px;flex-shrink:0}
.sign-btn{display:flex;align-items:center;gap:6px;padding:0 12px;height:32px;margin-left:8px;border:1px solid var(--border);border-radius:40px;font-size:14px;font-weight:500;color:var(--blue);white-space:nowrap}
.sign-btn:hover{background:rgba(6,95,212,.08)}
.sign-btn svg{width:22px;height:22px}
.user-ava-btn{width:32px;height:32px;border-radius:50%;overflow:hidden;margin-left:8px;display:none;align-items:center;justify-content:center;font-size:14px;font-weight:500;color:#fff}
.user-ava-btn img{width:100%;height:100%;object-fit:cover}

/* SIDEBAR */
.sidebar{position:fixed;top:var(--hh);left:0;bottom:0;width:240px;overflow-y:auto;overflow-x:hidden;background:var(--bg);padding:12px;z-index:900;transition:transform .2s;scrollbar-width:thin}
.sidebar.rail{width:72px;padding:4px}
.s-item{display:flex;align-items:center;gap:24px;height:40px;padding:0 12px;border-radius:10px;font-size:14px;white-space:nowrap;width:100%;text-align:left}
.s-item:hover{background:var(--hover)}
.s-item.active{background:var(--active);font-weight:500}
.s-item svg{width:24px;height:24px}
.s-item>span:last-child{overflow:hidden;text-overflow:ellipsis}
.s-chan .ava{width:24px;height:24px;font-size:11px}
.s-rail{display:none}
.s-div{height:1px;background:var(--border);margin:12px 0}
.s-head{display:flex;align-items:center;gap:8px;padding:6px 12px;font-size:16px;font-weight:500;border-radius:10px;height:40px}
.s-head:hover{background:var(--hover)}
.s-head svg{width:20px;height:20px}
.s-head-plain{padding:6px 12px;font-size:16px;font-weight:500}
.s-foot{padding:12px;font-size:12px;line-height:1.5;color:var(--text3)}
.sidebar.rail .s-item{flex-direction:column;justify-content:center;gap:6px;height:74px;padding:0;font-size:10px;text-align:center}
.sidebar.rail .s-item:not(.s-main){display:none}
.sidebar.rail .s-rail{display:flex}
.sidebar.rail .s-div,.sidebar.rail .s-head,.sidebar.rail .s-head-plain,.sidebar.rail .s-foot{display:none}
body[data-nav=hidden]:not(.nav-open) .sidebar{transform:translateX(-100%)}
body.nav-open .sidebar{z-index:1100;width:240px;transform:none;box-shadow:var(--shadow)}
.scrim{display:none;position:fixed;top:var(--hh);left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:1050}
body.nav-open .scrim{display:block}

/* LAYOUT */
.content{padding-top:var(--hh);min-height:100vh}
body[data-nav=full] .content{margin-left:240px}
body[data-nav=rail] .content{margin-left:72px}
body[data-nav=hidden] .content{margin-left:0}

/* CHIPS */
.chips{position:sticky;top:var(--hh);z-index:90;background:var(--bg);padding:12px 24px;display:flex;gap:12px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;padding:0 12px;height:32px;border-radius:8px;font-size:14px;font-weight:500;white-space:nowrap;background:var(--chip-off);color:var(--text);flex-shrink:0}
.chip:hover{background:var(--chip-hov)}
.chip.active{background:var(--chip-on);color:var(--chip-on-text)}

/* AVATAR */
.ava{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;overflow:hidden;color:#fff;font-weight:500;flex-shrink:0;width:36px;height:36px;font-size:16px}
.ava img{width:100%;height:100%;object-fit:cover}

/* GRID + CARDS */
.grid-wrap{padding:8px 24px 24px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:40px 16px}
.vcard{min-width:0}
.vthumb{position:relative;display:block;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:var(--bg3)}
.vthumb img{width:100%;height:100%;object-fit:cover}
.vthumb iframe{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none;background:#000}
.dur{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.8);color:#fff;font-size:12px;font-weight:500;padding:1px 4px;border-radius:4px;line-height:16px;z-index:2}
.dur.live{background:#cc0000}
.vinfo{display:flex;gap:12px;padding-top:12px;position:relative}
.vtext{flex:1;min-width:0}
.vtitle{font-size:16px;font-weight:500;line-height:22px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:4px}
.vch{display:block;font-size:14px;line-height:20px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vch:hover{color:var(--text)}
.vstat{font-size:14px;line-height:20px;color:var(--text2)}
.vmenu{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-right:-8px;opacity:0}
.vcard:hover .vmenu,.rrow:hover .vmenu,.rcard:hover .vmenu,.vmenu:focus-visible{opacity:1}
.vmenu:hover{background:var(--hover)}
.vmenu svg{width:24px;height:24px}
.vcard.nochan .vava,.vcard.nochan .vch{display:none}
.vcard.nochan .vinfo{padding-top:8px}
.vcard.nochan .vtitle{font-size:14px;line-height:20px;font-weight:500}
.sentinel{min-height:1px}
.spin{width:28px;height:28px;margin:24px auto;border:3px solid var(--border);border-top-color:var(--text2);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* SKELETON */
.sk{background:linear-gradient(90deg,var(--bg3) 25%,var(--border) 50%,var(--bg3) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.sk-th{width:100%;aspect-ratio:16/9;border-radius:12px}
.sk-inf{display:flex;gap:12px;padding-top:12px}
.sk-av{width:36px;height:36px;border-radius:50%;flex-shrink:0}
.sk-ls{flex:1;display:flex;flex-direction:column;gap:8px}
.sk-ln{height:14px;border-radius:4px}
.sk-ln.s{width:60%}
.sk-banner{width:100%;aspect-ratio:6.2/1;border-radius:12px}

/* STATUS */
.status{text-align:center;padding:80px 24px}
.st-ic{font-size:64px;margin-bottom:16px}
.status h2{font-size:18px;font-weight:500;margin-bottom:8px}
.status p{font-size:14px;color:var(--text2)}
.pill-red,.pill-blue{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;height:36px;border-radius:18px;font-size:14px;font-weight:500;color:#fff;margin-top:16px}
.pill-red{background:var(--yt-red)}.pill-red:hover{background:#cc0000}
.pill-blue{background:var(--blue);margin-top:0}.pill-blue:hover{opacity:.9}
body.dark .pill-blue{color:#0f0f0f}
.pill{display:inline-flex;align-items:center;gap:6px;padding:0 16px;height:36px;border-radius:18px;font-size:14px;font-weight:500;background:var(--chip-off);white-space:nowrap}
.pill:hover{background:var(--chip-hov)}
.pill svg{width:20px;height:20px}
.pill.wide{width:100%;justify-content:center;margin-top:16px}
.lnk{color:var(--blue);font-weight:500;font-size:14px}

/* SUBSCRIBE BUTTON */
.sub-btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 16px;border-radius:18px;font-size:14px;font-weight:500;background:var(--text);color:var(--bg);white-space:nowrap;flex-shrink:0}
.sub-btn:hover{opacity:.85}
.sub-btn.on{background:var(--chip-off);color:var(--text)}
.sub-btn.on:hover{background:var(--chip-hov);opacity:1}
.sub-btn svg{width:20px;height:20px}

/* SEARCH RESULTS */
.res-wrap{max-width:1096px;margin:0 auto;padding:16px 24px 24px}
.res-head{display:flex;justify-content:flex-end;padding-bottom:12px;border-bottom:1px solid var(--border);margin-bottom:16px}
.filter-btn{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-radius:18px;font-weight:500}
.filter-btn:hover{background:var(--hover)}
.filter-btn svg{width:20px;height:20px}
.rrow{display:flex;gap:16px;margin-bottom:16px;position:relative}
.rthumb{position:relative;display:block;flex:0 0 360px;max-width:42%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:var(--bg3)}
.rthumb img{width:100%;height:100%;object-fit:cover}
.rthumb iframe{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none;background:#000}
.rinfo{flex:1;min-width:0}
.rtitle{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:18px;font-weight:400;line-height:26px}
.rstat{font-size:12px;color:var(--text2);line-height:18px;margin-top:2px;display:block}
.rchan{display:flex;align-items:center;gap:8px;margin:12px 0;font-size:12px;color:var(--text2)}
.rchan:hover{color:var(--text)}
.rchan .ava{width:24px;height:24px;font-size:11px}
.rdesc{font-size:12px;line-height:18px;color:var(--text2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.crow{align-items:center;padding:16px 0;justify-content:flex-start}
.crow .cr-ava{flex:0 0 360px;max-width:42%;display:flex;justify-content:center}
.crow .cr-ava .ava{width:136px;height:136px;font-size:56px}
.pcount{position:absolute;bottom:0;right:0;left:0;background:rgba(0,0,0,.8);color:#fff;font-size:12px;font-weight:500;padding:6px 8px;display:flex;align-items:center;gap:6px;justify-content:flex-end}
.pcount svg{width:16px;height:16px}

/* WATCH */
.watch{display:flex;gap:24px;padding:24px;max-width:1754px;margin:0 auto}
.w-primary{flex:1;min-width:0}
.w-secondary{width:402px;flex-shrink:0}
.player{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.w-title{font-size:20px;line-height:28px;font-weight:700;margin-top:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.w-chrow{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;margin-top:12px}
.w-chleft{display:flex;align-items:center;gap:12px;min-width:0}
.w-chava .ava{width:40px;height:40px}
.w-chinfo{display:flex;flex-direction:column;min-width:0}
.w-chname{font-size:16px;font-weight:500;line-height:22px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.w-chsubs{font-size:12px;color:var(--text2);line-height:18px}
.w-actions{display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap}
.pill-group{display:flex;border-radius:18px;background:var(--chip-off);overflow:hidden}
.pill-group button{display:flex;align-items:center;gap:6px;height:36px;padding:0 16px;font-size:14px;font-weight:500}
.pill-group button:hover{background:var(--chip-hov)}
.pill-group button+button{border-left:1px solid var(--border);padding:0 14px}
.pill-group svg,.w-actions .pill svg{width:20px;height:20px}
.pill-group button.on svg{color:var(--blue)}
.w-actions .round{padding:0;width:36px;justify-content:center}
.w-desc{margin-top:12px;background:var(--chip-off);border-radius:12px;padding:12px;cursor:pointer;font-size:14px;line-height:20px;position:relative}
.w-desc:hover{background:var(--chip-hov)}
.desc-head{font-weight:500;margin-bottom:4px}
.desc-head a{color:var(--blue)}
.dh-full{display:none}
.w-desc.open .dh-full{display:inline}
.w-desc.open .dh-short{display:none}
.desc-text{white-space:pre-wrap;word-break:break-word;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.w-desc.open .desc-text{display:block}
.desc-text a{color:var(--blue)}
.desc-more{font-weight:500;margin-top:4px;display:block}
.w-desc.open .desc-more{display:none}
.desc-less{display:none;font-weight:500;margin-top:12px}
.w-desc.open .desc-less{display:block}
.cmts{margin-top:24px}
.cmts-h{display:flex;align-items:center;gap:32px;margin-bottom:24px}
.cmts-h h2{font-size:20px;font-weight:700}
.cmts-sort{display:flex;align-items:center;gap:8px;font-weight:500}
.cmts-sort svg{width:24px;height:24px}
.cmt-add{display:flex;gap:16px;align-items:center;margin-bottom:24px}
.cmt-add input{flex:1;border:none;border-bottom:1px solid var(--border);background:transparent;padding:6px 0;outline:none;cursor:pointer}
.cmt{display:flex;gap:16px;margin-bottom:20px}
.cmt-ava .ava,.cmt-ava img{width:40px;height:40px;border-radius:50%;object-fit:cover}
.cmt.reply .cmt-ava .ava,.cmt.reply .cmt-ava img{width:24px;height:24px}
.cmt-body{flex:1;min-width:0}
.cmt-h{display:flex;gap:8px;align-items:baseline;font-size:13px;line-height:18px}
.cmt-au{font-weight:500}
.cmt-t{color:var(--text2);font-size:12px}
.cmt-tx{font-size:14px;line-height:20px;white-space:pre-wrap;word-break:break-word;margin-top:2px}
.cmt-tx a{color:var(--blue)}
.cmt-ac{display:flex;align-items:center;gap:8px;margin-top:4px;color:var(--text2);font-size:12px}
.cmt-ac svg{width:16px;height:16px}
.cmt-rep{display:flex;align-items:center;gap:8px;margin-top:4px;color:var(--blue);font-weight:500;height:32px;padding:0 12px 0 0}
.cmt-rep svg{width:20px;height:20px}
.cmt-replies{margin-top:8px}
.auto-row{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;margin-bottom:12px;border:1px solid var(--border);border-radius:12px;font-weight:500}
.toggle{position:relative;width:36px;height:14px;background:var(--text3);border-radius:7px;cursor:pointer;flex-shrink:0;transition:background .2s}
.toggle::after{content:'';position:absolute;top:-3px;left:0;width:20px;height:20px;background:#fff;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.4);transition:transform .2s}
.toggle.on{background:#7cb3f5}
.toggle.on::after{transform:translateX(16px);background:var(--blue)}
body.dark .toggle.on{background:#3a6ea5}
.w-chips{display:flex;gap:12px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.rcard{display:flex;gap:8px;margin-bottom:8px;position:relative}
.rthumb2{position:relative;display:block;flex:0 0 168px;height:94px;border-radius:8px;overflow:hidden;background:var(--bg3)}
.rthumb2 img{width:100%;height:100%;object-fit:cover}
.rthumb2 iframe{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none;background:#000}
.rthumb2 .dur{bottom:4px;right:4px}
.rtext{flex:1;min-width:0}
.rtext .rt{font-size:14px;font-weight:500;line-height:20px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rtext .rc{display:block;font-size:12px;line-height:18px;color:var(--text2);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rtext .rc:hover{color:var(--text)}
.rtext .rs{font-size:12px;line-height:18px;color:var(--text2)}
.rcard .vmenu{position:absolute;right:-8px;top:-4px;width:32px;height:32px}
.wpl{border:1px solid var(--border);border-radius:12px;margin-bottom:16px;overflow:hidden;background:var(--bg2)}
.wpl-head{padding:12px 16px;border-bottom:1px solid var(--border)}
.wpl-head b{font-size:18px;font-weight:700;display:block}
.wpl-sub{font-size:12px;color:var(--text2);margin-top:2px}
.wpl-items{max-height:400px;overflow-y:auto;position:relative}
.wpl-item{display:flex;gap:8px;align-items:center;padding:8px 8px 8px 0}
.wpl-item:hover{background:var(--hover)}
.wpl-item.cur{background:var(--active)}
.wpl-item .pidx{width:32px;text-align:center;font-size:12px;color:var(--text2)}
.wpl-item img{width:100px;height:56px;object-fit:cover;border-radius:8px;flex-shrink:0}
.wpl-t{font-size:14px;font-weight:500;line-height:20px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wpl-c{font-size:12px;color:var(--text2)}

/* CHANNEL */
.ch-wrap{max-width:1284px;margin:0 auto;padding:16px 24px 32px}
.ch-banner{width:100%;aspect-ratio:6.2/1;border-radius:12px;background-size:cover;background-position:center;background-color:var(--bg3)}
.ch-banner.none{background:linear-gradient(135deg,#8e8e93,#3a3a3c)}
.ch-head{display:flex;gap:24px;padding:16px 0;align-items:flex-start}
.ch-ava{width:128px;height:128px;border-radius:50%;object-fit:cover;background:var(--bg3);flex-shrink:0}
.ch-meta{min-width:0}
.ch-meta h1{font-size:36px;line-height:50px;font-weight:700}
.ch-sub{font-size:14px;color:var(--text2);line-height:20px;margin-top:4px}
.ch-desc{font-size:14px;color:var(--text2);line-height:20px;margin:8px 0 12px;max-width:640px}
.ch-desc a{color:var(--text);font-weight:500}
.ch-tabs{display:flex;gap:8px;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.ch-tab{padding:0 32px;height:48px;display:flex;align-items:center;font-size:16px;font-weight:500;color:var(--text2);border-bottom:2px solid transparent;white-space:nowrap}
.ch-tab:hover{color:var(--text)}
.ch-tab.active{color:var(--text);border-bottom-color:var(--text)}
.ch-body{padding-top:24px}
.shelf{margin-bottom:32px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.shelf:last-child{border-bottom:none}
.shelf-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.shelf-h h2{font-size:20px;font-weight:700}
.shelf-grid{display:grid;grid-auto-flow:column;grid-auto-columns:240px;gap:16px;overflow-x:auto;padding-bottom:12px;scrollbar-width:thin}
.shelf-grid.shorts{grid-auto-columns:190px}
.chgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:24px 16px}
.chgrid.shorts{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.scard{min-width:0}
.scard .sthumb{position:relative;display:block;aspect-ratio:9/16;border-radius:12px;overflow:hidden;background:var(--bg3)}
.scard .sthumb img{width:100%;height:100%;object-fit:cover}
.scard .st{font-size:14px;font-weight:500;line-height:20px;margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.scard .ss{font-size:12px;color:var(--text2)}
.pcard .pthumb{position:relative;display:block;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:var(--bg3)}
.pcard .pthumb img{width:100%;height:100%;object-fit:cover}
.pcard .vtitle{font-size:14px;line-height:20px;margin-top:8px;margin-bottom:2px}
.pcard .vch{font-size:12px}
.sortchips{display:flex;gap:12px;margin-bottom:16px}
.about{display:flex;gap:48px;flex-wrap:wrap;max-width:1000px}
.about-main{flex:1 1 420px;min-width:0}
.about-stats{flex:0 0 260px}
.about h3{font-size:16px;font-weight:500;margin:0 0 12px}
.about p{white-space:pre-wrap;word-break:break-word;line-height:22px;margin-bottom:24px}
.about p a{color:var(--blue)}
.ab-row{display:flex;gap:16px;align-items:center;padding:8px 0;border-top:1px solid var(--border);line-height:20px}
.ab-row svg{width:24px;height:24px;color:var(--text2)}

/* PLAYLIST */
.pl-page{display:flex;gap:24px;padding:24px;max-width:1400px;margin:0 auto}
.pl-side{flex:0 0 360px;align-self:flex-start;position:sticky;top:80px;border-radius:12px;padding:24px;color:#fff;background:#333;overflow:hidden}
.pl-side>*{position:relative}
.pl-bg{position:absolute!important;inset:-20px;background-size:cover;background-position:center;filter:blur(40px) brightness(.55);z-index:0}
.pl-cover{display:block;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#222;margin-bottom:16px}
.pl-cover img{width:100%;height:100%;object-fit:cover}
.pl-title{font-size:24px;font-weight:700;line-height:32px;word-break:break-word}
.pl-sub{font-size:14px;margin-top:12px;opacity:.85;line-height:20px}
.pl-btns{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.pl-btns .pill{background:rgba(255,255,255,.2);color:#fff;margin:0}
.pl-btns .pill:hover{background:rgba(255,255,255,.3)}
.pl-btns .pill.light{background:#fff;color:#0f0f0f}
.pl-list{flex:1;min-width:0}
.prow{display:flex;gap:12px;align-items:center;padding:8px;border-radius:12px;position:relative}
.prow:hover{background:var(--hover)}
.prow .pidx{width:24px;text-align:center;color:var(--text2);font-size:14px;flex-shrink:0}
.prow .rthumb{flex:0 0 160px;max-width:160px;border-radius:8px}
.prow .rtitle{font-size:16px;line-height:22px;font-weight:500}
.prow .rstat{font-size:12px}
.prow .vmenu,.prow .rm{margin-right:0}

/* HISTORY / LIBRARY */
.hist{display:flex;gap:48px;padding:24px;max-width:1200px;margin:0 auto}
.hist-main{flex:1;min-width:0}
.hist-main h1,.lib-h{font-size:30px;font-weight:700;margin-bottom:24px}
.hist-day{font-size:18px;font-weight:700;margin:24px 0 12px}
.hist-side{flex:0 0 300px;align-self:flex-start;position:sticky;top:80px}
.hist-search{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);padding:4px 0;margin-bottom:24px}
.hist-search input{flex:1;border:none;background:transparent;outline:none;height:32px}
.hist-search svg{width:24px;height:24px}
.side-link{display:flex;align-items:center;gap:16px;padding:10px 0;font-size:14px;width:100%;text-align:left}
.side-link svg{width:24px;height:24px}
.lib-wrap{padding:24px;max-width:1500px;margin:0 auto}
.sub-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.sub-card{display:flex;flex-direction:column;align-items:center;gap:8px;padding:20px 12px;border-radius:12px;text-align:center}
.sub-card:hover{background:var(--hover)}
.sub-card .ava{width:96px;height:96px;font-size:40px}
.sub-name{font-size:16px;font-weight:500}
.sub-meta{font-size:12px;color:var(--text2)}
.empty{text-align:center;padding:80px 24px}
.empty .ei{font-size:80px;margin-bottom:16px}
.empty h3{font-size:20px;font-weight:500;margin-bottom:8px}
.empty p{color:var(--text2);max-width:360px;margin:0 auto}

/* SHORTS */
.shorts{display:flex;justify-content:center;height:calc(100vh - var(--hh));position:relative;overflow:hidden}
.sh-stage{display:flex;align-items:center;justify-content:center;width:100%;height:100%}
.sh-wrap{display:flex;align-items:flex-end;gap:16px;height:calc(100% - 32px)}
.sh-card{position:relative;height:100%;aspect-ratio:9/16;max-width:100vw;border-radius:16px;overflow:hidden;background:#000}
.sh-card iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.sh-tap{position:absolute;inset:0;cursor:pointer}
.sh-ov{position:absolute;left:0;right:0;bottom:0;padding:64px 16px 16px;background:linear-gradient(to top,rgba(0,0,0,.75),transparent);color:#fff;pointer-events:none}
.sh-ov a,.sh-ov button{pointer-events:auto}
.sh-chan{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-weight:500}
.sh-chan .ava{width:32px;height:32px;font-size:14px}
.sh-chan .sub-btn{height:32px;background:#fff;color:#0f0f0f}
.sh-chan .sub-btn.on{background:rgba(255,255,255,.25);color:#fff}
.sh-title{font-size:14px;line-height:20px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sh-mute{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;display:flex;align-items:center;justify-content:center;z-index:3}
.sh-side{display:flex;flex-direction:column;gap:16px;align-items:center;padding-bottom:8px}
.sh-act{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:500}
.sh-act .c{width:48px;height:48px;border-radius:50%;background:var(--chip-off);display:flex;align-items:center;justify-content:center}
.sh-act:hover .c{background:var(--chip-hov)}
.sh-act.on .c{color:var(--blue)}
.sh-act svg{width:24px;height:24px}
.sh-nav{position:absolute;right:24px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:16px}
.sh-nav button{width:56px;height:56px;border-radius:50%;background:var(--chip-off);display:flex;align-items:center;justify-content:center}
.sh-nav button:hover{background:var(--chip-hov)}
.sh-nav button:disabled{opacity:.35;cursor:default}
.sh-nav svg{width:24px;height:24px}

/* DIALOG */
.dlg{display:none;position:fixed;inset:0;z-index:9000;background:rgba(0,0,0,.6);align-items:center;justify-content:center}
.dlg.open{display:flex}
.dlg-box{background:var(--pop);color:var(--text);border-radius:12px;width:92%;max-width:480px;max-height:90vh;overflow:auto;box-shadow:var(--shadow)}
.dlg-box.wide{max-width:760px}
.dlg-h{display:flex;align-items:center;justify-content:space-between;padding:8px 8px 8px 24px;font-size:18px;font-weight:500}
.dlg-b{padding:8px 24px 24px}
.field{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);outline:none;margin:8px 0 12px}
.field:focus{border-color:var(--blue)}
.dlg-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.err{color:#cc0000;font-size:13px;min-height:18px;margin-top:8px}
.chk{display:flex;align-items:center;gap:16px;padding:8px 0;cursor:pointer}
.chk input{width:18px;height:18px}
.new-pl{display:flex;gap:8px;margin-top:12px}
.new-pl input{flex:1;padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);outline:none}
.share-row{display:flex;gap:8px;align-items:center;border:1px solid var(--border);border-radius:12px;padding:6px 6px 6px 12px;margin:8px 0 16px}
.share-row input{flex:1;border:none;background:transparent;outline:none;min-width:0}
.share-lbl{font-size:13px;color:var(--text2)}
.filters{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.filters h4{font-size:12px;font-weight:500;text-transform:uppercase;color:var(--text2);padding-bottom:12px;border-bottom:1px solid var(--border);margin-bottom:8px}
.filters a{display:block;padding:8px 0;font-size:14px;color:var(--text2)}
.filters a:hover{color:var(--text)}
.filters a.on{color:var(--text);font-weight:500}
.voice{text-align:center;padding:16px 0}
.voice .ring{width:80px;height:80px;border-radius:50%;background:rgba(255,0,0,.1);display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
.voice .ring svg{width:40px;height:40px;fill:#f00}
.voice .ring.live{animation:pulse 1s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.voice-res{font-size:18px;font-weight:500;min-height:28px;margin-top:8px}

/* POPUP MENU */
.pop{display:none;position:fixed;z-index:9200;background:var(--pop);border-radius:12px;box-shadow:var(--shadow);padding:8px 0;min-width:200px;max-width:320px}
.pop-item{display:flex;align-items:center;gap:16px;width:100%;padding:0 16px;height:36px;text-align:left;font-size:14px}
.pop-item:hover{background:var(--hover)}
.pop-item svg{width:24px;height:24px}
.pop-sep{height:1px;background:var(--border);margin:8px 0}

/* SETTINGS */
.set-ov{display:none;position:fixed;inset:0;z-index:9500;background:rgba(0,0,0,.4)}
.set-ov.open{display:block}
.set-panel{position:fixed;top:0;right:-400px;width:380px;max-width:100%;height:100%;background:var(--pop);z-index:9501;transition:right .25s;box-shadow:var(--shadow);overflow-y:auto}
.set-panel.open{right:0}
.set-hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 12px 20px;border-bottom:1px solid var(--border);font-size:18px;font-weight:500}
.set-body{padding:8px 20px 24px}
.set-sec{font-size:12px;font-weight:500;color:var(--text2);text-transform:uppercase;letter-spacing:.6px;margin:20px 0 4px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--border)}
.set-lbl h4{font-size:14px;font-weight:500}
.set-lbl p{font-size:12px;color:var(--text2);margin-top:2px}
.set-row select{padding:6px 8px;border-radius:8px;border:1px solid var(--border);background:var(--bg)}
.danger{background:#cc0000;color:#fff;padding:7px 14px;border-radius:18px;font-weight:500}

/* TOAST */
.toasts{position:fixed;bottom:24px;left:24px;z-index:20000;display:flex;flex-direction:column;gap:8px}
.toast{display:flex;align-items:center;gap:12px;padding:14px 20px;background:#323232;color:#fff;border-radius:8px;font-size:14px;animation:ti .25s ease-out;max-width:380px;box-shadow:var(--shadow)}
.toast.out{animation:to .25s ease-in forwards}
@keyframes ti{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes to{to{opacity:0}}

/* ACCOUNT + PROFILE PICTURE CROP */
[hidden]{display:none!important}
.sign-btn.wait{opacity:.6}
.acct{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;margin-bottom:16px}
.acct-name{font-size:18px;font-weight:500;margin-top:8px}
.sync-line{font-size:12px;color:var(--text2);min-height:16px;margin-top:4px}
.acct-btns{display:flex;flex-direction:column;gap:8px}
.acct-btns .pill,.acct-btns .pill-blue{width:100%;justify-content:center;margin:0}
.acct-note{margin-top:16px;font-size:12px}
.crop-drop{border:2px dashed var(--border);border-radius:12px;padding:32px 16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;outline-offset:2px}
.crop-drop.over{border-color:var(--blue);background:var(--hover)}
.crop-drop svg{width:48px;height:48px;color:var(--text3)}
.crop-stage{position:relative;width:100%;max-width:320px;aspect-ratio:1;margin:0 auto;border-radius:12px;overflow:hidden;background:#222;touch-action:none}
.crop-stage canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
.crop-stage canvas.grab{cursor:grabbing}
.crop-zoom{display:flex;align-items:center;gap:12px;max-width:320px;margin:16px auto 0}
.crop-zoom svg{width:20px;height:20px;color:var(--text2)}
.crop-zoom input{flex:1;accent-color:var(--blue)}
.crop-prev{display:flex;align-items:center;gap:12px;justify-content:center;margin:16px 0 4px}
.crop-prev canvas{border-radius:50%;background:var(--bg3)}
.crop-note{font-size:12px;color:var(--text2);text-align:center;margin-bottom:12px}
.crop-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.crop-actions .pill-blue:disabled{opacity:.6;cursor:default}

/* RESPONSIVE */
@media(max-width:1015px){
  .watch{flex-direction:column;padding:0 0 24px;gap:0}
  .w-secondary{width:auto;padding:16px 16px 0}
  .player{border-radius:0}
  .w-primary>*:not(.player){margin-left:16px;margin-right:16px}
  .pl-page{flex-direction:column}.pl-side{position:static;flex:none}
  .hist{flex-direction:column-reverse;gap:16px}.hist-side{position:static;flex:none}
  .rthumb{flex-basis:240px}
}
@media(max-width:680px){
  .hdr-l{flex-shrink:0;gap:4px}.logo{padding:0}.hdr-r{gap:0}.hdr-c{margin:0 4px}.search-wrap{margin-left:0}.voice-btn,#theme-btn,#settings-btn{display:none}
  .sign-btn span{display:none}.sign-btn{padding:0 8px}
  .vgrid{grid-template-columns:1fr;gap:24px}.grid-wrap{padding:0 0 24px}.vinfo{padding:12px 12px 0}.vthumb{border-radius:0}
  .chips{padding:12px}.rrow{flex-direction:column}.rthumb{flex-basis:auto;max-width:none;width:100%}
  .res-wrap{padding:8px 12px}.crow .cr-ava{max-width:none;flex-basis:auto}
  .ch-head{flex-direction:column;align-items:center;text-align:center}.ch-meta h1{font-size:24px;line-height:32px}.ch-wrap{padding:8px 12px}
  .ch-tab{padding:0 16px}.filters{grid-template-columns:1fr 1fr}
  .sh-side{display:none}.sh-nav{right:8px}.sh-nav button{width:40px;height:40px}
  .set-panel{width:100%}.dlg-box.wide{max-width:96%}
  .prow .rthumb{flex-basis:120px;max-width:120px;width:auto}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-l">
    <button class="icon-btn" id="menu-btn" aria-label="Guide"><svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg></button>
    <a class="logo" id="logo-btn" href="#/" aria-label="YouTube Home">
      <svg width="90" height="20" viewBox="0 0 90 20">
        <path d="M27.97 3.58A3.3 3.3 0 0025.6 1.2C23.47.6 14.5.6 14.5.6s-8.97 0-11.1.6A3.3 3.3 0 001.03 3.58 34.6 34.6 0 00.44 10a34.6 34.6 0 00.59 6.42 3.3 3.3 0 002.37 2.38c2.13.6 11.1.6 11.1.6s8.97 0 11.1-.6a3.3 3.3 0 002.37-2.38A34.6 34.6 0 0028.56 10a34.6 34.6 0 00-.59-6.42z" fill="#ff0000"/>
        <path d="M11.73 14.08L18.83 10l-7.1-4.08v8.16z" fill="#fff"/>
        <text x="32" y="15" font-family="Arial" font-size="13" font-weight="bold" fill="currentColor">YouTube</text>
      </svg>
    </a>
  </div>
  <div class="hdr-c">
    <form class="search-form" id="search-form" autocomplete="off">
      <div class="search-wrap">
        <input class="si" id="search-input" type="text" placeholder="Search" aria-label="Search" autocomplete="off">
        <button type="button" class="sc" id="search-clear" aria-label="Clear"><svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>
      </div>
      <button class="sb" type="submit" aria-label="Search"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg></button>
      <div class="sugg" id="sugg"></div>
    </form>
    <button class="voice-btn" id="voice-btn" type="button" aria-label="Search with your voice"><svg viewBox="0 0 24 24"><path d="M12 15c1.66 0 2.99-1.34 2.99-3L15 6c0-1.66-1.34-3-3-3S9 4.34 9 6v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 15 6.7 12H5c0 3.42 2.72 6.23 6 6.72V22h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg></button>
  </div>
  <div class="hdr-r">

const apiCache=new Map();
function apiMsg(er){
  const r=er.errors&&er.errors[0]&&er.errors[0].reason;
  if(r==='quotaExceeded'||r==='dailyLimitExceeded')return 'The daily YouTube API quota has been used up. It resets at midnight Pacific time.';
  if(r==='commentsDisabled')return 'Comments are turned off for this video.';
  return er.message||'The YouTube API returned an error.';
}
async function api(endpoint,params){
  const qs=new URLSearchParams(clean(params||{})).toString();
  const key=endpoint+'?'+qs,hit=apiCache.get(key);
  if(hit&&Date.now()-hit.t<300000)return hit.d;
  let data=null;
  if(!proxyDown){
    try{
      const r=await fetch(PROXY+'?endpoint='+endpoint+'&'+qs);
      const ct=(r.headers&&r.headers.get('content-type'))||'';
      if(r.status===404||!/json/i.test(ct))proxyDown=true;
      else{data=await r.json();if(data&&data.proxyError){proxyDown=true;data=null;}}
    }catch(e){proxyDown=true;}
  }
  if(proxyDown){
    if(!FALLBACK_KEY)throw new Error('The YouTube API is not configured.');
    const r=await fetch('https://www.googleapis.com/youtube/v3/'+endpoint+'?'+qs+'&key='+FALLBACK_KEY);
    data=await r.json();
  }
  if(data&&data.error){const er=new Error(apiMsg(data.error));er.reason=data.error.errors&&data.error.errors[0]&&data.error.errors[0].reason;throw er;}
  apiCache.set(key,{t:Date.now(),d:data});
  return data;
}
function norm(v){
  const sn=v.snippet||{},st=v.statistics||{},cd=v.contentDetails||{};
  const m={kind:'video',id:(v.id&&v.id.videoId)||v.id,title:sn.title||'',channel:sn.channelTitle||'',cid:sn.channelId||'',pub:sn.publishedAt,desc:sn.description||'',dur:isoSec(cd.duration),live:sn.liveBroadcastContent==='live',views:st.viewCount,likes:st.likeCount,ccount:st.commentCount,tags:sn.tags||[]};
  metaMap[m.id]=m;return m;
}
function fromLocal(x){
  if(metaMap[x.id])return metaMap[x.id];
  const m={kind:'video',id:x.id,title:x.title||'',channel:x.channel||'',cid:x.channelId||'',pub:x.pub,desc:'',dur:x.dur||0,views:x.views,live:false,tags:[]};
  metaMap[m.id]=m;return m;
}
const toLocal=m=>({id:m.id,title:m.title,channel:m.channel,channelId:m.cid,dur:m.dur,pub:m.pub,views:m.views});
async function getVideos(ids){
  ids=[...new Set(ids)].filter(Boolean);
  const need=ids.filter(i=>!vCache[i]);
  for(let i=0;i<need.length;i+=50){
    const d=await api('videos',{part:'snippet,contentDetails,statistics',id:need.slice(i,i+50).join(',')});
    (d.items||[]).forEach(v=>{vCache[v.id]=v;});
  }
  return ids.map(i=>vCache[i]).filter(Boolean);
}
async function getChannels(ids){
  ids=[...new Set(ids)].filter(Boolean);
  const need=ids.filter(i=>!cCache[i]);
  for(let i=0;i<need.length;i+=50){
    const chunk=need.slice(i,i+50);
    const d=await api('channels',{part:'snippet,statistics',id:chunk.join(',')});
    (d.items||[]).forEach(c=>{cCache[c.id]=c;});
    chunk.forEach(id=>{if(!cCache[id])cCache[id]={id,snippet:{title:'',thumbnails:{}},statistics:{}};});
  }
  return ids.map(i=>cCache[i]);
}
const normPlaylist=p=>{const sn=p.snippet||{},th=sn.thumbnails||{};return{kind:'playlist',id:(p.id&&p.id.playlistId)||p.id,title:sn.title||'',channel:sn.channelTitle||'',cid:sn.channelId||'',count:p.contentDetails&&p.contentDetails.itemCount,thumb:(th.medium||th.high||th.default||{}).url||''};};
async function getPlaylists(ids){
  const d=await api('playlists',{part:'snippet,contentDetails',id:ids.join(',')});
  return (d.items||[]).map(normPlaylist);
}
const normChannel=c=>{const sn=c.snippet||{},st=c.statistics||{};return{kind:'channel',id:c.id,title:sn.title||'',handle:sn.customUrl||'',subs:st.hiddenSubscriberCount?null:st.subscriberCount,desc:sn.description||''};};

function cAvatar(cid,big){
  const c=cCache[cid],th=c&&c.snippet&&c.snippet.thumbnails;
  if(th){const t=big?(th.medium||th.high||th.default):(th.default||th.medium);if(t&&t.url)return t.url;}
  const s=subs.find(x=>x.id===cid);return s&&s.avatar||'';
}
function avaHTML(cid,name,size){
  const u=cid&&cAvatar(cid,size>60);
  const st=size?'width:'+size+'px;height:'+size+'px;font-size:'+Math.round(size*.45)+'px;':'';
  return '<span class="ava" data-cid="'+esc(cid||'')+'" style="'+st+'background:'+clr(name)+'">'+(u?'<img src="'+esc(u)+'" alt="" loading="lazy">':esc((name||'?').charAt(0).toUpperCase()))+'</span>';
}
async function fillAvatars(root){
  root=root||document;
  const els=[...root.querySelectorAll('.ava[data-cid]:not([data-f])')].filter(e=>e.dataset.cid);
  if(!els.length)return;
  const ids=[...new Set(els.map(e=>e.dataset.cid))].filter(i=>!cCache[i]);
  if(ids.length){try{await getChannels(ids);}catch(e){}}
  els.forEach(el=>{
    el.dataset.f='1';
    const big=parseInt(el.style.width)>60,u=cAvatar(el.dataset.cid,big);
    if(u&&!el.querySelector('img')){el.textContent='';const im=new Image();im.alt='';im.src=u;el.appendChild(im);}
  });
}

function linkify(text){
  if(!text)return '';
  return esc(text).replace(/(https?:\/\/[^\s<]+)|((?:\d{1,2}:)?\d{1,2}:\d{2})(?![\d:])|(#[\p{L}\p{N}_]+)/gu,(m,url,ts,tag,off,str)=>{
    if(url)return '<a href="'+url+'" target="_blank" rel="noopener noreferrer">'+url+'</a>';
    if(ts){
      if(/[\w:\/.]/.test(str.charAt(off-1)||' '))return m;
      const p=ts.split(':').map(Number),sec=p.length===3?p[0]*3600+p[1]*60+p[2]:p[0]*60+p[1];
      return '<a href="#" data-act="seek" data-t="'+sec+'">'+ts+'</a>';
    }
    return '<a href="#/results?search_query='+encodeURIComponent(tag)+'">'+tag+'</a>';
  });
}

/* ================= INFINITE FEED ================= */
function makeFeed(o){
  const tok=navToken,grid=o.grid,sentinel=o.sentinel;
  let next=null,loading=false,done=false,n=0,first=true;
  const io=('IntersectionObserver' in window)?new IntersectionObserver(es=>{if(es.some(x=>x.isIntersecting))more();},{rootMargin:'900px 0px'}):null;
  if(io)ios.push(io);
  async function more(){
    if(loading||done||tok!==navToken)return;
    loading=true;if(!first)sentinel.innerHTML=SPIN;
    try{
      const res=await o.loader(next);
      if(tok!==navToken)return;
      const items=res.items||[];
      if(first){grid.innerHTML='';first=false;}
      grid.insertAdjacentHTML('beforeend',items.map(o.render).join(''));
      n+=items.length;next=res.next||null;if(!next)done=true;
      sentinel.innerHTML=n?'':(o.empty||statusHTML('🔍','Nothing here yet',''));
      fillAvatars(grid);
    }catch(e){
      if(tok!==navToken)return;
      if(first){grid.innerHTML='';first=false;}
      sentinel.innerHTML=errorHTML(e,true);done=true;
    }finally{
      loading=false;
      if(io&&!done&&tok===navToken){io.unobserve(sentinel);io.observe(sentinel);}
    }
  }
  sentinel.onclick=e=>{if(e.target.closest('[data-act="retry"]')){done=false;sentinel.innerHTML='';more();}};
  if(io)io.observe(sentinel);
  more();
}

function interleave(a,b){const out=[],seen=new Set();for(let i=0;i<Math.max(a.length,b.length);i++){for(const x of [a[i],b[i]]){if(x&&!seen.has(x.id)){seen.add(x.id);out.push(x);}}}return out;}
async function personalVideos(){
  const pool=new Set(),cnt={};
  watchHist.slice(0,40).forEach(h=>{if(h.channelId)cnt[h.channelId]=(cnt[h.channelId]||0)+1;});
  Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,3).forEach(e=>pool.add(e[0]));
  subs.slice().sort(()=>Math.random()-.5).slice(0,3).forEach(s=>pool.add(s.id));
  const ids=[...pool].filter(i=>i.indexOf('UC')===0);
  if(!ids.length)return [];
  const res=await Promise.all(ids.map(id=>api('playlistItems',{part:'contentDetails',playlistId:'UU'+id.slice(2),maxResults:5}).catch(()=>null)));
  const vids=[];res.forEach(d=>d&&(d.items||[]).forEach(i=>vids.push(i.contentDetails.videoId)));
  const seen=new Set(watchHist.map(h=>h.id));
  const vs=(await getVideos(vids)).map(norm).filter(m=>!seen.has(m.id)&&!hidden.includes(m.id));
  return vs.sort(()=>Math.random()-.5).slice(0,10);
}
function homeLoader(chip){
  return async token=>{
    const viaSearch=async()=>{
      const d=await api('search',clean({part:'snippet',type:'video',q:chip.q||(chip.live?'live':chip.l),eventType:chip.live?'live':'',maxResults:24,pageToken:token}));
      const vs=await getVideos((d.items||[]).map(i=>i.id.videoId));
      return{items:vs.map(norm).filter(m=>!hidden.includes(m.id)),next:d.nextPageToken};
    };
    if(chip.q||chip.live)return viaSearch();
    let d;
    try{d=await api('videos',clean({part:'snippet,contentDetails,statistics',chart:'mostPopular',maxResults:24,regionCode:cfg.region,videoCategoryId:chip.cat,pageToken:token}));}
    catch(e){if(!chip.cat)throw e;return viaSearch();}
    (d.items||[]).forEach(v=>{vCache[v.id]=v;});
    let items=(d.items||[]).map(norm).filter(m=>!hidden.includes(m.id));
    if(!token&&!chip.cat&&cfg.personalise){const mine=await personalVideos().catch(()=>[]);items=interleave(mine,items);}
    return{items,next:d.nextPageToken};
  };
}

const dateAfter=k=>new Date(Date.now()-({hour:3600e3,today:86400e3,week:7*86400e3,month:30*86400e3,year:365*86400e3}[k]||0)).toISOString();
async function searchLoader(f,token){
  const p={part:'snippet',q:f.q,maxResults:20,pageToken:token,type:f.type||'video,channel,playlist'};
  if(f.date||f.dur)p.type='video';
  if(f.date)p.publishedAfter=dateAfter(f.date);
  if(f.dur)p.videoDuration=f.dur;
  if(f.order)p.order=f.order;
  const d=await api('search',clean(p)),its=d.items||[];
  const vids=its.filter(i=>i.id.videoId).map(i=>i.id.videoId),chs=its.filter(i=>i.id.channelId).map(i=>i.id.channelId),pls=its.filter(i=>i.id.playlistId).map(i=>i.id.playlistId);
  const [vs,cs,ps]=await Promise.all([vids.length?getVideos(vids):[],chs.length?getChannels(chs):[],pls.length?getPlaylists(pls):[]]);
  const vm={},cm={},pm={};vs.forEach(v=>{vm[v.id]=norm(v);});cs.forEach(c=>{cm[c.id]=c;});ps.forEach(x=>{pm[x.id]=x;});
  const items=[];
  its.forEach(i=>{
    if(i.id.videoId&&vm[i.id.videoId])items.push(vm[i.id.videoId]);
    else if(i.id.channelId&&cm[i.id.channelId])items.push(normChannel(cm[i.id.channelId]));
    else if(i.id.playlistId&&pm[i.id.playlistId])items.push(pm[i.id.playlistId]);
  });
  return{items,next:d.nextPageToken};
}
function pushSearch(q){searches=[q].concat(searches.filter(x=>x!==q)).slice(0,12);LS.set('yt_searches',searches);}
function filterHref(f,key,val){
  const g=Object.assign({},f);g[key]=g[key]===val?'':val;
  return '#/results?search_query='+encodeURIComponent(g.q)+['type','date','dur','order'].map(k=>g[k]?'&'+k+'='+g[k]:'').join('');
}
function filterDialog(f){
  const col=(title,key,opts)=>'<div><h4>'+title+'</h4>'+opts.map(o=>'<a class="'+(f[key]===o[0]?'on':'')+'" href="'+filterHref(f,key,o[0])+'">'+o[1]+'</a>').join('')+'</div>';
  dialog('Search filters','<div class="filters">'+
    col('Upload date','date',[['hour','Last hour'],['today','Today'],['week','This week'],['month','This month'],['year','This year']])+
    col('Type','type',[['video','Video'],['channel','Channel'],['playlist','Playlist']])+
    col('Duration','dur',[['short','Under 4 minutes'],['medium','4 – 20 minutes'],['long','Over 20 minutes']])+
    col('Sort by','order',[['date','Upload date'],['viewCount','View count'],['rating','Rating']])+'</div>',null,null,'wide');
}
function viewResults(r,tok){

let playerWin=null,endedFired=false,nextHref=null,playlistActive=false,rel={all:[],ch:[],search:[]};
function postCmd(func,args){if(!playerWin)return;try{playerWin.postMessage(JSON.stringify({event:'command',func:func,args:args||[]}),'*');}catch(e){}}
function stopPlayer(){playerWin=null;nextHref=null;playlistActive=false;}
function mountPlayer(host,id,t){
  endedFired=false;nextHref=null;
  const f=document.createElement('iframe');
  const origin=/^https?:/.test(location.origin)?'&origin='+encodeURIComponent(location.origin):'';
  f.src='https://www.youtube-nocookie.com/embed/'+id+'?autoplay=1&rel=0&modestbranding=1&playsinline=1&enablejsapi=1'+(t?'&start='+t:'')+origin;
  f.allow='accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture;fullscreen';f.allowFullscreen=true;f.title='YouTube video player';
  f.addEventListener('load',()=>{try{
    f.contentWindow.postMessage(JSON.stringify({event:'listening',id:1,channel:'widget'}),'*');
    f.contentWindow.postMessage(JSON.stringify({event:'command',func:'addEventListener',args:['onStateChange'],id:1,channel:'widget'}),'*');
  }catch(e){}});
  host.appendChild(f);playerWin=f.contentWindow;
}
window.addEventListener('message',e=>{
  if(!playerWin||e.source!==playerWin)return;
  let d=e.data;if(typeof d==='string'){try{d=JSON.parse(d);}catch(_){return;}}
  if(!d)return;
  const st=d.event==='onStateChange'?d.info:(d.event==='infoDelivery'&&d.info&&typeof d.info.playerState==='number'?d.info.playerState:null);
  if(st===0&&!endedFired){endedFired=true;if(cfg.autonext&&nextHref){toast('Playing next video','⏭️',1500);location.hash=nextHref;}}
});

function updateRateUI(id){
  const l=$('w-like'),d=$('w-dis');if(!l||!d)return;

  l.querySelector('span').textContent=base===''?'Like':compact(Number(base)+(liked?1:0));

function rate(id,kind){
  const m=metaMap[id];
  if(rates[id]===kind){delete rates[id];if(kind==='like')removeFromList('LL',id);}
  else{rates[id]=kind;if(kind==='like'){if(m)addToList('LL',m);}else removeFromList('LL',id);}
  LS.set('yt_rate',rates);updateRateUI(id);
}

/* related + playlist panel */
async function loadRelated(m,tok){
  const q=(m.title.split(/[|\-–—:(\[]/)[0].trim()||m.title).slice(0,80);
  const [s,c]=await Promise.all([
    api('search',{part:'snippet',type:'video',q:q,maxResults:20}).then(d=>getVideos((d.items||[]).map(i=>i.id.videoId))).catch(()=>[]),
    m.cid.indexOf('UC')===0?api('playlistItems',{part:'contentDetails',playlistId:'UU'+m.cid.slice(2),maxResults:12}).then(d=>getVideos((d.items||[]).map(i=>i.contentDetails.videoId))).catch(()=>[]):Promise.resolve([])
  ]);
  if(tok!==navToken)return;
  const f=a=>a.map(norm).filter(x=>x.id!==m.id&&!hidden.includes(x.id));
  rel.search=f(s);rel.ch=f(c);rel.all=interleave(rel.search,rel.ch);
  if(!playlistActive&&rel.all[0])nextHref='#/watch?v='+rel.all[0].id;
  const wrap=$('w-relwrap');if(!wrap)return;
  wrap.innerHTML='<div class="w-chips"><button class="chip active" data-act="rel-tab" data-tab="all">All</button><button class="chip" data-act="rel-tab" data-tab="ch">From '+esc(m.channel.length>20?m.channel.slice(0,20)+'…':m.channel)+'</button><button class="chip" data-act="rel-tab" data-tab="search">Related</button></div><div id="w-rel"></div>';
  drawRel('all');
}
function drawRel(tab){
  const box=$('w-rel');if(!box)return;
  document.querySelectorAll('[data-act="rel-tab"]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  box.innerHTML=(rel[tab]||[]).map(relHTML).join('')||'<p class="muted">No videos to show.</p>';
}
async function loadWatchPlaylist(list,id,tok){
  const box=$('w-plist');if(!box)return;
  let name,items;
  if(lists[list]){name=lists[list].name;items=lists[list].items.map(x=>({id:x.id,title:x.title,channel:x.channel}));}
  else{
    const [pd,idata]=await Promise.all([api('playlists',{part:'snippet',id:list}),api('playlistItems',{part:'snippet',playlistId:list,maxResults:50})]);
    name=(pd.items&&pd.items[0]&&pd.items[0].snippet.title)||'Playlist';
    items=(idata.items||[]).map(i=>({id:i.snippet.resourceId.videoId,title:i.snippet.title,channel:i.snippet.videoOwnerChannelTitle||i.snippet.channelTitle})).filter(i=>i.title!=='Private video'&&i.title!=='Deleted video');
  }
  if(tok!==navToken)return;
  const idx=items.findIndex(x=>x.id===id);
  playlistActive=true;
  const nx=items[idx+1]||(idx<0?items[0]:null);
  nextHref=nx?'#/watch?v='+nx.id+'&list='+encodeURIComponent(list):null;
  box.innerHTML='<div class="wpl"><div class="wpl-head"><b>'+esc(name)+'</b><div class="wpl-sub">'+(idx>=0?idx+1:'–')+' / '+items.length+'</div></div><div class="wpl-items">'+
    items.map((x,i)=>'<a class="wpl-item'+(x.id===id?' cur':'')+'" href="'+vhref(x.id,list)+'"><span class="pidx">'+(x.id===id?'▶':i+1)+'</span><img src="'+thumbUrl(x.id,'mq')+'" alt="" loading="lazy"><div><div class="wpl-t">'+esc(x.title)+'</div><div class="wpl-c">'+esc(x.channel)+'</div></div></a>').join('')+'</div></div>';
  const cur=box.querySelector('.cur'),sc=box.querySelector('.wpl-items');
  if(cur&&sc)sc.scrollTop=Math.max(0,cur.offsetTop-80);
}

function cmtHTML(t,reply){
  const top=reply?t:t.snippet.topLevelComment,s=top.snippet,id=top.id,rc=reply?0:(t.snippet.totalReplyCount||0);
  const cid=s.authorChannelId&&s.authorChannelId.value,href=cid?'#/channel/'+cid:'#';

async function loadComments(more){
  const list=$('cmt-list'),box=$('cmt-more'),tok=navToken;
  if(!list||cm.loading)return;
  cm.loading=true;if(more)box.innerHTML=SPIN;
  try{
    const d=await api('commentThreads',clean({part:'snippet',videoId:cm.vid,maxResults:20,order:cm.order,textFormat:'plainText',pageToken:more?cm.token:''}));
    if(tok!==navToken)return;
    if(!more)list.innerHTML='';
    list.insertAdjacentHTML('beforeend',(d.items||[]).map(t=>cmtHTML(t)).join(''));
    cm.token=d.nextPageToken||null;
    box.innerHTML=cm.token?'<button class="pill wide" data-act="cmt-more">Show more comments</button>':'';
    if(!list.children.length)list.innerHTML='<p class="muted">No comments yet.</p>';
  }catch(e){
    if(tok===navToken){box.innerHTML='';if(!more)list.innerHTML='<p class="muted">'+esc(e.message)+'</p>';}
  }finally{cm.loading=false;}
}

function parseT(s){
  if(!s)return 0;if(/^\d+$/.test(s))return +s;
  const m=/^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?$/.exec(s);return m?(+m[1]||0)*3600+(+m[2]||0)*60+(+m[3]||0):0;
}
function parseLink(raw){
  raw=(raw||'').trim();if(!raw)return null;
  let u;try{u=new URL(/^https?:\/\//i.test(raw)?raw:'https://'+raw);}catch(e){return null;}
  const h=u.hostname.replace(/^(www\.|m\.|music\.)/,'');
  if(['youtube.com','youtube-nocookie.com','youtu.be'].indexOf(h)<0)return null;
  const p=u.pathname.split('/').filter(Boolean),list=u.searchParams.get('list'),t=parseT(u.searchParams.get('t')||u.searchParams.get('start'));
  const idRe=/^[A-Za-z0-9_-]{11}$/,v=u.searchParams.get('v');
  if(h==='youtu.be')return idRe.test(p[0]||'')?{type:'video',id:p[0],list,t}:null;
  if(p[0]==='watch'&&idRe.test(v||''))return{type:'video',id:v,list,t};
  if(['embed','shorts','live','v'].indexOf(p[0])>=0&&idRe.test(p[1]||''))return{type:p[0]==='shorts'?'short':'video',id:p[1],list,t};
  if(p[0]==='playlist'&&list)return{type:'playlist',list};
  if(p[0]==='channel'&&p[1])return{type:'channel',id:p[1]};
  if(p[0]&&p[0].charAt(0)==='@')return{type:'channel',id:p[0]};
  if((p[0]==='c'||p[0]==='user')&&p[1])return{type:'search',q:p[1]};
  return null;
}
function goLink(l){
  if(l.type==='video')go('#/watch?v='+l.id+(l.list?'&list='+encodeURIComponent(l.list):'')+(l.t?'&t='+l.t:''));
  else if(l.type==='short')go('#/shorts/'+l.id);
  else if(l.type==='playlist')go('#/playlist?list='+encodeURIComponent(l.list));
  else if(l.type==='channel')go('#/channel/'+encodeURIComponent(l.id));
  else go('#/results?search_query='+encodeURIComponent(l.q)+'&type=channel');
}

let suggSeq=0,suggTimer=null,suggSel=-1;
function fetchSuggest(q){
  return new Promise(res=>{
    const cb='__ytsug'+(++suggSeq),s=document.createElement('script');
    const done=v=>{delete window[cb];s.remove();clearTimeout(to);res(v);};
    const to=setTimeout(()=>done([]),2500);
    window[cb]=d=>done(((d&&d[1])||[]).map(x=>Array.isArray(x)?x[0]:x).slice(0,10));
    s.onerror=()=>done([]);
    s.src='https://suggestqueries.google.com/complete/search?client=youtube&ds=yt&q='+encodeURIComponent(q)+'&jsonp='+cb;
    document.head.appendChild(s);
  });
}
function showSugg(list,recent){
  if(!list.length){hideSugg();return;}
  sugg.innerHTML=list.map(s=>'<div class="sg" data-q="'+esc(s)+'">'+ic(recent?'history':'search')+'<span>'+esc(s)+'</span>'+(recent?'<button type="button" class="rm" data-rm="'+esc(s)+'" aria-label="Remove">'+ic('close')+'</button>':'')+'</div>').join('');
  sugg.classList.add('open');suggSel=-1;
}
function hideSugg(){sugg.classList.remove('open');suggSel=-1;}
function updateSugg(){
  const q=searchInp.value.trim();
  searchClr.classList.toggle('vis',searchInp.value.length>0);
  clearTimeout(suggTimer);
  if(!q){showSugg(searches,true);return;}
  suggTimer=setTimeout(async()=>{const l=await fetchSuggest(q);if(searchInp.value.trim()===q&&document.activeElement===searchInp)showSugg(l,false);},150);
}
function doSearch(q){
  q=(q||'').trim();if(!q)return;
  const l=parseLink(q);hideSugg();searchInp.blur();
  if(l&&/youtu/i.test(q)){searchInp.value='';searchClr.classList.remove('vis');goLink(l);return;}
  searchInp.value=q;go('#/results?search_query='+encodeURIComponent(q));
}
$('search-form').addEventListener('submit',e=>{e.preventDefault();const s=sugg.querySelector('.sg.sel');doSearch(s?s.dataset.q:searchInp.value);});
searchInp.addEventListener('input',updateSugg);
searchInp.addEventListener('focus',updateSugg);
searchInp.addEventListener('keydown',e=>{
  const items=[...sugg.querySelectorAll('.sg')];
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    if(!items.length)return;e.preventDefault();
    suggSel=(suggSel+(e.key==='ArrowDown'?1:-1)+items.length+1)%(items.length+1);
    if(suggSel===items.length)suggSel=-1;
    items.forEach((x,i)=>x.classList.toggle('sel',i===suggSel));
    if(suggSel>=0)searchInp.value=items[suggSel].dataset.q;
  }else if(e.key==='Escape')hideSugg();
});
sugg.addEventListener('mousedown',e=>e.preventDefault());
sugg.addEventListener('click',e=>{
  const rm=e.target.closest('[data-rm]');
  if(rm){searches=searches.filter(x=>x!==rm.dataset.rm);LS.set('yt_searches',searches);showSugg(searches,true);return;}
  const s=e.target.closest('.sg');if(s)doSearch(s.dataset.q);
});
searchInp.addEventListener('blur',()=>setTimeout(hideSugg,120));
searchClr.addEventListener('click',()=>{searchInp.value='';searchClr.classList.remove('vis');searchInp.focus();});

  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;

/* ================= ACCOUNT (Clerk) + SAVE TO ACCOUNT ================= */
// Sign-in is handled by Clerk. Everything the app remembers (subscriptions, playlists, likes, history,
// settings) is saved into the signed-in user's Clerk metadata as one compact string, so it follows
// the account to any device. Clerk limits metadata to 8 KB, so only IDs are stored (titles and channel
// names are fetched again from YouTube when needed) and the oldest history is dropped first if space runs out.
const AUTH={state:'loading',clerk:null,cu:null,first:true,listening:false};   // state: loading | ready | off
const cloud={ready:false,applying:false,t:null,lastStr:'',busy:false,again:false,fails:0,status:'idle',trimmed:false};
const SYNC_KEYS=new Set(['yt_cfg','yt_hist','yt_subs','yt_lists','yt_rate','yt_searches','yt_hidden','yt_dark']);
const USER_KEYS=['yt_hist','yt_subs','yt_lists','yt_rate','yt_searches','yt_hidden','yt_uid'];
const ID_RE=/^[A-Za-z0-9_-]{6,40}$/;
const SNAP_BUDGET=7600;
const LEVELS=[
  {hist:150,q:8,x:40,wl:150,ll:150,pl:100,subs:80},
  {hist:100,q:5,x:20,wl:120,ll:120,pl:80,subs:80},
  {hist:60,q:0,x:0,wl:100,ll:100,pl:60,subs:60},
  {hist:30,q:0,x:0,wl:70,ll:70,pl:40,subs:50},
  {hist:0,q:0,x:0,wl:50,ll:50,pl:30,subs:40},
  {hist:0,q:0,x:0,wl:25,ll:25,pl:15,subs:30}
];
const CFG_KEYS=['home','personalise','autoplay','autonext','saveHist','compact'];
const b36=n=>Math.floor(n).toString(36);
const idsOf=a=>a.map(x=>x.id).filter(i=>ID_RE.test(i));
const lsRaw=k=>{try{return localStorage.getItem(k);}catch(e){return null;}};
lsHook=k=>{if(SYNC_KEYS.has(k))scheduleSync();};

function buildSnapshot(L){
  return JSON.stringify({
    v:1,
    c:CFG_KEYS.map(k=>cfg[k]?1:0).join('')+(cfg.region||'US'),
    d:document.body.classList.contains('dark')?1:0,
    s:subs.slice(0,L.subs).map(x=>x.id).filter(i=>ID_RE.test(i)).join(','),
    h:watchHist.slice(0,L.hist).filter(x=>ID_RE.test(x.id)).map(x=>x.id+'.'+b36((x.ts||0)/1000)).join(','),
    w:idsOf(lists.WL.items.slice(0,L.wl)).join(','),
    l:idsOf(lists.LL.items.slice(0,L.ll)).join(','),
    r:Object.keys(rates).filter(k=>rates[k]==='dislike'&&ID_RE.test(k)).slice(0,30).join(','),
    p:Object.keys(lists).filter(k=>k.indexOf('pl_')===0).slice(0,20).map(k=>[k,lists[k].name,idsOf(lists[k].items.slice(0,L.pl)).join(',')]),
    q:searches.slice(0,L.q).join('|'),
    x:(L.x?hidden.slice(-L.x):[]).filter(i=>ID_RE.test(i)).join(',')
  });
}
function pickSnapshot(extra){
  const enc=new TextEncoder();
  let str='',level=0;
  for(let i=0;i<LEVELS.length;i++){
    level=i;str=buildSnapshot(LEVELS[i]);
    if(enc.encode(JSON.stringify(Object.assign({},extra,{yt:str}))).length<=SNAP_BUDGET)break;
  }
  return{str,level};
}
function parseSnapshot(raw){
  let o;try{o=typeof raw==='string'?JSON.parse(raw):raw;}catch(e){return null;}
  if(!o||o.v!==1)return null;
  const ids=s=>String(s||'').split(',').filter(i=>ID_RE.test(i));
  const out={cfg:null,dark:null,subs:ids(o.s),hist:[],wl:ids(o.w),ll:ids(o.l),dis:ids(o.r),pls:[],q:[],x:ids(o.x)};
  if(typeof o.c==='string'&&o.c.length>=CFG_KEYS.length){
    const c={};CFG_KEYS.forEach((k,i)=>{c[k]=o.c.charAt(i)==='1';});
    const reg=o.c.slice(CFG_KEYS.length);if(/^[A-Z]{2}$/.test(reg))c.region=reg;
    out.cfg=c;
  }
  if(o.d===0||o.d===1)out.dark=!!o.d;
  String(o.h||'').split(',').forEach(p=>{const a=p.split('.');if(ID_RE.test(a[0]||''))out.hist.push({id:a[0],ts:(parseInt(a[1],36)||0)*1000});});
  (Array.isArray(o.p)?o.p:[]).forEach(p=>{if(Array.isArray(p)&&/^pl_[a-z0-9]+$/.test(p[0]))out.pls.push({key:p[0],name:String(p[1]||'Playlist').slice(0,60),ids:ids(p[2])});});
  out.q=String(o.q||'').split('|').filter(Boolean).slice(0,12);
  return out;
}

/* bring a saved snapshot into the app. 'replace' = the account wins; 'merge' = also keep what this device had (first sign-in) */
const stubVideo=id=>({id,title:'',channel:'',channelId:'',dur:0,pub:null,views:null});
const uniqById=a=>{const s=new Set();return a.filter(x=>!s.has(x.id)&&s.add(x.id));};
function applySnapshot(sn,mode){
  const merge=mode==='merge';
  cloud.applying=true;
  try{
    if(sn.cfg)cfg=Object.assign({},cfg,sn.cfg);
    if(sn.dark!==null)applyDark(sn.dark);
    const pool={};
    Object.keys(lists).forEach(k=>lists[k].items.forEach(x=>{pool[x.id]=x;}));
    watchHist.forEach(x=>{if(!pool[x.id]||!pool[x.id].title)pool[x.id]=x;});
    const mk=id=>pool[id]||stubVideo(id);
    const have=new Map(subs.map(s=>[s.id,s]));
    const cs=sn.subs.map(id=>have.get(id)||{id,name:'',avatar:''});
    subs=merge?cs.concat(subs.filter(s=>sn.subs.indexOf(s.id)<0)):cs;
    const join=(cloudIds,localItems)=>merge?uniqById(cloudIds.map(mk).concat(localItems)):cloudIds.map(mk);
    const nl={WL:{name:'Watch later',items:join(sn.wl,lists.WL.items)},LL:{name:'Liked videos',items:join(sn.ll,lists.LL.items)}};
    sn.pls.forEach(p=>{const loc=lists[p.key];nl[p.key]={name:p.name,items:join(p.ids,loc?loc.items:[])};});
    if(merge)Object.keys(lists).forEach(k=>{if(k.indexOf('pl_')===0&&!nl[k])nl[k]=lists[k];});
    lists=nl;
    const nr={};
    lists.LL.items.forEach(x=>{nr[x.id]='like';});
    sn.dis.forEach(id=>{nr[id]='dislike';});
    if(merge)Object.keys(rates).forEach(k=>{if(!nr[k])nr[k]=rates[k];});
    rates=nr;
    const cloudH=sn.hist.map(h=>Object.assign({},mk(h.id),{thumbnail:thumbUrl(h.id),ts:h.ts||Date.now()}));
    let H=cloudH;
    if(merge){
      const m=new Map();
      cloudH.concat(watchHist).forEach(x=>{const o=m.get(x.id);if(!o)m.set(x.id,x);else m.set(x.id,Object.assign({},o.title?o:x,{ts:Math.max(o.ts||0,x.ts||0)}));});
      H=[...m.values()].sort((a,b)=>(b.ts||0)-(a.ts||0));
    }
    watchHist=H.slice(0,300);
    searches=merge?[...new Set(sn.q.concat(searches))].slice(0,12):sn.q;
    hidden=merge?[...new Set(sn.x.concat(hidden))].slice(-500):sn.x;
    saveCfg();saveLists();saveSubs();LS.set('yt_hist',watchHist);LS.set('yt_rate',rates);LS.set('yt_searches',searches);LS.set('yt_hidden',hidden);
  }finally{cloud.applying=false;}
}
/* ids restored from the account have no titles yet: fetch them (1 API unit per 50 videos / channels) */
async function hydrateStubs(){
  const need=new Set();
  watchHist.forEach(x=>{if(!x.title)need.add(x.id);});
  Object.keys(lists).forEach(k=>lists[k].items.forEach(x=>{if(!x.title)need.add(x.id);}));
  let changed=false;
  if(need.size){
    const got={};
    try{(await getVideos([...need])).forEach(v=>{got[v.id]=norm(v);});}catch(e){return false;}
    const fill=x=>{
      if(x.title)return;const m=got[x.id];
      if(m){x.title=m.title;x.channel=m.channel;x.channelId=m.cid;x.dur=m.dur;x.pub=m.pub;x.views=m.views;}else x.title='Unavailable video';
      changed=true;
    };
    watchHist.forEach(fill);Object.keys(lists).forEach(k=>lists[k].items.forEach(fill));
  }
  const sneed=subs.filter(s=>!s.name).map(s=>s.id);
  if(sneed.length){
    try{await getChannels(sneed);}catch(e){}
    subs.forEach(s=>{if(s.name)return;const c=cCache[s.id],t=c&&c.snippet&&c.snippet.title;s.name=t||'Channel';s.avatar=cAvatar(s.id)||'';changed=true;});
  }
  if(changed){cloud.applying=true;try{LS.set('yt_hist',watchHist);saveLists();saveSubs();}finally{cloud.applying=false;}}
  return changed;
}
function wipeUserData(){
  cloud.applying=true;
  try{
    watchHist=[];subs=[];lists={WL:{name:'Watch later',items:[]},LL:{name:'Liked videos',items:[]}};rates={};searches=[];hidden=[];
    USER_KEYS.forEach(k=>{try{localStorage.removeItem(k);}catch(e){}});
  }finally{cloud.applying=false;}
}

/* saving */
const syncText=()=>({idle:'Saved to your account',saving:'Saving to your account…',error:"Couldn't save to your account. Retrying…"}[cloud.status]||'');
function setSync(st){cloud.status=st;const el=$('sync-line');if(el)el.textContent=syncText();}
function scheduleSync(now){
  if(cloud.applying||!cloud.ready)return;
  clearTimeout(cloud.t);cloud.t=setTimeout(pushNow,now?0:2000);
}
async function writeMeta(cu,str){
  if(typeof cu.updateMetadata==='function'){
    try{await cu.updateMetadata({unsafeMetadata:{yt:str}});return;}catch(e){console.warn('updateMetadata failed, falling back to update()',e);}
  }
  await cu.update({unsafeMetadata:Object.assign({},cu.unsafeMetadata||{},{yt:str})});
}
async function pushNow(){
  const cu=AUTH.cu;
  if(!cu||!cloud.ready)return;
  if(cloud.busy){cloud.again=true;return;}
  cloud.busy=true;cloud.t=null;
  try{
    const extra=Object.assign({},cu.unsafeMetadata||{});delete extra.yt;
    const pick=pickSnapshot(extra);
    if(pick.str===cloud.lastStr){setSync('idle');return;}
    setSync('saving');
    await writeMeta(cu,pick.str);
    cloud.lastStr=pick.str;cloud.fails=0;setSync('idle');
    if(pick.level>0&&!cloud.trimmed){cloud.trimmed=true;toast('Some older history was left out of your account copy to stay under its storage limit','ℹ️',5000);}
  }catch(e){
    console.warn('save to account failed',e);
    cloud.fails++;setSync('error');
    if(cloud.fails<=3)cloud.t=setTimeout(pushNow,15000*cloud.fails);
    else if(cloud.fails===4)toast("Couldn't save to your account",'⚠️');
  }finally{
    cloud.busy=false;
    if(cloud.again){cloud.again=false;scheduleSync();}
  }
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&cloud.t){clearTimeout(cloud.t);pushNow();}});
window.addEventListener('pagehide',()=>{if(cloud.t){clearTimeout(cloud.t);pushNow();}});

/* user + header */
function mapUser(cu){
  if(!cu)return null;
  const email=(cu.primaryEmailAddress&&cu.primaryEmailAddress.emailAddress)||'';
  return{id:cu.id,name:cu.fullName||cu.username||cu.firstName||(email?email.split('@')[0]:'You'),avatarUrl:cu.imageUrl||'',hasImage:!!cu.hasImage,email,handle:cu.username?'@'+cu.username:email};
}
function updateUserUI(){
  const b=$('user-ava-btn'),s=$('sign-in-btn');
  s.classList.toggle('wait',AUTH.state==='loading');
  if(user){
    s.style.display='none';b.style.display='flex';b.style.background=clr(user.name);
    b.setAttribute('aria-label','Account: '+user.name);b.title=user.name;
    const ini=()=>{b.textContent=user.name.charAt(0).toUpperCase();};
    if(user.avatarUrl){b.innerHTML='<img src="'+esc(user.avatarUrl)+'" alt="">';b.querySelector('img').onerror=ini;}else ini();
  }else{s.style.display='flex';b.style.display='none';}
}
async function onAuthUser(cu){
  const first=AUTH.first;AUTH.first=false;
  if(cu){
    if(AUTH.cu&&AUTH.cu.id===cu.id){AUTH.cu=cu;user=mapUser(cu);updateUserUI();return;}
    AUTH.cu=cu;user=mapUser(cu);updateUserUI();
    const prev=lsRaw('yt_uid');
    if(prev&&prev!==cu.id)wipeUserData();                       // leftovers from a different account
    const wasSynced=prev===cu.id;
    const raw=cu.unsafeMetadata&&cu.unsafeMetadata.yt;
    const sn=raw?parseSnapshot(raw):null;
    if(sn)applySnapshot(sn,wasSynced?'replace':'merge');        // first time on this device: keep guest data too
    try{localStorage.setItem('yt_uid',cu.id);}catch(e){}
    cloud.lastStr=typeof raw==='string'?raw:'';cloud.ready=true;cloud.fails=0;setSync('idle');
    navCollapsed=!!cfg.compact;applyNav();renderSidebar();
    if(!wasSynced||sn)scheduleSync();
    if(sn&&(curRoute==='feed'||curRoute==='playlist'))render();
    hydrateStubs().then(ch=>{if(ch&&AUTH.cu&&AUTH.cu.id===cu.id){renderSidebar();if(curRoute==='feed'||curRoute==='playlist')render();}}).catch(()=>{});
    if(!first)toast('Signed in as '+user.name,'👋');
  }else{
    const had=!!AUTH.cu;
    AUTH.cu=null;user=null;cloud.ready=false;clearTimeout(cloud.t);cloud.t=null;
    if(had||lsRaw('yt_uid')){wipeUserData();renderSidebar();if(['feed','playlist','home'].indexOf(curRoute)>=0)render();}
    updateUserUI();
    if(had&&!first)toast('Signed out','👋');
  }
}
let authTry=0;
function initAuth(){
  const my=++authTry;
  AUTH.state='loading';updateUserUI();
  const waitForClerk=()=>new Promise(res=>{const t0=Date.now();(function poll(){if(window.Clerk)return res(window.Clerk);if(Date.now()-t0>10000)return res(null);setTimeout(poll,150);})();});
  (async()=>{
    const C=await waitForClerk();
    if(my!==authTry)return;
    if(!C){AUTH.state='off';updateUserUI();return;}
    try{
      if(!C.loaded){
        const opts=window.__internal_ClerkUICtor?{ui:{ClerkUI:window.__internal_ClerkUICtor}}:{};
        await Promise.race([C.load(opts),new Promise((_,rej)=>setTimeout(()=>rej(new Error('Clerk took too long to load')),15000))]);
      }
    }catch(e){console.warn('Clerk failed to load',e);if(my===authTry){AUTH.state='off';updateUserUI();}return;}
    if(my!==authTry)return;
    AUTH.clerk=C;AUTH.state='ready';
    if(!AUTH.listening){AUTH.listening=true;C.addListener(em=>{onAuthUser((em&&em.user)||null);});}
    updateUserUI();
    if(!AUTH.cu&&C.user)onAuthUser(C.user);
    else if(!AUTH.cu&&AUTH.first&&C.isSignedIn===false)onAuthUser(null);
  })();
}
function startSignIn(){
  if(AUTH.state==='ready'&&AUTH.clerk){
    try{AUTH.clerk.openSignIn({fallbackRedirectUrl:location.href,signUpFallbackRedirectUrl:location.href});}catch(e){toast("Couldn't open sign-in",'⚠️');}
    return;
  }
  if(AUTH.state==='loading'){toast('Sign-in is still loading…','⏳');return;}
  toast('Sign-in could not load. It may be blocked on this network. Trying again…','⚠️',4000);initAuth();
}
function accountDialog(){
  if(!user){startSignIn();return;}
  const ava='<span class="ava" style="width:80px;height:80px;font-size:36px;background:'+clr(user.name)+'">'+(user.avatarUrl?'<img src="'+esc(user.avatarUrl)+'" alt="">':esc(user.name.charAt(0).toUpperCase()))+'</span>';
  dialog('Your account','<div class="acct">'+ava+'<b class="acct-name">'+esc(user.name)+'</b><span class="muted">'+esc(user.email||user.handle||'')+'</span><div class="sync-line" id="sync-line">'+esc(syncText())+'</div></div>'+
    '<div class="acct-btns"><button class="pill-blue" data-act="acct-avatar">Update profile picture</button><button class="pill" data-act="acct-manage">Manage account</button><button class="pill" data-act="acct-out">Sign out</button></div>'+
    '<p class="muted acct-note">Your subscriptions, playlists, liked videos, watch history and settings are saved to this account.</p>');
}
$('sign-in-btn').addEventListener('click',startSignIn);
$('user-ava-btn').addEventListener('click',accountDialog);

/* ================= PROFILE PICTURE CROP ================= */
const crop={img:null,url:null,w:0,h:0,min:1,z:1,ox:0,oy:0,S:320,C:280,dpr:1,drag:null,saving:false};
const MINUS='<svg viewBox="0 0 24 24"><path d="M19 13H5v-2h14v2z"/></svg>';
function avatarDialog(){
  if(!AUTH.cu){startSignIn();return;}
  dialog('Update profile picture',
    '<div class="crop"><div class="crop-drop" id="crop-drop" tabindex="0"><svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg><div>Drag a photo here</div><button class="pill-blue" data-act="crop-pick">Choose a photo</button><div class="muted" style="font-size:12px">PNG, JPG, WEBP or GIF</div>'+(AUTH.cu.hasImage?'<button class="pill" data-act="crop-remove">Remove current photo</button>':'')+'</div>'+
    '<input type="file" id="crop-file" accept="image/png,image/jpeg,image/webp,image/gif" hidden>'+
